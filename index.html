<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">

<link rel="apple-touch-icon" href="icon-192.png">
<title>Controle Financeiro</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1d2330;--muted:#6b7385;--line:#e3e6ee;--accent:#2f6fed;--good:#1f9d62;--bad:#d64545;--header:#1d2330;--aviso:#fff4d6;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2c;--ink:#e7ebf3;--muted:#9aa4b8;--line:#2a3345;--accent:#4d86f5;--good:#2fbf7c;--bad:#ef6464;--header:#0a0e17;--aviso:#3a2f10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2c;--ink:#e7ebf3;--muted:#9aa4b8;--line:#2a3345;--accent:#4d86f5;--good:#2fbf7c;--bad:#ef6464;--header:#0a0e17;--aviso:#3a2f10;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--header);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{font-size:18px;margin:0}
.abas{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
main{max-width:1100px;margin:0 auto;padding:20px;display:grid;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:13px;margin:0 0 12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.big{font-size:22px;font-weight:700;margin:4px 0}
.pos{color:var(--good)}
.neg{color:var(--bad)}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:#fff;border:1px solid #fff}
button.tab{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 12px}
button.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{background:var(--bad)}
button.small{padding:3px 9px;font-size:13px}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;width:100%;background:var(--card);color:var(--ink)}
input[type=checkbox]{width:auto}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
form.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
form.fields button{height:38px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}
.bar>div{height:100%;background:var(--good)}
.bar>div.over{background:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:0 6px 6px 0}
p{margin:6px 0}
[hidden]{display:none!important}
.gauge{display:grid;justify-items:center;text-align:center;gap:4px;align-content:start}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
.aviso{background:var(--aviso);border:1px solid #e0a100;border-radius:10px;padding:10px 14px;margin:12px 20px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.aviso button{background:#e0a100}
@media(max-width:600px){th,td{font-size:13px}main{padding:12px}header{padding:12px 14px}header h1{width:100%}header .row{width:100%}header .row button{flex:1 1 auto;padding:8px 10px}form.fields{grid-template-columns:1fr 1fr}.card{padding:14px}.aviso{margin:10px 12px 0}}
@media(max-width:380px){form.fields{grid-template-columns:1fr}}
@media print{header,.abas,#aviso,.aviso,form,button,.row{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{break-inside:avoid;border:1px solid #999;box-shadow:none}}
</style>
</head>
<body>
<header>
  <h1>Controle Financeiro</h1>
  <div class="row">
    <button class="ghost" onclick="$('fx').click()">Importar planilha .xlsx</button>
    <button class="ghost" onclick="$('fj').click()">Importar backup .json</button>
    <button class="ghost" onclick="exportar()">Exportar .json</button>
    <button class="ghost" onclick="exportarPlanilha()">Exportar planilha .xlsx</button>
    <button class="ghost" onclick="exemplo()">Carregar exemplo</button>
    <button class="ghost" onclick="zerar()">Zerar tudo</button>
  </div>
</header>
<div id="aviso"></div>
<nav class="abas" id="abas"></nav>
<main id="conteudo"></main>
<input type="file" id="fx" accept=".xlsx,.xls" hidden>
<input type="file" id="fj" accept=".json,application/json" hidden>

<script>
const KEY = 'controle-financeiro-v2';
const KEY1 = 'controle-financeiro-v1';
const CATS = ['Moradia','Alimentação','Transporte','Saúde','Lazer','Educação','Vestuário','Assinaturas','Outros'];
const GRUPOS = ['Receita','Fixo','Cartão'];
const FORMAS = ['Cartão','Pix','Débito','Dinheiro','Boleto','Outros'];
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = arr => arr.reduce((s, x) => s + (Number(x.valor) || 0), 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const mkOf = d => String(d || '').slice(0, 7);
const mIdx = m => { const [y, mo] = m.split('-').map(Number); return y * 12 + mo - 1; };
const addM = (m, n) => { const k = mIdx(m) + n; return `${Math.floor(k / 12)}-${pad(k % 12 + 1)}`; };
const mNome = m => { const [y, mo] = m.split('-'); return `${MESES[Number(mo) - 1]}/${y}`; };
const fmtData = s => (s ? s.split('-').reverse().join('/') : '—');
const pct = v => (v * 100).toFixed(2).replace('.', ',') + '%';

function isoData(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number') return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[2]}-${m[1]}`;
  m = s.match(/^\d{4}-\d{2}-\d{2}/);
  return m ? m[0] : '';
}

/* ---------- modelo de dados ---------- */
function blank() {
  return {
    config: { saldoConta: 0, primeiroMes: '2026-11', mesRef: mkOf(hoje()), cartoes: ['Nubank', 'Itaú'], categorias: [...CATS] },
    orcamento: {},
    orcamentoMeses: {},
    recorrentes: [],
    parcelados: [],
    estornos: [],
    eventuais: [],
    lancamentos: [],
    ferias: {},
    patrimonio: { valorInicial: 200, dataInicio: '2026-10-21', meta: 0, prazoAnos: 10, taxaAnual: 0.08, aporteMensal: 0, aportes: [] }
  };
}

function deBackup(d) {
  const b = blank();
  const m = d.metas || {};
  b.patrimonio = {
    valorInicial: Number(m.valorInicial) || 0,
    dataInicio: m.dataInicio || hoje(),
    meta: Number(m.meta) || 0,
    prazoAnos: Number(m.prazoAnos) || 0,
    taxaAnual: Number(m.taxaAnual) || 0,
    aporteMensal: Number(m.aporteMensal) || 0,
    aportes: (d.aportes || []).map(a => ({ id: uid(), data: a.data || hoje(), valor: Number(a.valor) || 0, descricao: a.descricao || '' }))
  };
  b.lancamentos = (d.gastos || []).map(g => ({
    id: uid(), data: g.data || hoje(), descricao: g.descricao || '', categoria: g.categoria || 'Outros', valor: Number(g.valor) || 0, forma: ''
  }));
  const cats = [...b.config.categorias];
  (d.categorias || []).forEach(c => { if (c.nome && !cats.includes(c.nome)) cats.push(c.nome); });
  b.config.categorias = cats;
  return b;
}

function carregar() {
  try {
    const v2 = localStorage.getItem(KEY);
    if (v2) return Object.assign(blank(), JSON.parse(v2));
    const v1 = localStorage.getItem(KEY1);
    if (v1) return deBackup(JSON.parse(v1));
  } catch (e) {}
  return blank();
}

let S = carregar();
let aba = 'resumo';
let filtroMes = '';

let falhaSalvar = false; // true quando o navegador recusa gravar (armazenamento cheio ou bloqueado)
function salvar() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); falhaSalvar = false; } catch (e) { falhaSalvar = true; }
}
function commit() { S.modificadoEm = agoraISO(); salvar(); render(); agendarEnvio(); }

/* ---------- cálculos (replicam as fórmulas da planilha) ---------- */
const ativo = (it, m) =>
  mIdx(mkOf(it.inicio)) <= mIdx(m) && mIdx(it.fim ? mkOf(it.fim) : '2099-12') >= mIdx(m);

const valorParcela = p => (p.valorParcela != null ? p.valorParcela : Math.round(p.valorTotal / p.parcelas * 100) / 100);
const ultimaParcela = p => addM(p.inicio, p.parcelas - 1);
const parcelaAtiva = (p, m) => mIdx(p.inicio) <= mIdx(m) && mIdx(ultimaParcela(p)) >= mIdx(m);

const sumRec = (grupo, m) => S.recorrentes.filter(r => r.grupo === grupo && ativo(r, m)).reduce((a, r) => a + r.valor, 0);
const sumEv = (tipo, m) => S.eventuais.filter(e => e.tipo === tipo && e.mes === m).reduce((a, e) => a + e.valor, 0);
// Estornos e abatimentos: créditos lançados num mês de fatura, ligados a uma compra parcelada.
// Estorno: crédito único no mês da fatura. Abatimento: dividido igualmente pelas parcelas
// restantes a partir do mês escolhido (ou do início da compra, se o mês for anterior).
function intervaloAjuste(e) {
  const p = parcDe(e);
  if (e.tipo !== 'Abatimento') return { ini: e.mes, fim: e.mes, meses: 1 };
  const ini = mIdx(e.mes) > mIdx(p.inicio) ? e.mes : p.inicio;
  const fim = ultimaParcela(p);
  if (mIdx(ini) > mIdx(fim)) return { ini: e.mes, fim: e.mes, meses: 1 };
  return { ini, fim, meses: mIdx(fim) - mIdx(ini) + 1 };
}
const valorAjusteMes = (e, m) => {
  const i = intervaloAjuste(e);
  return mIdx(m) >= mIdx(i.ini) && mIdx(m) <= mIdx(i.fim) ? e.valor / i.meses : 0;
};
const ajustesMes = m => (S.estornos || []).filter(e => parcDe(e) && valorAjusteMes(e, m) !== 0);
const somaAjustes = (m, filtro = () => true) => ajustesMes(m).filter(filtro).reduce((a, e) => a + valorAjusteMes(e, m), 0);
const parcDe = e => S.parcelados.find(p => p.id === e.parcelaId);
const fatCartao = (c, m) =>
  S.parcelados.filter(p => p.cartao === c && parcelaAtiva(p, m)).reduce((a, p) => a + valorParcela(p), 0) +
  S.recorrentes.filter(r => r.grupo === 'Cartão' && r.cartao === c && ativo(r, m)).reduce((a, r) => a + r.valor, 0) -
  somaAjustes(m, e => parcDe(e).cartao === c);
const faturaTotal = m => S.config.cartoes.reduce((a, c) => a + fatCartao(c, m), 0);
const execMes = m =>
  S.lancamentos.filter(l => mkOf(l.data) === m).reduce((a, l) => a + l.valor, 0) +
  S.parcelados.filter(p => parcelaAtiva(p, m)).reduce((a, p) => a + valorParcela(p), 0) -
  somaAjustes(m);
const execCat = (c, m) =>
  S.lancamentos.filter(l => l.categoria === c && mkOf(l.data) === m).reduce((a, l) => a + l.valor, 0) +
  S.parcelados.filter(p => (p.categoria || 'Outros') === c && parcelaAtiva(p, m)).reduce((a, p) => a + valorParcela(p), 0) -
  somaAjustes(m, e => (parcDe(e).categoria || 'Outros') === c);
// Orçamento de um mês: o próprio, se existir; senão, o padrão (S.orcamento).
const orcEfetivo = m => S.orcamentoMeses[m] || S.orcamento;
const totalOrc = (m = S.config.mesRef) => {
  const o = orcEfetivo(m);
  return S.config.categorias.reduce((a, c) => a + (Number(o[c]) || 0), 0);
};

function mesBase(m) {
  const rf = sumRec('Receita', m), re = sumEv('Receita', m), ef = sumRec('Fixo', m);
  const fat = faturaTotal(m), ed = sumEv('Despesa', m), ov = totalOrc(m);
  return { rf, re, rt: rf + re, ef, fat, ed, ov, I: ef + fat + ed + ov };
}

function projecao(n) {
  const base = S.config.primeiroMes;
  const rows = [];
  for (let i = 0; i <= n; i++) {
    const m = addM(base, i);
    rows.push({ m, ...mesBase(m), ferias: !!S.ferias[m] });
  }
  let acum = S.config.saldoConta;
  const out = [];
  for (let i = 0; i < n; i++) {
    const r = rows[i];
    const adj = (r.ferias ? rows[i + 1].I : 0) - (i > 0 && rows[i - 1].ferias ? r.I : 0);
    r.adj = adj;
    r.L = r.I + adj;
    r.saldo = r.rt - r.L;
    acum += r.saldo;
    r.acum = acum;
    r.exec = execMes(r.m);
    r.futuro = mIdx(r.m) > mIdx(mkOf(hoje()));
    r.dif = r.futuro ? 0 : r.L - r.exec; // meses futuros ainda não têm execução
    out.push(r);
  }
  return out;
}

function projPatr() {
  const p = S.patrimonio;
  const P = p.valorInicial + sum(p.aportes);
  const i = Math.pow(1 + p.taxaAnual, 1 / 12) - 1;
  const n = Math.round(p.prazoAnos * 12);
  const A = p.aporteMensal;
  const fv = i === 0 ? P + A * n : P * Math.pow(1 + i, n) + A * (Math.pow(1 + i, n) - 1) / i;
  let mes = null;
  if (p.meta > 0) {
    if (P >= p.meta) mes = 0;
    else {
      let b = P;
      for (let k = 1; k <= 1200; k++) { b = b * (1 + i) + A; if (b >= p.meta) { mes = k; break; } }
    }
  }
  return { P, fv, i, mes };
}

/* ---------- ações ---------- */
function ir(k) { aba = k; try { localStorage.setItem('cf-aba', k); } catch (e) {} render(); }
function lerAba() {
  try { const k = localStorage.getItem('cf-aba'); if (k && V[k]) return k; } catch (e) {}
  return 'resumo';
}

function card(titulo, valor, sub, cls = '') {
  return `<div class="card"><h2>${titulo}</h2><div class="big ${cls}">${valor}</div><div class="muted">${sub}</div></div>`;
}
const opts = (arr, sel) => arr.map(x => `<option ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('');

/* ---------- visões ---------- */
const V = {};

/* ---------- pontuação ---------- */
const clamp01 = x => Math.max(0, Math.min(1, x));
const pctTxt = v => (v * 100).toFixed(1).replace('.', ',') + '%';
const soma = (g, k) => g.reduce((a, r) => a + r[k], 0);
const abrevMoeda = v => (v < 0 ? '−' : '') + 'R$ ' +
  (Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(1).replace('.', ',') + 'k' : Math.round(Math.abs(v)));

// Saúde financeira sobre os 36 meses da projeção.
function scoreSaude() {
  const proj = projecao(36);
  const rt = soma(proj, 'rt');
  const saldo = soma(proj, 'saldo');
  const L = soma(proj, 'L');
  const fixasFat = proj.reduce((a, r) => a + r.ef + r.fat, 0);
  const taxa = rt > 0 ? saldo / rt : 0;
  const comprom = rt > 0 ? fixasFat / rt : 1;
  const positivos = proj.filter(r => r.acum >= 0).length / proj.length;
  const mediaDesp = L / proj.length;
  const reserva = mediaDesp > 0 ? proj[11].acum / mediaDesp : 0;
  const partes = [
    { nome: 'Poupança', peso: 40, valor: clamp01(taxa / 0.40),
      desc: `Sobra média de ${pctTxt(taxa)} da receita (100 pontos a partir de 40%)` },
    { nome: 'Saldo positivo', peso: 25, valor: positivos,
      desc: `${Math.round(positivos * 100)}% dos meses com saldo acumulado positivo` },
    { nome: 'Comprometimento', peso: 20, valor: clamp01((0.9 - comprom) / 0.4),
      desc: `Fixos e faturas consomem ${pctTxt(comprom)} da receita (ideal: até 50%)` },
    { nome: 'Reserva', peso: 15, valor: clamp01(reserva / 6),
      desc: `Saldo cobre ${reserva.toFixed(1).replace('.', ',')} meses de despesa em 12 meses (meta: 6)` }
  ];
  const score = Math.round(partes.reduce((a, p) => a + p.valor * p.peso, 0));
  return { score, partes };
}

// Aderência ao orçado no mês: categorias com orçamento > 0.
// Dentro do orçado = 100; cada 1% acima do orçado tira 2 pontos.
function scoreOrcamento(m) {
  const orc = orcEfetivo(m);
  const cats = S.config.categorias.filter(c => (Number(orc[c]) || 0) > 0);
  const execTotal = execMes(m);
  if (!cats.length) return { score: null, itens: [], semOrc: execTotal };
  const itens = cats.map(c => {
    const b = Number(orc[c]);
    const e = execCat(c, m);
    const s = e <= b ? 1 : clamp01(1 - 2 * (e / b - 1));
    return { c, b, e, s };
  });
  const score = Math.round(itens.reduce((a, i) => a + i.s, 0) / itens.length * 100);
  const semOrc = execTotal - soma(itens.map(i => ({ e: i.e })), 'e');
  return { score, itens, semOrc };
}

function gauge(score, titulo, sub) {
  const r = 52, c = 2 * Math.PI * r;
  const ok = score != null;
  const cor = !ok ? '#e3e6ee' : score >= 80 ? '#1f9d62' : score >= 60 ? '#2f6fed' : score >= 40 ? '#e0a100' : '#d64545';
  const faixa = !ok ? 'Sem dados' : score >= 80 ? 'Ótima' : score >= 60 ? 'Boa' : score >= 40 ? 'Atenção' : 'Crítica';
  const off = ok ? c * (1 - score / 100) : c;
  return `<div class="card gauge">
    <h2>${titulo}</h2>
    <svg viewBox="0 0 140 140" width="150" height="150">
      <circle cx="70" cy="70" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="12"/>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="${cor}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 70 70)"/>
      <text x="70" y="80" text-anchor="middle" font-size="30" font-weight="700" style="fill:var(--ink)">${ok ? score : '—'}</text>
    </svg>
    <div><b style="color:${ok ? cor : 'var(--muted)'}">${faixa}</b></div>
    <div class="muted">${sub}</div>
  </div>`;
}

function blocoScores(m = S.config.mesRef) {
  const sa = scoreSaude();
  const so = scoreOrcamento(m);
  const detalhe = sa.partes.map(p => `<div style="margin:10px 0">
      <div class="row" style="justify-content:space-between"><span>${p.nome} <span class="muted">(peso ${p.peso}%)</span></span><b>${Math.round(p.valor * 100)}/100</b></div>
      <div class="bar" style="height:10px"><div style="width:${(p.valor * 100).toFixed(1)}%"></div></div>
      <div class="muted">${p.desc}</div>
    </div>`).join('');
  return `<section class="grid">
    ${gauge(sa.score, 'Saúde financeira · 36 meses', 'Poupança, saldo, comprometimento e reserva')}
    ${gauge(so.score, `Aderência ao orçado · ${mNome(m)}`, so.score == null ? 'Defina o orçamento do mês para pontuar' : `Gasto sem orçamento: ${brl(so.semOrc)}`)}
    <section class="card" style="grid-column:1/-1"><h2>Como a saúde financeira é calculada</h2>${detalhe}</section>
  </section>`;
}

/* ---------- visão simplificada da projeção ---------- */
let periodoProj = 1;
let detalheAberto = false; // mantém a análise detalhada aberta entre redesenhos
const PERIODOS = { 1: 'Mensal', 3: 'Trimestral', 6: 'Semestral' };
function setPeriodo(n) { periodoProj = n; render(); }

function agruparPeriodos(rows, n) {
  const grupos = [];
  for (let i = 0; i < rows.length; i += n) {
    const g = rows.slice(i, i + n);
    const ini = g[0].m, fim = g[g.length - 1].m;
    grupos.push({
      curto: mNome(ini),
      rotulo: n === 1 ? mNome(ini) : `${mNome(ini)} – ${mNome(fim)}`,
      rt: soma(g, 'rt'), L: soma(g, 'L'), saldo: soma(g, 'saldo'),
      acum: g[g.length - 1].acum, exec: soma(g, 'exec'), dif: soma(g, 'dif'),
      futuro: g.every(r => r.futuro)
    });
  }
  return grupos;
}

function graficoProj(grupos) {
  const W = 760, H = 300, P = { l: 78, r: 16, t: 14, b: 44 };
  const valores = [0, ...grupos.flatMap(g => [g.rt, g.L, g.acum])];
  const yMin = Math.min(...valores), yMax = Math.max(yMin + 1, ...valores);
  const y = v => P.t + (1 - (v - yMin) / (yMax - yMin)) * (H - P.t - P.b);
  const y0 = y(0);
  const gw = (W - P.l - P.r) / grupos.length;
  const bw = Math.max(3, Math.min(20, gw * 0.36));
  const passo = Math.ceil(grupos.length / 12);
  const barra = (x, v, cor) => {
    const yv = y(v);
    return `<rect x="${x.toFixed(1)}" y="${Math.min(yv, y0).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(yv - y0)).toFixed(1)}" style="fill:${cor}"/>`;
  };
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Receitas, despesas e saldo acumulado por período">`;
  for (let k = 0; k <= 4; k++) {
    const v = yMin + (yMax - yMin) * k / 4, yy = y(v).toFixed(1);
    svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/>`;
    svg += `<text x="${P.l - 8}" y="${yy}" dy="4" text-anchor="end" font-size="11" style="fill:var(--muted)">${abrevMoeda(v)}</text>`;
  }
  grupos.forEach((g, i) => {
    const cx = P.l + i * gw + gw / 2;
    svg += barra(cx - bw - 1, g.rt, 'var(--good)');
    svg += barra(cx + 1, g.L, 'var(--bad)');
    if (i % passo === 0) svg += `<text x="${cx.toFixed(1)}" y="${H - P.b + 16}" text-anchor="middle" font-size="10" style="fill:var(--muted)">${esc(g.curto)}</text>`;
  });
  const pts = grupos.map((g, i) => `${(P.l + i * gw + gw / 2).toFixed(1)},${y(g.acum).toFixed(1)}`);
  svg += `<polyline fill="none" stroke-width="2.5" style="stroke:var(--accent)" points="${pts.join(' ')}"/>`;
  grupos.forEach((g, i) => {
    svg += `<circle cx="${(P.l + i * gw + gw / 2).toFixed(1)}" cy="${y(g.acum).toFixed(1)}" r="2.5" style="fill:var(--accent)"/>`;
  });
  return svg + '</svg>';
}

/* ---------- simulador de gasto (nada é salvo) ---------- */
const simEntrada = { valor: 300, categoria: '', mes: '', parcelas: 1 };

// Gastos simulados viram lançamentos (orçamento da categoria) e despesas eventuais (saldo do mês).
function geraSimulacao({ valor, categoria, mes, parcelas }) {
  const n = Math.max(1, Math.round(parcelas));
  const parcela = Math.round(valor / n * 100) / 100;
  const lancs = [], evs = [];
  for (let i = 0; i < n; i++) {
    const m = addM(mes, i);
    lancs.push({ id: 'sim' + i, data: m + '-01', descricao: 'Simulação', categoria, valor: parcela, forma: '' });
    evs.push({ id: 'sim' + i, mes: m, descricao: 'Simulação', tipo: 'Despesa', valor: parcela });
  }
  return { lancs, evs, parcela, n };
}

// Aplica a simulação só durante fn(), depois restaura os dados reais.
function comGasto(gasto, fn) {
  const L0 = S.lancamentos, E0 = S.eventuais;
  const { lancs, evs } = geraSimulacao(gasto);
  S.lancamentos = L0.concat(lancs);
  S.eventuais = E0.concat(evs);
  try { return fn(); } finally { S.lancamentos = L0; S.eventuais = E0; }
}

// Foto do mês e da categoria com os dados atuais.
function foto(mes, cat) {
  const orc = Number(orcEfetivo(mes)[cat]) || 0;
  const exec = execCat(cat, mes);
  const proj = projecao(36);
  const linha = proj.find(r => r.m === mes);
  const negativo = proj.find(r => r.acum < 0);
  return {
    orc, exec,
    saldoMes: linha ? linha.saldo : 0,
    acumFim: proj[proj.length - 1].acum,
    primeiroNeg: negativo ? negativo.m : null,
    scoreOrc: scoreOrcamento(mes).score,
    scoreSau: scoreSaude().score
  };
}

function simRodar(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  simEntrada.valor = Number(f.get('valor')) || 0;
  simEntrada.categoria = f.get('categoria');
  simEntrada.mes = f.get('mes');
  simEntrada.parcelas = Math.min(36, Math.max(1, Math.round(Number(f.get('parcelas')) || 1)));
  render();
}

const txtScore = v => (v == null ? '—' : v + '/100');
const txtNeg = v => (v == null ? 'nenhum' : mNome(v));

// Veredito com comentários. Regras: "Não recomendado" (estoura o orçamento ou torna o saldo negativo),
// "com cuidado" (deixa pouco no orçamento ou derruba a pontuação em 10+ pontos), "possível" (demais casos).
function veredito(a, d, g) {
  const motivos = [];
  let nivel = 'ok';
  const restD = d.orc - d.exec;
  if (d.orc > 0 && restD < 0) {
    nivel = 'nao';
    motivos.push(`Estoura o orçamento de ${g.categoria} em ${brl(-restD)}.`);
  } else if (d.orc > 0 && restD < d.orc * 0.2) {
    nivel = 'cuidado';
    motivos.push(`Deixa só ${brl(restD)} do orçamento de ${g.categoria} para o resto do mês (menos de 20%).`);
  }
  if (d.primeiroNeg && (!a.primeiroNeg || mIdx(d.primeiroNeg) < mIdx(a.primeiroNeg))) {
    nivel = 'nao';
    motivos.push(`Faz o saldo acumulado ficar negativo a partir de ${mNome(d.primeiroNeg)}.`);
  }
  if (d.saldoMes < 0 && a.saldoMes >= 0) {
    nivel = 'nao';
    motivos.push(`Deixa o mês no vermelho: saldo de ${brl(d.saldoMes)}.`);
  }
  if (a.scoreSau != null && d.scoreSau != null && a.scoreSau - d.scoreSau >= 10) {
    if (nivel === 'ok') nivel = 'cuidado';
    motivos.push(`Reduz a saúde financeira de ${a.scoreSau} para ${d.scoreSau} pontos.`);
  }
  if (a.scoreOrc != null && d.scoreOrc != null && a.scoreOrc - d.scoreOrc >= 10) {
    if (nivel === 'ok') nivel = 'cuidado';
    motivos.push(`Reduz a aderência ao orçamento de ${a.scoreOrc} para ${d.scoreOrc} pontos.`);
  }
  if (nivel === 'ok') motivos.unshift('Cabe no orçamento da categoria e não compromete o saldo projetado.');
  return { nivel, motivos };
}

// Infográfico em barras: orçamento, saldo do mês e pontuações, antes e depois da compra.
function infografico(a, d, g) {
  const LARG = 300, X0 = 200, ALT = 22, GAP = 10, W = 640;
  let y = 0, out = '';
  const titulo = t => { y += 6; out += `<text x="0" y="${y + 14}" font-size="13" font-weight="700" fill="currentColor">${esc(t)}</text>`; y += 26; };
  const barra = (rot, val, maxV, cor, txt) => {
    const w = maxV > 0 ? Math.min(1, Math.abs(val) / maxV) * LARG : 0;
    out += `<text x="0" y="${y + 16}" font-size="12" fill="#6b7385">${esc(rot)}</text>
      <rect x="${X0}" y="${y}" width="${LARG}" height="${ALT}" rx="5" fill="#e3e6ee"/>
      <rect x="${X0}" y="${y}" width="${w.toFixed(1)}" height="${ALT}" rx="5" fill="${cor}"/>
      <text x="${X0 + LARG + 8}" y="${y + 16}" font-size="12" fill="currentColor">${esc(txt)}</text>`;
    y += ALT + GAP;
  };
  if (a.orc > 0) {
    const m = Math.max(a.orc, a.exec, d.exec, 1);
    titulo(`Orçamento de ${g.categoria}`);
    barra('Orçamento', a.orc, m, '#6b7385', brl(a.orc));
    barra('Gasto antes', a.exec, m, '#2f6fed', brl(a.exec));
    barra('Gasto depois', d.exec, m, d.exec > d.orc ? '#d64545' : '#1f9d62', brl(d.exec));
  }
  const ms = Math.max(Math.abs(a.saldoMes), Math.abs(d.saldoMes), 1);
  titulo('Saldo do mês');
  barra('Antes', a.saldoMes, ms, a.saldoMes < 0 ? '#d64545' : '#2f6fed', brl(a.saldoMes));
  barra('Depois', d.saldoMes, ms, d.saldoMes < 0 ? '#d64545' : '#1f9d62', brl(d.saldoMes));
  if (a.scoreSau != null && d.scoreSau != null) {
    titulo('Saúde financeira (0 a 100)');
    barra('Antes', a.scoreSau, 100, '#2f6fed', a.scoreSau + '/100');
    barra('Depois', d.scoreSau, 100, d.scoreSau < a.scoreSau ? '#d64545' : '#1f9d62', d.scoreSau + '/100');
  }
  return `<svg viewBox="0 0 ${W} ${y + 4}" width="100%" role="img" aria-label="Efeitos da compra" style="max-width:${W}px;font-family:system-ui,sans-serif;color:var(--ink)">${out}</svg>`;
}

         ${linhaComparacao('Orçamento do mês', antes.orc, depois.orc)}

       </tbody></table>

    : `<p class="muted">A categoria ${esc(g.categoria)} não tem orçamento em ${mNome(g.mes)}. Defina o orçamento para ver o efeito.</p>`;

};

// Maior valor que ainda dá "Compra possível" (busca por bisseção, em centavos).
function maxPossivel(mes, cat, parcelas) {
  const a = foto(mes, cat);
  const ok = v => v <= 0 || comGasto({ valor: v, categoria: cat, mes, parcelas }, () => veredito(a, foto(mes, cat), { categoria: cat })).nivel === 'ok';
  if (!ok(0.01)) return 0;
  let lo = 0, hi = 1e6;
  if (ok(hi)) return hi;
  for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (ok(mid)) lo = mid; else hi = mid; }
  return Math.floor(lo * 100 + 1e-6) / 100;
}

// O mesmo valor total, em opções diferentes de parcelamento.
function cenarios(valor, cat, mes, opcoes) {
  const a = foto(mes, cat);
  return opcoes.map(n => {
    const g = { valor, categoria: cat, mes, parcelas: n };
    const d = comGasto(g, () => foto(mes, cat));
    return { n, parcela: geraSimulacao(g).parcela, nivel: veredito(a, d, { categoria: cat }).nivel, restante: d.orc - d.exec };
  });
}

// Meta: quanto guardar por mês para juntar o valor até a data, com a sobra média prevista.
function metaCompra(valor, alvo) {
  const meses = Math.max(1, mIdx(alvo) - mIdx(mkOf(hoje())));
  const porMes = valor / meses;
  const linhas = projecao(36).filter(r => mIdx(r.m) >= mIdx(S.config.primeiroMes) && mIdx(r.m) <= mIdx(alvo));
  const saldoMedio = linhas.length ? linhas.reduce((t, r) => t + r.saldo, 0) / linhas.length : 0;
  return { meses, porMes, saldoMedio, viavel: saldoMedio >= porMes, mesesNecessarios: saldoMedio > 0 ? Math.ceil(valor / saldoMedio) : null };
}

// Registra a compra simulada: no cartão (parcelado) ou no saldo do mês (lançamentos + despesas eventuais).
function registrarCompra(g, descricao, cartao) {
  const { parcela, n } = geraSimulacao(g);
  const nome = descricao || 'Compra planejada';
  if (cartao) {
    S.parcelados.push({ id: uid(), dataCompra: hoje(), cartao, descricao: nome, categoria: g.categoria, valorTotal: g.valor, parcelas: n, inicio: g.mes, valorParcela: parcela });
  } else {
    for (let i = 0; i < n; i++) {
      const m = addM(g.mes, i);
      S.lancamentos.push({ id: uid(), data: m + '-01', descricao: nome, categoria: g.categoria, valor: parcela, forma: 'Planejada' });
      S.eventuais.push({ id: uid(), mes: m, descricao: nome, tipo: 'Despesa', valor: parcela });
    }
  }
  commit();
}

function registrarSim(e) {
  e.preventDefault();
  if (!(simEntrada.valor > 0)) return alert('Informe um valor maior que zero na simulação.');
  const f = new FormData(e.target);
  registrarCompra({ ...simEntrada }, f.get('descricao'), f.get('cartao'));
  alert('Compra registrada. Ela aparece em Lançamentos e na projeção.');
}

const metaEntrada = { valor: 1200, alvo: '' };
function metaRodar(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  metaEntrada.valor = Number(f.get('valor')) || 0;
  metaEntrada.alvo = f.get('alvo');
  render();
}

const VCORES = { ok: '#1f9d62', cuidado: '#d68a1a', nao: '#d64545' };
const VROT = { ok: 'Compra possível', cuidado: 'Compra possível com cuidado', nao: 'Não recomendado' };

function blocosSimulador() {
  const meses = Array.from({ length: 36 }, (_, i) => addM(S.config.primeiroMes, i));
  const g = { ...simEntrada };
  let out = '';
  if (g.valor > 0) {
    const maior = maxPossivel(g.mes, g.categoria, g.parcelas);
    out += `<section class="card"><h2>Quanto posso gastar?</h2>
      <p>Em <strong>${esc(g.categoria)}</strong>, ${mNome(g.mes)}, com ${g.parcelas} parcela(s), o maior valor que ainda dá <strong style="color:${VCORES.ok}">Compra possível</strong> é <strong>${brl(maior)}</strong>.</p>
      <p class="muted">Usa as mesmas regras do veredito: cabe no orçamento da categoria com pelo menos 20% de folga e não deixa o saldo negativo.</p>
    </section>`;
    const cen = cenarios(g.valor, g.categoria, g.mes, [1, 3, 6, 10, 12]);
    out += `<section class="card"><h2>Comparar parcelamentos</h2>
      <p class="muted">${brl(g.valor)} em ${esc(g.categoria)}, ${mNome(g.mes)}, em cada opção:</p>
      <div class="scroll"><table><thead><tr><th>Parcelas</th><th class="num">Parcela</th><th>Veredito</th><th class="num">Restante da categoria</th></tr></thead><tbody>
        ${cen.map(c => `<tr><td>${c.n}x</td><td class="num">${brl(c.parcela)}</td><td style="color:${VCORES[c.nivel]}">${VROT[c.nivel]}</td><td class="num">${brl(c.restante)}</td></tr>`).join('')}
      </tbody></table></div>
    </section>`;
    out += `<section class="card"><h2>Registrar esta compra</h2>
      <p class="muted">Registra ${brl(g.valor)} em ${esc(g.categoria)}, ${g.parcelas}x a partir de ${mNome(g.mes)}. Com cartão, entra na fatura; sem cartão, entra como gasto do saldo do mês.</p>
      <form class="fields" onsubmit="registrarSim(event)">
        <label>Descrição <input name="descricao" placeholder="Ex.: Notebook" required></label>
        <label>Cartão <select name="cartao"><option value="">Sem cartão</option>${S.config.cartoes.map(c => `<option>${esc(c)}</option>`).join('')}</select></label>
        <div class="row"><button>Registrar compra</button></div>
      </form>
    </section>`;
  }
  const meta = metaEntrada.alvo ? metaCompra(metaEntrada.valor, metaEntrada.alvo) : null;
  out += `<section class="card"><h2>Meta de compra</h2>
    <p class="muted">Quanto guardar por mês para juntar um valor até uma data, comparado com a sobra média prevista.</p>
    <form class="fields" onsubmit="metaRodar(event)">
      <label>Quanto quero juntar (R$) <input name="valor" type="number" min="1" step="0.01" value="${metaEntrada.valor}" required></label>
      <label>Até quando <select name="alvo">${meses.map(m => `<option value="${m}" ${m === (metaEntrada.alvo || meses[11]) ? 'selected' : ''}>${mNome(m)}</option>`).join('')}</select></label>
      <div class="row"><button>Calcular meta</button></div>
    </form>
    ${meta ? `<p style="margin-top:12px">Para juntar ${brl(metaEntrada.valor)} até ${mNome(metaEntrada.alvo)}, guarde <strong>${brl(meta.porMes)}</strong> por mês (${meta.meses} mês(es)).</p>
      <p>Sobra média prevista: <strong>${brl(meta.saldoMedio)}</strong> por mês.</p>
      <p style="color:${meta.viavel ? VCORES.ok : VCORES.nao}"><strong>${meta.viavel ? 'Meta viável com a sobra prevista.' : (meta.mesesNecessarios ? `Com a sobra prevista, levaria cerca de ${meta.mesesNecessarios} meses.` : 'Com a sobra prevista, a meta não fecha.')}</strong></p>`
      : '<p class="muted" style="margin-top:12px">Escolha o valor e a data e clique em Calcular meta.</p>'}
  </section>`;
  return out;
}

V.simulador = () => simuladorBase() + blocosSimulador();

V.projecao = () => {
  const rows = projecao(36);
  const grupos = agruparPeriodos(rows, periodoProj);
  const botoes = Object.entries(PERIODOS).map(([n, t]) =>

/* ---------- mês corrente ---------- */
V.mesatual = () => {
  const m = mkOf(hoje());
  const dia = Number(hoje().slice(8, 10));
  const diasMes = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0).getDate();
  const b = mesBase(m);
  const exec = execMes(m);
  const orc = orcEfetivo(m);
  const sc = scoreOrcamento(m);
  const itens = [
    ...S.lancamentos.filter(l => mkOf(l.data) === m).map(l => ({
      d: l.data, desc: l.descricao, cat: l.categoria, v: l.valor, obs: l.forma || '—'
    })),
    ...S.parcelados.filter(p => parcelaAtiva(p, m)).map(p => ({
      d: p.dataCompra, desc: p.descricao, cat: p.categoria || 'Outros', v: valorParcela(p),
      obs: `Parcela ${mIdx(m) - mIdx(p.inicio) + 1}/${p.parcelas} · ${p.cartao}`
    }))
  ].sort((a, b) => (b.d || '').localeCompare(a.d || ''));
  const barras = S.config.categorias
    .filter(c => (Number(orc[c]) || 0) > 0 || execCat(c, m) > 0)
    .map(c => {
      const bud = Number(orc[c]) || 0, e = execCat(c, m);
      const p = bud > 0 ? Math.min(e / bud * 100, 100) : 100;
      return `<div style="margin:10px 0">
        <div class="row" style="justify-content:space-between"><span>${esc(c)}</span><span class="muted">${brl(e)} de ${brl(bud)}</span></div>
        <div class="bar" style="height:12px"><div class="${bud > 0 && e > bud ? 'over' : ''}" style="width:${p.toFixed(1)}%"></div></div>
      </div>`;
    }).join('') || '<p class="muted">Sem orçamento nem gastos neste mês.</p>';
  const linhas = itens.map(i => `<tr>
      <td>${fmtData(i.d)}</td><td>${esc(i.desc)}</td><td>${esc(i.cat)}</td><td>${esc(i.obs)}</td>
      <td class="num neg">${brl(i.v)}</td></tr>`).join('')
    || `<tr><td colspan="5" class="muted">Nenhum lançamento neste mês.</td></tr>`;
  const emAndamento = dia < diasMes ? ' · mês em andamento (pontuação parcial)' : '';
  const sub = sc.score == null ? 'Defina o orçamento do mês para pontuar' : `Gasto sem orçamento: ${brl(sc.semOrc)}${emAndamento}`;
  return `
    <section class="grid">
      ${card('Dia do mês', `${dia} de ${diasMes}`, `${Math.round(dia / diasMes * 100)}% do mês decorrido`)}
      ${card('Receitas previstas', brl(b.rt), `Fixas ${brl(b.rf)} · eventuais ${brl(b.re)}`, 'pos')}
      ${card('Despesas previstas', brl(b.I), `Fixas ${brl(b.ef)} · faturas ${brl(b.fat)} · eventuais ${brl(b.ed)} · orçamento ${brl(b.ov)}`, 'neg')}
      ${card('Executado até agora', brl(exec), `${Math.round(exec / Math.max(b.I, 1) * 100)}% das despesas previstas`)}
      ${card('Saldo realizado', brl(b.rt - exec), 'Receita prevista menos executado', b.rt - exec < 0 ? 'neg' : 'pos')}
    </section>
    <section class="grid">
      ${gauge(sc.score, `Aderência ao orçado · ${mNome(m)}`, sub)}
      <section class="card"><h2>Orçado x executado por categoria</h2>${barras}</section>
    </section>
    <section class="card"><h2>Lançamentos do mês</h2><div class="scroll"><table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma / parcela</th><th class="num">Valor</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table></div></section>`;
};

      ${card('Despesas previstas', brl(b.I), `Fixas ${brl(b.ef)} · faturas ${brl(b.fat)} · eventuais ${brl(b.ed)} · orçamento ${brl(b.ov)}`, 'neg')}
      ${card('Executado no mês', brl(exec), `Diferença para o previsto: ${brl(b.I - exec)}`)}

V.orcamento = () => {
  const m = S.config.mesRef;
  const orc = orcEfetivo(m);
  const proprio = !!S.orcamentoMeses[m];
  const linhas = S.config.categorias.map(c => {
    const b = Number(orc[c]) || 0;
    const e = execCat(c, m);
    const p = b > 0 ? Math.min(e / b * 100, 100) : 0;
    const over = b > 0 && e > b;
    return `<tr>
      <td>${esc(c)}</td>
      <td class="num"><input type="number" step="0.01" min="0" value="${b}" style="width:130px;text-align:right" onchange="setOrc('${esc(c)}', this.value)"></td>
      <td class="num">${brl(e)}</td>
      <td class="num ${over ? 'neg' : ''}">${brl(b - e)}</td>
      <td><div class="bar"><div class="${over ? 'over' : ''}" style="width:${p}%"></div></div></td>
    </tr>`;
  }).join('');
  const execTot = S.config.categorias.reduce((a, c) => a + execCat(c, m), 0);
  // Linha consolidada das faturas: não entra no total variável, porque as faturas já estão na projeção.
  const bCart = Number(orc[CARTOES]) || 0, eCart = faturaTotal(m);
  const linhaCartoes = `<tr style="font-weight:600">
      <td>${CARTOES} <span class="muted" style="font-weight:400">(faturas consolidadas)</span></td>
      <td class="num"><input type="number" step="0.01" min="0" value="${bCart}" style="width:130px;text-align:right" onchange="setOrc('${CARTOES}', this.value)"></td>
      <td class="num">${brl(eCart)}</td>
      <td class="num ${bCart > 0 && eCart > bCart ? 'neg' : ''}">${brl(bCart - eCart)}</td>
      <td><div class="bar"><div class="${bCart > 0 && eCart > bCart ? 'over' : ''}" style="width:${bCart > 0 ? Math.min(eCart / bCart * 100, 100) : 0}%"></div></div></td>
    </tr>`;
  return `
    <section class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0">Orçamento variável por categoria · ${mNome(m)}</h2>
        <label style="min-width:180px">Mês de referência<input type="month" value="${m}" onchange="setCfg('mesRef', this.value)"></label>
      </div>
      <p class="muted">${proprio
        ? `${mNome(m)} tem orçamento próprio.`
        : `${mNome(m)} usa o padrão. Qualquer alteração aqui cria o orçamento próprio deste mês.`}</p>
      <form class="fields" style="margin:12px 0 16px" onsubmit="copiarOrc(event)">
        <label>Copiar ${mNome(m)} para o período: de<input type="month" name="de" value="${addM(m, 1)}" required></label>
        <label>até<input type="month" name="ate" value="${addM(m, 1)}" required></label>
        <button>Copiar orçamento</button>
      </form>
      <div class="scroll"><table>
        <thead><tr><th>Categoria</th><th class="num">Orçamento mensal</th><th class="num">Executado</th><th class="num">Diferença</th><th>Uso</th></tr></thead>
        <tbody>${linhaCartoes}${linhas}</tbody>
        <tfoot><tr><th>Total</th><th class="num">${brl(totalOrc(m))}</th><th class="num">${brl(execTot)}</th><th class="num">${brl(totalOrc(m) - execTot)}</th><th></th></tr></tfoot>

/* ---------- edição de lançamentos (gasto avulso ou compra parcelada) ---------- */
let lancEdit = null; // { tipo: 'lanc' | 'parc', id }
function editarLanc(tipo, id) {
  lancEdit = { tipo, id };
  render();
  const form = document.querySelector('form[onsubmit="salvarLanc(event)"]');
  if (form) {
    form.scrollIntoView({ block: 'start', behavior: 'smooth' });
    const primeiro = form.querySelector('input:not([type=hidden]), select');
    if (primeiro) setTimeout(() => primeiro.focus({ preventScroll: true }), 300);
  }
}
function cancelarLanc() { lancEdit = null; render(); }

function formEdicaoLanc() {
  const tipo = lancEdit.tipo;
  if (tipo === 'lanc') {
    const it = S.lancamentos.find(x => x.id === lancEdit.id);
    if (!it) { lancEdit = null; return ''; }
    return `<section class="card"><h2>Editar gasto executado</h2>
      <form class="fields" onsubmit="salvarLanc(event)">
        <input type="hidden" name="tipo" value="lanc">
        <label>Data<input type="date" name="data" value="${esc(it.data)}" required></label>
        <label>Descrição<input type="text" name="descricao" value="${esc(it.descricao)}" required></label>
        <label>Categoria<select name="categoria">${opts(S.config.categorias, it.categoria)}</select></label>
        <label>Forma<select name="forma">${opts(FORMAS, it.forma)}</select></label>
        <label>Cartão (se Forma = Cartão)<select name="cartao"><option value=""></option>${opts(S.config.cartoes, it.cartao || undefined)}</select></label>
        <label>Valor (R$)<input type="number" step="0.01" min="0.01" name="valor" value="${it.valor}" required></label>
        <button>Salvar alterações</button>
        <button type="button" class="small" onclick="cancelarLanc()">Cancelar</button>
      </form></section>`;
  }
  const p = S.parcelados.find(x => x.id === lancEdit.id);
  if (!p) { lancEdit = null; return ''; }
  return `<section class="card"><h2>Editar compra parcelada</h2>
    <form class="fields" onsubmit="salvarLanc(event)">
      <input type="hidden" name="tipo" value="parc">
      <label>Data da compra<input type="date" name="dataCompra" value="${esc(p.dataCompra)}" required></label>
      <label>Descrição<input type="text" name="descricao" value="${esc(p.descricao)}" required></label>
      <label>Categoria<select name="categoria">${opts(S.config.categorias, p.categoria || 'Outros')}</select></label>
      <label>Cartão<select name="cartao">${opts(S.config.cartoes, p.cartao)}</select></label>
      <label>Valor total (R$)<input type="number" step="0.01" min="0.01" name="valorTotal" value="${p.valorTotal}" required></label>
      <label>Nº de parcelas<input type="number" step="1" min="1" name="parcelas" value="${p.parcelas}" required></label>
      <label>1ª parcela (mês)<input type="month" name="inicio" value="${esc(mkOf(p.inicio))}" required></label>
      <button>Salvar alterações</button>
      <button type="button" class="small" onclick="cancelarLanc()">Cancelar</button>
    </form>
    <p class="muted" style="margin-top:10px">Alterar a 1ª parcela ou o total muda as faturas e o executado de todos os meses da compra.</p>
  </section>`;
}

function salvarLanc(e) {
  e.preventDefault();
  const f = e.target.elements;
  if (!lancEdit) return render();
  const descricao = f.descricao.value.trim();
  if (!descricao) return alert('Informe a descrição.');
  if (lancEdit.tipo === 'lanc') {
    const it = S.lancamentos.find(x => x.id === lancEdit.id);
    if (!it) { lancEdit = null; return render(); }
    const valor = parseFloat(f.valor.value);
    if (!(valor > 0)) return alert('Informe um valor maior que zero.');
    if (f.forma.value === 'Cartão' && !f.cartao.value) return alert('Escolha o cartão em que o gasto foi lançado.');
    Object.assign(it, {
      data: f.data.value, descricao, categoria: f.categoria.value, forma: f.forma.value,
      cartao: f.forma.value === 'Cartão' ? f.cartao.value : '', valor
    });
  } else {
    const p = S.parcelados.find(x => x.id === lancEdit.id);
    if (!p) { lancEdit = null; return render(); }
    const valorTotal = parseFloat(f.valorTotal.value), parcelas = parseInt(f.parcelas.value, 10);
    if (!(valorTotal > 0) || !(parcelas >= 1)) return alert('Confira o valor e o número de parcelas.');
    if (!f.inicio.value) return alert('Informe o mês da 1ª parcela.');
    const lancado = (S.estornos || []).filter(x => x.parcelaId === p.id).reduce((a, x) => a + x.valor, 0);
    if (lancado > valorTotal + 0.005) return alert(`Já há estornos/abatimentos de ${brl(lancado)} nesta compra. O novo total não pode ficar abaixo disso.`);
    Object.assign(p, {
      dataCompra: f.dataCompra.value, descricao, categoria: f.categoria.value, cartao: f.cartao.value,
      valorTotal, parcelas, inicio: mkOf(f.inicio.value)
    });
    delete p.valorParcela; // a parcela volta a ser total ÷ nº de parcelas
  }
  lancEdit = null;
  commit();
}

// Lançamentos de cada cartão no mês: parcelas em andamento e recorrentes do cartão.
function linhasFatura(m) {
  return S.config.cartoes.map(c => {
    const itens = [];
    S.parcelados.filter(p => p.cartao === c && parcelaAtiva(p, m)).forEach(p => {
      const n = mIdx(m) - mIdx(p.inicio) + 1;
      itens.push({ tipo: 'Parcelado', descricao: p.descricao, parcela: `${n}/${p.parcelas}`, categoria: p.categoria || 'Outros', valor: valorParcela(p) });
    });
    S.recorrentes.filter(r => r.grupo === 'Cartão' && r.cartao === c && ativo(r, m)).forEach(r => {
      itens.push({ tipo: 'Recorrente', descricao: r.descricao, parcela: '', categoria: r.categoria || 'Outros', valor: r.valor });
    });
    ajustesMes(m).filter(e => parcDe(e).cartao === c).forEach(e => {
      const p = parcDe(e);
      itens.push({ tipo: e.tipo, descricao: e.descricao || p.descricao, parcela: '', categoria: p.categoria || 'Outros', valor: -valorAjusteMes(e, m) });
    });
    // Gastos avulsos lançados no cartão (Lançamentos, Forma = Cartão) entram na fatura real deste cartão.
    S.lancamentos.filter(l => l.forma === 'Cartão' && l.cartao === c && mkOf(l.data) === m).forEach(l => {
      itens.push({ tipo: 'Lançamento', descricao: l.descricao, parcela: '', categoria: l.categoria || 'Outros', valor: l.valor });
    });
    return { cartao: c, itens, total: itens.reduce((t, i) => t + i.valor, 0) };
  });
}

// Aba da planilha de um mês: uma seção por cartão, com subtotal em fórmula e total geral em fórmula.
function abaFatura(m) {
  const linhas = [];
  linhas.push([N('Fatura de ' + mNome(m))]);
  linhas.push([N('Cartão'), N('Descrição'), N('Tipo'), N('Parcela'), N('Categoria'), N('Valor')]);
  const subtotais = [];
  linhasFatura(m).forEach(b => {
    const ini = linhas.length + 1;
    b.itens.forEach(i => linhas.push([N(b.cartao), N(i.descricao), N(i.tipo), N(i.parcela), N(i.categoria), N(i.valor, FMT_VAL)]));
    const fim = linhas.length;
    const ref = `F${linhas.length + 1}`;
    subtotais.push(ref);
    linhas.push([N('Subtotal ' + b.cartao), null, null, null, null,
      b.itens.length ? F(`SUM(F${ini}:F${fim})`, b.total, FMT_VAL) : N(0, FMT_VAL)]);
    linhas.push([]);
  });
  const total = linhasFatura(m).reduce((t, b) => t + b.total, 0);
  linhas.push([N('Total das faturas'), null, null, null, null,
    subtotais.length ? F(subtotais.join('+'), total, FMT_VAL) : N(0, FMT_VAL)]);
  return { nome: 'Fatura ' + m, linhas };
}

function exportarFatura() {
  XL.baixar(XL.gerar([abaFatura(faturaMes)]), `fatura-${faturaMes}.xlsx`);
}

function exportarFaturas12() {
  const meses = Array.from({ length: 12 }, (_, i) => addM(faturaMes, i));
  XL.baixar(XL.gerar(meses.map(abaFatura)), `faturas-12-meses-${faturaMes}.xlsx`);
}

// Simulação de estorno integral sobre uma compra parcelada (não grava nada).
let cmpEst = null;
function compararEstorno(e) {
  e.preventDefault();
  const f = e.target.elements;
  const p = S.parcelados.find(x => x.id === f.parcelaId.value);
  if (!p) return alert('Escolha a compra parcelada.');
  if (!f.mes.value) return alert('Informe o mês do estorno.');
  if (mIdx(f.mes.value) < mIdx(mkOf(p.dataCompra))) return alert('O mês não pode ser anterior à data da compra.');
  cmpEst = { parcelaId: p.id, mes: mkOf(f.mes.value) };
  render();
}

function cenariosEstorno(p, M) {
  const v = valorParcela(p), total = p.valorTotal;
  const parcelas = Array.from({ length: p.parcelas }, (_, k) => addM(p.inicio, k));
  const pagas = parcelas.filter(m => mIdx(m) < mIdx(M)).length * v;
  const todos = [...parcelas, M];
  const ini = todos.reduce((a, b) => (mIdx(b) < mIdx(a) ? b : a));
  const fim = todos.reduce((a, b) => (mIdx(b) > mIdx(a) ? b : a));
  const linhas = [];
  for (let k = 0; mIdx(ini) + k <= mIdx(fim); k++) {
    const m = addM(ini, k);
    const cobra = parcelas.includes(m) ? v : 0;
    // A: estorno integral, parcelas continuam sendo cobradas.
    const creditoA = m === M ? total : 0;
    // B: cancelamento no mês M. As parcelas a partir de M são canceladas e só o já pago é devolvido (vira bônus).
    const cobraB = mIdx(m) < mIdx(M) ? cobra : 0;
    const creditoB = m === M ? pagas : 0;
    linhas.push({ m, base: cobra, A: cobra - creditoA, B: cobraB - creditoB });
  }
  const soma = k => linhas.reduce((a, l) => a + l[k], 0);
  return {
    linhas,
    A: { saldo: soma('A') },
    B: { saldo: soma('B'), bonus: pagas },
    pagas, total
  };
}

function blocoCenarios() {
  if (!cmpEst) return '';
  const p = S.parcelados.find(x => x.id === cmpEst.parcelaId);
  if (!p) return '';
  const r = cenariosEstorno(p, cmpEst.mes);
  const linhas = r.linhas.map(l => `<tr>
      <td>${mNome(l.m)}</td>
      <td class="num">${brl(l.base)}</td>
      <td class="num ${l.A < 0 ? 'pos' : ''}">${brl(l.A)}</td>
      <td class="num ${l.B < 0 ? 'pos' : ''}">${brl(l.B)}</td>
    </tr>`).join('');
  return `
    <section class="card"><h2>Comparação de cenários de estorno</h2>
      <p class="muted">${esc(p.descricao)} · ${esc(p.cartao)} · total ${brl(r.total)} · cancelamento/estorno em ${mNome(cmpEst.mes)}. Valores negativos são crédito na fatura.</p>
      <div class="cards">
        ${card('Cenário A · parcelas mantidas', brl(r.A.saldo), 'Saldo líquido da compra (negativo = a seu favor)', r.A.saldo < 0 ? 'pos' : 'neg')}
        ${card('Cenário B · cancelamento', brl(r.B.saldo), `Parcelas futuras canceladas · devolução de ${brl(r.B.bonus)} vira bônus`, r.B.saldo < 0 ? 'pos' : 'neg')}
      </div>
      <div class="scroll"><table>

        <tbody>${linhas}</tbody>
      </table></div>
    </section>`;
}

// Aviso quando há dados e o último backup exportado tem mais de 30 dias.
function avisoBackup() {
  if (falhaSalvar) return `<div class="aviso"><span>Não foi possível salvar neste navegador (armazenamento cheio ou bloqueado). Exporte o backup agora, senão as alterações podem se perder.</span>
    <button class="small" onclick="exportar()">Exportar backup</button></div>`;
  const temDados = S.recorrentes.length || S.parcelados.length || S.eventuais.length ||
    S.lancamentos.length || S.patrimonio.aportes.length;
  if (!temDados) return '';
  const avisos = [];
  if (lsGet('cf-base', null) === null) avisos.push('Este aparelho ainda não está sincronizado com o Drive: os dados ficam só neste navegador.');
  const dias = S.ultimoBackup ? Math.floor((new Date(hoje()) - new Date(S.ultimoBackup)) / 864e5) : null;
  if (dias === null || dias > 30) avisos.push(dias === null ? 'Você ainda não exportou um backup.' : `Último backup há ${dias} dias.`);
  if (!avisos.length) return '';
  return `<div class="aviso"><span>${avisos.join(' ')}</span>
    <button class="small" onclick="exportar()">Exportar backup</button></div>`;
}

function render() {
  const navX = $('abas').scrollLeft;
  $('aviso').innerHTML = avisoBackup();
  $('abas').innerHTML = [
    ['resumo', 'Resumo'], ['mesatual', 'Mês atual'], ['projecao', 'Projeção'], ['simulador', 'Simulador'], ['orcamento', 'Orçamento'],
    ['lancamentos', 'Lançamentos'], ['recorrentes', 'Recorrentes'], ['parcelas', 'Parcelamentos'], ['faturas', 'Faturas'],
    ['eventuais', 'Eventuais'], ['patrimonio', 'Patrimônio'], ['config', 'Configurações']
  ].map(([k, t]) => `<button class="tab ${k === aba ? 'on' : ''}" onclick="ir('${k}')">${t}</button>`).join('');
  // Preserva as posições de rolagem (tabelas largas e barra de abas) entre redesenhos.
  const posY = window.scrollY;
  const mudouAba = aba !== abaRenderizada;
  const scrollsAntes = [...$('conteudo').querySelectorAll('.scroll')].map(el => el.scrollLeft);
  const foco = capturarFoco();

    window.scrollTo(0, posY);
  }
}
let abaRenderizada = null;

/* ---------- foco e rascunhos ----------
   Ao lançar, o cursor volta ao primeiro campo do mesmo formulário; o que foi digitado
   e ainda não lançado fica salvo no navegador (sem senhas nem dados de sincronização). */
const RASC_KEY = 'cf-rascunhos';
const SEM_RASCUNHO = /salvarClientId|trocarSenha|conectar|senha/i;
let ultimoEnvio = null;
document.addEventListener('submit', e => {
  const k = e.target && e.target.getAttribute && e.target.getAttribute('onsubmit');
  if (!k) return;
  ultimoEnvio = k;
  setTimeout(() => { ultimoEnvio = null; }, 0);
}, true);

function lerRascunhos() { try { return JSON.parse(localStorage.getItem(RASC_KEY) || '{}'); } catch (e) { return {}; } }
function gravarRascunhos(o) { try { localStorage.setItem(RASC_KEY, JSON.stringify(o)); } catch (e) {} }
const chaveForm = el => (el.form && el.form.getAttribute('onsubmit')) || null;
function salvarRascunho(el) {
  const k = chaveForm(el);
  if (!k || !el.name || !['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)) return;
  if (el.type === 'password' || el.type === 'file' || el.type === 'checkbox' || el.type === 'radio' || SEM_RASCUNHO.test(k)) return;
  const r = lerRascunhos();
  (r[k] = r[k] || {})[el.name] = el.value;
  gravarRascunhos(r);
}
document.addEventListener('input', e => salvarRascunho(e.target), true);
document.addEventListener('change', e => salvarRascunho(e.target), true);

function restaurarRascunhos() {
  const r = lerRascunhos();
  let mudou = false;
  $('conteudo').querySelectorAll('form[onsubmit]').forEach(form => {
    const k = form.getAttribute('onsubmit');
    if (k === ultimoEnvio) { if (r[k]) { delete r[k]; mudou = true; } return; } // acabou de ser lançado: volta vazio
    const d = r[k];
    if (!d) return;
    Object.entries(d).forEach(([nome, valor]) => {
      const el = form.elements[nome];
      if (el && el.type !== 'password' && el.value !== valor) el.value = valor;
    });
  });
  if (mudou) gravarRascunhos(r);
}

const chaveCampo = el => [el.id, el.name, el.getAttribute('onchange') || '', el.getAttribute('oninput') || '', chaveForm(el) || ''].join('|');
function capturarFoco() {
  const a = document.activeElement;
  if (!a || !$('conteudo').contains(a) || !['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName)) return null;
  let pos = null;
  try { pos = a.selectionStart; } catch (e) {}
  return { chave: chaveCampo(a), pos };
}
function restaurarFoco(foco) {
  const c = $('conteudo');
  if (ultimoEnvio) {
    const form = [...c.querySelectorAll('form')].find(f => f.getAttribute('onsubmit') === ultimoEnvio);
    const primeiro = form && form.querySelector('input:not([type=hidden]):not([type=button]):not([type=submit]), select, textarea');
    if (primeiro) primeiro.focus({ preventScroll: true });
    return;
  }
  if (!foco) return;
  const el = [...c.querySelectorAll('input, select, textarea')].find(x => chaveCampo(x) === foco.chave);
  if (!el) return;
  el.focus({ preventScroll: true });
  if (foco.pos != null) { try { el.setSelectionRange(foco.pos, foco.pos); } catch (e) {} }
}

/* ---------- handlers ---------- */
function marcarFerias(m, on) {
  if (on) S.ferias[m] = true; else delete S.ferias[m];
  commit();
}

function setOrc(cat, valor) {
  const m = S.config.mesRef;
  if (!S.orcamentoMeses[m]) S.orcamentoMeses[m] = { ...S.orcamento };
  S.orcamentoMeses[m][cat] = parseFloat(valor) || 0;
  commit();
}

function copiarOrc(e) {
  e.preventDefault();
  const f = e.target.elements;
  const origem = mkOf(S.config.mesRef);
  const de = f.de.value, ate = f.ate.value;
  if (!de || !ate || mIdx(ate) < mIdx(de)) return alert('O mês final deve ser igual ou posterior ao inicial.');
  const off = mIdx(ate) - mIdx(de);
  if (off > 120) return alert('Período máximo: 10 anos.');
  const destinos = [];
  for (let o = 0; o <= off; o++) {
    const m = addM(de, o);
    if (m !== origem) destinos.push(m);
  }
  if (!destinos.length) return alert('O período não inclui meses diferentes do mês de referência.');
  if (!confirm(`Copiar o orçamento de ${mNome(origem)} para ${destinos.length} mês(es)? Os orçamentos desses meses serão substituídos.`)) return;
  const valores = { ...orcEfetivo(origem) };
  destinos.forEach(m => { S.orcamentoMeses[m] = { ...valores }; });
  commit();
  alert(`Orçamento copiado para ${destinos.length} mês(es).`);
}

function setCfg(chave, valor) {
  S.config[chave] = valor;
  commit();
}

function salvarCfg(e) {
  e.preventDefault();
  const f = e.target.elements;
  S.config.saldoConta = parseFloat(f.saldoConta.value) || 0;

function addLista(e, lista) {
  e.preventDefault();
  const nome = e.target.elements.nome.value.trim();
  if (!nome) return;
  if (S.config[lista].some(x => x.toLowerCase() === nome.toLowerCase())) return alert('Já existe.');
  if (lista === 'cartoes' && S.config.cartoes.length >= NCART) return alert(`Limite de ${NCART} cartões.`);
  S.config[lista].push(nome);
  commit();
}

function delLista(lista, i) {
  const nome = S.config[lista][i];
  const usado = lista === 'cartoes'
    ? S.parcelados.some(p => p.cartao === nome) || S.recorrentes.some(r => r.cartao === nome)
    : S.lancamentos.some(l => l.categoria === nome) || S.recorrentes.some(r => r.categoria === nome);
  if (usado) return alert(`"${nome}" está em uso em lançamentos ou recorrentes.`);
  S.config[lista].splice(i, 1);
  commit();
}

function excluir(tipo, id) {
  const it = (S[tipo] || []).find(x => x.id === id);
  const nome = it ? (it.descricao || it.nome || '') : '';
  const extra = tipo === 'parcelados' ? ' Os estornos e abatimentos dele também serão apagados.' : '';
  if (!confirm(`Excluir ${nome ? `"${nome}"` : 'este item'}?${extra}`)) return;
  if (tipo === 'parcelados') S.estornos = (S.estornos || []).filter(e => e.parcelaId !== id);
  S[tipo] = S[tipo].filter(x => x.id !== id);
  commit();
}

// Forma de pagamento na planilha: 'Cartão: Nubank' vira forma 'Cartão' + cartão 'Nubank'.
function formaECartao(v) {
  const t = v ? String(v) : '';
  const m = /^Cartão: (.+)$/.exec(t);
  return m ? { forma: 'Cartão', cartao: m[1].trim() } : { forma: t, cartao: '' };
}

function addLanc(e) {
  e.preventDefault();
  const f = e.target.elements;
  const descricao = f.descricao.value.trim();
  if (!descricao) return alert('Informe a descrição.');

  if (f.parcelada.checked) {
    const parcelas = parseInt(f.nParcelas.value, 10);
    const valorParc = parseFloat(f.valorParcela.value);
    if (!(parcelas >= 1)) return alert('Informe o número de parcelas.');
    if (!(valorParc > 0)) return alert('Informe o valor de cada parcela.');
    if (!f.cartaoParc.value) return alert('Escolha o cartão.');
    if (!f.primeira.value) return alert('Informe o mês da 1ª parcela.');
    S.parcelados.push({
      id: uid(), dataCompra: f.data.value, cartao: f.cartaoParc.value, descricao,
      categoria: f.categoria.value, valorTotal: Math.round(parcelas * valorParc * 100) / 100,
      valorParcela: valorParc, parcelas, inicio: f.primeira.value
    });
  } else {
    const valor = parseFloat(f.valor.value);
    if (!(valor > 0)) return alert('Informe um valor maior que zero.');
    if (f.forma.value === 'Cartão' && !f.cartao.value) return alert('Escolha o cartão em que o gasto foi lançado.');
    S.lancamentos.push({ id: uid(), data: f.data.value, descricao, categoria: f.categoria.value, forma: f.forma.value,
      cartao: f.forma.value === 'Cartão' ? f.cartao.value : '', valor });
  }
  commit();
}

// Dados do formulário de recorrente (null se inválido).
function dadosRec(f) {
  const valor = parseFloat(f.valor.value);
  if (!(valor > 0)) return alert('Informe um valor maior que zero.'), null;
  if (f.grupo.value === 'Cartão' && !f.cartao.value) return alert('Escolha o cartão.'), null;
  if (f.fim.value && f.fim.value < f.inicio.value) return alert('A data final não pode ser anterior à inicial.'), null;
  return {
    descricao: f.descricao.value.trim(), grupo: f.grupo.value,
    cartao: f.grupo.value === 'Cartão' ? f.cartao.value : '',
    categoria: f.categoria.value, valor, inicio: f.inicio.value, fim: f.fim.value
  };
}

function addRec(e) {
  e.preventDefault();
  const d = dadosRec(e.target.elements);
  if (!d) return;
  S.recorrentes.push({ id: uid(), ...d });
  commit();
}

// Edição: altera o próprio item (mesmo id), sem excluir nem recriar.
let recEdit = null;
function editarRec(id) {
  recEdit = id;
  render();
  // O formulário de edição fica no topo da aba: leva a tela até ele e posiciona o cursor no 1º campo.
  const form = document.querySelector('form[onsubmit="salvarRec(event)"]');
  if (form) {
    form.scrollIntoView({ block: 'start', behavior: 'smooth' });
    const primeiro = form.querySelector('input, select');
    if (primeiro) setTimeout(() => primeiro.focus({ preventScroll: true }), 300);
  }
}
function cancelarRec() { recEdit = null; render(); }
// Dia anterior a uma data 'aaaa-mm-dd'.
function diaAnterior(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  const x = new Date(a, m - 1, d - 1);
  return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
}
function salvarRec(e) {
  e.preventDefault();
  const f = e.target.elements;
  const it = S.recorrentes.find(x => x.id === recEdit);
  if (!it) { recEdit = null; return render(); }
  const aPartir = f.aPartir ? f.aPartir.value : '';
  if (aPartir && aPartir > it.inicio) {
    // Alteração a partir de uma data: o item antigo termina no dia anterior; o novo começa na data escolhida.
    if (it.fim && aPartir > it.fim) return alert('A data escolhida é depois do fim deste item. Use "Fim" para encerrá-lo.');
    const d = dadosRec({ descricao: f.descricao, grupo: f.grupo, cartao: f.cartao, categoria: f.categoria, valor: f.valor, fim: f.fim, inicio: { value: aPartir } });
    if (!d) return;
    it.fim = diaAnterior(aPartir);
    S.recorrentes.push({ id: uid(), ...d, inicio: aPartir, fim: d.fim });
    recEdit = null;
    return commit();
  }
  const d = dadosRec(f);
  if (!d) return;
  Object.assign(it, d);
  recEdit = null;
  commit();
}

function addParc(e) {
  e.preventDefault();
  const f = e.target.elements;
  const valorTotal = parseFloat(f.valorTotal.value);
  const parcelas = parseInt(f.parcelas.value, 10);
  const atual = parseInt(f.atual.value, 10);
  if (!(valorTotal > 0) || !(parcelas >= 1)) return alert('Confira o valor e o número de parcelas.');
  if (!(atual >= 1 && atual <= parcelas)) return alert('O nº da parcela atual deve estar entre 1 e ' + parcelas + '.');
  // Compra já em andamento: o mês informado é o da parcela atual; a 1ª parcela é calculada.
  // Só as parcelas restantes (a partir da atual) entram nas faturas e no executado.
  S.parcelados.push({
    id: uid(), dataCompra: f.dataCompra.value, cartao: f.cartao.value,
    descricao: f.descricao.value.trim(), categoria: f.categoria.value,
    valorTotal, parcelas, inicio: addM(mkOf(f.inicio.value), -(atual - 1))
  });
  commit();
}

function addAjuste(e) {
  e.preventDefault();
  const f = e.target.elements;
  const p = S.parcelados.find(x => x.id === f.parcelaId.value);
  const valor = parseFloat(f.valor.value);
  if (!p) return alert('Escolha a compra parcelada.');
  if (!(valor > 0)) return alert('Informe um valor maior que zero.');
  if (!f.mes.value) return alert('Informe o mês da fatura.');
  if (mIdx(f.mes.value) < mIdx(mkOf(p.dataCompra))) return alert('O mês não pode ser anterior à data da compra.');
  const jaLancado = (S.estornos || []).filter(x => x.parcelaId === p.id).reduce((a, x) => a + x.valor, 0);
  if (jaLancado + valor > p.valorTotal + 0.005) return alert(`Esse valor ultrapassa o total da compra (restam ${brl(p.valorTotal - jaLancado)}).`);
  S.estornos = [...(S.estornos || []), { id: uid(), parcelaId: p.id, tipo: f.tipo.value, mes: f.mes.value, descricao: f.descricao.value.trim(), valor }];
  commit();
}

function addEv(e) {
