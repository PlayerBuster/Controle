/* ---------- sincronização com o Google Drive (pasta privada do app, dados cifrados) ---------- */
const SYNC_KEY = 'cf-sync', SYNC_ARQ = 'controle-financeiro.enc';
const SYNC_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
// Acesso do Google e senha de sincronização ficam guardados neste aparelho, para continuar conectado ao reabrir o app.
// Antes ficavam só na sessão, e fechar o app no celular desconectava. "Desconectar" apaga os dois.
const ssGet = k => {
  try {
    const v = localStorage.getItem(k);
    if (v !== null) return v;
    const s = sessionStorage.getItem(k); // versão antiga: traz da sessão para o aparelho
    if (s !== null) { localStorage.setItem(k, s); sessionStorage.removeItem(k); }
    return s;
  } catch (e) { return null; }
};
const ssSet = (k, v) => { try { sessionStorage.removeItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
// clientId: do Google Cloud; arquivoId: não usado para busca; base: modificadoEm da última versão sincronizada
let syncCfg = lsGet(SYNC_KEY, {});
let syncEstado = '';
let envioAgendado = null, sincronizando = false;
const setSync = t => { syncEstado = t; const el = $('syncstatus'); if (el) el.textContent = t; };
const agoraISO = () => new Date().toISOString();
const tokenValido = () => !!ssGet('cf-token') && Date.now() < Number(ssGet('cf-exp') || 0);
const redirectUri = () => location.origin + location.pathname;

// Base64 de bytes (em blocos, para não estourar o limite de argumentos)
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// Cifragem: senha -> PBKDF2 (SHA-256, 310 mil iterações) -> AES-GCM 256. Só o texto cifrado vai para o Drive.
async function chaveDe(senha, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function cifrar(obj, senha) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await chaveDe(senha, salt), new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({ v: 1, salt: b64(salt), iv: b64(iv), data: b64(new Uint8Array(ct)) });
}
async function decifrar(texto, senha) {
  const p = JSON.parse(texto);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(p.iv) }, await chaveDe(senha, unb64(p.salt)), unb64(p.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

// Login (OAuth implícito): volta para esta mesma página com o token no endereço.
function conectarDrive() {
  const id = (syncCfg.clientId || '').trim();
  if (!id) return setSync('Salve o Client ID do Google Cloud primeiro.');
  const senha = $('sync-senha').value;
  if (senha.length < 6) return setSync('A senha de sincronização precisa ter pelo menos 6 caracteres.');
  ssSet('cf-senha', senha);
  if (tokenValido()) return sincronizar();
  irAoGoogle(false);
}
// O acesso do Google vale 1 hora. Para renovar sem pedir nada, o app vai ao Google com prompt=none e volta na hora;
// se o Google precisar de uma confirmação, volta com erro e o app mostra o botão "Reconectar".
let renovacaoFalhou = false;
function irAoGoogle(silencioso) {
  const id = (syncCfg.clientId || '').trim();
  if (!id) return;
  lsSet('cf-renovacao', Date.now());
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
    client_id: id, redirect_uri: redirectUri(), response_type: 'token', scope: SYNC_SCOPE, include_granted_scopes: 'true',
    ...(silencioso ? { prompt: 'none' } : {})
  });
}
const syncPronto = () => !!(syncCfg.clientId && ssGet('cf-senha'));
const digitando = () => { const el = document.activeElement; return !!el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName); };
// Renova sozinho quando o acesso venceu: ao abrir o app, ao voltar para ele e de minuto em minuto,
// nunca no meio de uma digitação e no máximo uma vez a cada 2 minutos (evita ficar indo e voltando).
function renovarSePreciso() {
  if (!syncPronto() || tokenValido() || renovacaoFalhou || !navigator.onLine || document.hidden || digitando()) return false;
  if (Date.now() - Number(lsGet('cf-renovacao', 0)) < 120000) return false;
  irAoGoogle(true);
  return true;
}
function lerRetornoOAuth() {
  const p = new URLSearchParams(location.hash.slice(1));
  const t = p.get('access_token'), erro = p.get('error');
  if (!t && !erro) return;
  if (t) {
    ssSet('cf-token', t);
    ssSet('cf-exp', String(Date.now() + (Number(p.get('expires_in')) || 3600) * 1000 - 60000));
    lsSet('cf-renovacao', 0);
  } else renovacaoFalhou = true;
  history.replaceState(null, '', location.pathname + location.search);
}
// Aviso no topo quando a sincronização parou: o app continua salvando neste aparelho e envia ao reconectar.
function avisoSync() {
  try {
    if (!syncPronto()) return '';
    if (!tokenValido()) return `<div class="aviso" id="avisoSync"><span>Sincronização com o Drive pausada: o acesso do Google precisa ser renovado. Suas alterações ficam salvas neste aparelho e vão para o Drive ao reconectar.</span>
      <button class="small" onclick="irAoGoogle(false)">Reconectar</button></div>`;
    if (syncEstado.startsWith('Não sincronizou')) return `<div class="aviso" id="avisoSync"><span>${esc(syncEstado)}. O app tenta de novo sozinho.</span>
      <button class="small" onclick="sincronizar()">Tentar agora</button></div>`;
  } catch (e) { /* antes de a sincronização carregar */ }
  return '';
}
function desconectarDrive() {
  ssSet('cf-token', null); ssSet('cf-exp', null); ssSet('cf-senha', null);
  renovacaoFalhou = false;
  clearTimeout(envioAgendado);
  setSync('Desconectado. Os dados continuam salvos neste aparelho.');
  render();
}
function salvarClientId(e) {
  e.preventDefault();
  syncCfg.clientId = $('sync-cid').value.trim();
  lsSet(SYNC_KEY, syncCfg);
  setSync('Client ID salvo.');
  render();
}

// Chamadas à API do Drive (só o escopo da pasta privada do app)
async function drive(url, opts = {}) {
  if (!tokenValido()) throw new Error('sessão do Google expirou; conecte de novo');
  const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + ssGet('cf-token'), ...(opts.headers || {}) } });
  if (r.status === 401) { ssSet('cf-token', null); ssSet('cf-exp', null); throw new Error('sessão do Google expirou; conecte de novo'); }
  if (!r.ok) throw new Error('o Drive respondeu ' + r.status);
  return r;
}
async function acharArquivo() {
  const q = encodeURIComponent(`name='${SYNC_ARQ}' and trashed=false`);
  const j = await (await drive(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`)).json();
  return j.files[0] ? j.files[0].id : null;
}
async function gravarArquivo(texto, id, nome = SYNC_ARQ) {
  if (id) {
    const r = await drive(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&fields=id`, { method: 'PATCH', headers: { 'Content-Type': 'application/octet-stream' }, body: texto });
    return r.json();
  }
  const b = 'cf' + Math.random().toString(36).slice(2);
  const meta = JSON.stringify({ name: nome, parents: ['appDataFolder'] });
  const corpo = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/octet-stream\r\n\r\n${texto}\r\n--${b}--`;
  const r = await drive('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` }, body: corpo });
  return r.json();
}

// Cópia de segurança: uma por dia na pasta privada do app, cifrada como o arquivo principal; ficam as 14 mais recentes.
// Serve para voltar atrás quando algo é apagado por engano (a sincronização leva o apagamento a todos os aparelhos).
const COPIA = 'controle-financeiro-copia-', COPIAS_MAX = 14;
async function listarCopias() {
  const q = encodeURIComponent(`name contains '${COPIA}' and trashed=false`);
  const j = await (await drive(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name)&pageSize=100`)).json();
  return (j.files || []).filter(f => f.name.startsWith(COPIA)).sort((a, b) => b.name.localeCompare(a.name));
}
async function copiaDiaria(senha) {
  const dia = hoje(), nome = `${COPIA}${dia}.enc`;
  const copias = await listarCopias();
  if (!copias.some(c => c.name === nome)) await gravarArquivo(await cifrar({ modificadoEm: S.modificadoEm, dados: semData(S) }, senha), null, nome);
  for (const c of copias.filter(c => c.name !== nome).slice(COPIAS_MAX - 1)) await drive(`https://www.googleapis.com/drive/v3/files/${c.id}`, { method: 'DELETE' });
  syncCfg.ultimaCopia = dia;
  lsSet(SYNC_KEY, syncCfg);
}
const diaDaCopia = c => c.name.slice(COPIA.length, COPIA.length + 10);
let copiasVistas = null;
async function verCopias() {
  try { copiasVistas = await listarCopias(); } catch (e) { return setSync('Não listou as cópias: ' + e.message); }
  render();
}
async function restaurarCopia(id) {
  const c = (copiasVistas || []).find(x => x.id === id);
  if (!c) return;
  const dia = fmtData(diaDaCopia(c));
  if (!confirm(`Restaurar a cópia de ${dia}?\n\nOs dados voltam a ser os daquele dia, neste e nos outros aparelhos (na próxima sincronização). O que foi lançado depois se perde. A cópia de hoje continua no Drive, se precisar desfazer.`)) return;
  try {
    const txt = await (await drive(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).text();
    let pacote, senha = ssGet('cf-senha');
    try { pacote = await decifrar(txt, senha); } catch (e) {
      senha = prompt('Essa cópia foi feita com outra senha de sincronização. Digite a senha daquela época:');
      if (senha == null) return;
      try { pacote = await decifrar(txt, senha); } catch (e2) { return setSync('Senha incorreta: a cópia não foi restaurada.'); }
    }
    S = Object.assign(blank(), pacote.dados);
    S.config = Object.assign(blank().config, S.config);
    commit();
    setSync(`Cópia de ${dia} restaurada.`);
  } catch (e) {
    setSync('Não restaurou: ' + e.message);
  }
}

function aplicarRemoto(r, msg) {
  S = Object.assign(blank(), r.dados);
  S.modificadoEm = r.modificadoEm;
  syncCfg.base = r.modificadoEm;
  lsSet(SYNC_KEY, syncCfg);
  salvar();
  render();
  setSync(msg);
}

// Mesclagem em três vias: base (última versão sincronizada), este aparelho (local) e o Drive (remoto).
// Alterações em pontos diferentes são combinadas. Só há conflito quando os dois lados mudaram o mesmo ponto.
const igual = (x, y) => JSON.stringify(x) === JSON.stringify(y);
const ehObj = x => x !== null && typeof x === 'object' && !Array.isArray(x);
const listaComId = a => Array.isArray(a) && a.every(x => ehObj(x) && x.id !== undefined);
const semData = o => { const { modificadoEm, ...dados } = o; return dados; };
const hora = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

function mesclarValor(b, l, r, caminho, conflitos, pref) {
  if (igual(l, r)) return l;
  if (igual(b, l)) return r;   // só o Drive mudou
  if (igual(b, r)) return l;   // só este aparelho mudou
  if (ehObj(l) && ehObj(r) && (b === undefined || ehObj(b))) {
    const out = {};
    new Set([...Object.keys(l), ...Object.keys(r), ...Object.keys(b || {})]).forEach(k => {
      const v = mesclarValor((b || {})[k], l[k], r[k], caminho + '.' + k, conflitos, pref);
      if (v !== undefined) out[k] = v;
    });
    return out;
  }
  if (listaComId(l) && listaComId(r) && (b === undefined || listaComId(b))) return mesclarListas(b || [], l, r, caminho, conflitos, pref);
  conflitos.push(caminho);
  return pref === 'remote' ? r : l;
}

function mesclarListas(b, l, r, caminho, conflitos, pref) {
  const mapa = a => new Map(a.map(x => [x.id, x]));
  const B = mapa(b), L = mapa(l), R = mapa(r);
  const out = [];
  new Set([...L.keys(), ...R.keys(), ...B.keys()]).forEach(id => {
    const bi = B.get(id), li = L.get(id), ri = R.get(id), c = caminho + '#' + id;
    if (li === undefined && ri === undefined) return;               // apagado nos dois lados
    if (bi === undefined) {                                          // criado em um lado ou nos dois
      out.push(li !== undefined && ri !== undefined ? mesclarValor(undefined, li, ri, c, conflitos, pref) : (li !== undefined ? li : ri));
      return;
    }
    if (li === undefined) { if (!igual(bi, ri)) { conflitos.push(c); if (pref === 'remote') out.push(ri); } return; }
    if (ri === undefined) { if (!igual(bi, li)) { conflitos.push(c); if (pref === 'local') out.push(li); } return; }
    out.push(mesclarValor(bi, li, ri, c, conflitos, pref));
  });
  return out;
}

let pendente = false;
const baseSync = () => lsGet('cf-base', null) || semData(blank());

async function sincronizar() {
  if (sincronizando) { pendente = true; return; }
  const senha = ssGet('cf-senha');
  if (!syncCfg.clientId) return setSync('Salve o Client ID do Google Cloud.');
  if (!tokenValido()) return setSync('Conecte ao Google Drive.');
  if (!senha) return setSync('Informe a senha de sincronização e conecte de novo.');
  sincronizando = true;
  setSync('Sincronizando…');
  try {
    const local = semData(S);
    const base = baseSync();
    const id = await acharArquivo();
    let remoto = null;
    if (id) {
      const txt = await (await drive(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).text();
      let pacote;
      try { pacote = await decifrar(txt, senha); }
      catch (e) { throw new Error('senha de sincronização incorreta'); }
      remoto = semData(pacote.dados);
    }
    let final = local;
    if (remoto) {
      const conflitos = [];
      final = mesclarValor(base, local, remoto, '', conflitos, 'local');
      if (conflitos.length && confirm(`Há ${conflitos.length} ponto(s) alterado(s) nos dois aparelhos.\n\nOK = usar a versão do Drive nesses pontos.\nCancelar = manter a versão deste aparelho.`)) {
        final = mesclarValor(base, local, remoto, '', [], 'remote');
      }
    }
    if (!igual(semData(S), local)) { // você editou algo durante a sincronização: refaz depois
      pendente = true;
      return setSync('Dados mudaram durante a sincronização; sincronizando de novo…');
    }
    S = Object.assign(blank(), final);
    S.modificadoEm = agoraISO();
    salvar();
    render();
    if (!remoto || !igual(final, remoto)) {
      const meta = await gravarArquivo(await cifrar({ modificadoEm: S.modificadoEm, dados: semData(S) }, senha), id);
      syncCfg.arquivoId = meta.id;
      lsSet(SYNC_KEY, syncCfg);
    }
    lsSet('cf-base', final);
    if (syncCfg.ultimaCopia !== hoje()) {
      try { await copiaDiaria(senha); } catch (e) { /* tenta de novo na próxima sincronização */ }
    }
    setSync('Sincronizado às ' + hora());
  } catch (e) {
    // Sem internet ou falha de rede: tenta de novo em 30 segundos (e ao voltar a internet).
    const rede = e instanceof TypeError;
    setSync('Não sincronizou: ' + (rede ? 'sem conexão com o Drive' : e.message));
    if (rede) { clearTimeout(novaTentativa); novaTentativa = setTimeout(agendarEnvio, 30000); }
    if (!tokenValido()) renovarSePreciso();
  } finally {
    sincronizando = false;
    if (pendente) { pendente = false; agendarEnvio(); }
    atualizarAvisos();
  }
}
let novaTentativa = null;

function agendarEnvio() {
  if (!syncPronto()) return;
  if (!tokenValido()) { renovarSePreciso(); return; }
  if (sincronizando) { pendente = true; return; }
  clearTimeout(envioAgendado);
  envioAgendado = setTimeout(sincronizar, 1500);
}

// Troca a senha: recifra o arquivo no Drive com a nova senha. Os outros aparelhos usam a nova ao conectar de novo.
async function trocarSenha() {
  const nova = $('sync-nova').value;
  if (nova.length < 6) return setSync('A nova senha precisa ter pelo menos 6 caracteres.');
  if (!tokenValido() || !ssGet('cf-senha')) return setSync('Conecte ao Google Drive antes de trocar a senha.');
  if (!confirm('Trocar a senha de sincronização? Depois, use a nova senha em todos os aparelhos.')) return;
  await sincronizar();
  if (syncEstado.startsWith('Não sincronizou')) return;
  try {
    const id = await acharArquivo();
    if (!id) return setSync('Nada para recifrar ainda: sincronize primeiro.');
    await gravarArquivo(await cifrar({ modificadoEm: S.modificadoEm, dados: semData(S) }, nova), id);
    ssSet('cf-senha', nova);
    setSync('Senha trocada. Nos outros aparelhos, digite a nova senha e conecte de novo.');
    render();
  } catch (e) {
    setSync('Não trocou a senha: ' + e.message);
  }
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
lerRetornoOAuth();
aba = lerAba();
render();

else if (syncPronto()) { if (tokenValido()) sincronizar(); else renovarSePreciso(); }

// Ao voltar para a página (ex.: trocar de aplicativo no celular), sincroniza sozinho, renovando o acesso se venceu.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !syncPronto()) return;
  if (tokenValido()) sincronizar(); else renovarSePreciso();
});
window.addEventListener('online', () => { if (syncPronto() && tokenValido()) sincronizar(); });
// Com o app aberto por mais de 1 hora: renova quando o acesso vencer e atualiza o aviso.
setInterval(() => { if (syncPronto() && !tokenValido() && !renovarSePreciso()) atualizarAvisos(); }, 60000);
