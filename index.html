V.orcamento = () => {
  const m = S.config.mesRef;
  const orc = orcEfetivo(m);
  const proprio = !!S.orcamentoMeses[m];
  const linhas = S.config.categorias.map(c => {
    const b = Number(orc[c]) || 0;
    const e = execCat(c, m);
    const p = b > 0 ? Math.min(e / b * 100, 100) : 0;
    const over = b > 0 && e > b;
    return `<tr>
      <td>${esc(c)}</td>
      <td class="num"><input type="number" step="0.01" min="0" value="${b}" style="width:130px;text-align:right" onchange="setOrc('${esc(c)}', this.value)"></td>
      <td class="num">${brl(e)}</td>
      <td class="num ${over ? 'neg' : ''}">${brl(b - e)}</td>
      <td><div class="bar"><div class="${over ? 'over' : ''}" style="width:${p}%"></div></div></td>
    </tr>`;
  }).join('');
  const execTot = S.config.categorias.reduce((a, c) => a + execCat(c, m), 0);
  // Linha consolidada das faturas: não entra no total variável, porque as faturas já estão na projeção.
  const bCart = Number(orc[CARTOES]) || 0, eCart = faturaTotal(m);
  const linhaCartoes = `<tr style="font-weight:600">
      <td>${CARTOES} <span class="muted" style="font-weight:400">(faturas consolidadas)</span></td>
      <td class="num"><input type="number" step="0.01" min="0" value="${bCart}" style="width:130px;text-align:right" onchange="setOrc('${CARTOES}', this.value)"></td>
      <td class="num">${brl(eCart)}</td>
      <td class="num ${bCart > 0 && eCart > bCart ? 'neg' : ''}">${brl(bCart - eCart)}</td>
      <td><div class="bar"><div class="${bCart > 0 && eCart > bCart ? 'over' : ''}" style="width:${bCart > 0 ? Math.min(eCart / bCart * 100, 100) : 0}%"></div></div></td>
    </tr>`;
  return `
    <section class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0">Orçamento variável por categoria · ${mNome(m)}</h2>
        <label style="min-width:180px">Mês de referência<input type="month" value="${m}" onchange="setCfg('mesRef', this.value)"></label>
      </div>
      <p class="muted">${proprio
        ? `${mNome(m)} tem orçamento próprio.`
        : `${mNome(m)} usa o padrão. Qualquer alteração aqui cria o orçamento próprio deste mês.`}</p>
      <form class="fields" style="margin:12px 0 16px" onsubmit="copiarOrc(event)">
        <label>Copiar ${mNome(m)} para o período: de<input type="month" name="de" value="${addM(m, 1)}" required></label>
        <label>até<input type="month" name="ate" value="${addM(m, 1)}" required></label>
        <button>Copiar orçamento</button>
      </form>
      <div class="scroll"><table>
        <thead><tr><th>Categoria</th><th class="num">Orçamento mensal</th><th class="num">Gasto lançado</th><th class="num">Diferença</th><th>Uso</th></tr></thead>
        <tbody>${linhaCartoes}${linhas}</tbody>
        <tfoot><tr><th>Total</th><th class="num">${brl(totalOrc(m))}</th><th class="num">${brl(execTot)}</th><th class="num">${brl(totalOrc(m) - execTot)}</th><th></th></tr></tfoot>
      </table></div>
      <p class="muted">A linha ${CARTOES} mostra as faturas de todos os cartões em um único ponto. Ela não entra no total variável nem nas pontuações por categoria, porque as faturas já estão na projeção.</p>
      <p class="muted">Gasto lançado: tudo o que foi lançado na categoria no mês, no cartão (a pagar) ou à vista. Na projeção, só entra o orçamento que ainda falta gastar, porque o que já foi lançado está nas faturas ou nos gastos à vista.</p>
    </section>`;
};

/* ---------- edição de lançamentos (gasto avulso ou compra parcelada) ---------- */
// Opções fixas do formulário de gasto: categoria, forma, cartão e parcelamento (sem a 1ª parcela).
let lancFixo = (() => { try { return JSON.parse(localStorage.getItem('cf-lanc-fixo') || 'null'); } catch (e) { return null; } })();
function fixarLanc(form) {
  if (lancFixo) {
    lancFixo = null;
    try { localStorage.removeItem('cf-lanc-fixo'); } catch (e) {}
  } else {
    const f = form.elements;
    lancFixo = { categoria: f.categoria.value, forma: f.forma.value, cartao: f.cartao.value, fatura: f.fatura.value,
      parcelada: f.parcelada.checked, nParcelas: f.nParcelas.value };
    try { localStorage.setItem('cf-lanc-fixo', JSON.stringify(lancFixo)); } catch (e) {}
  }
  render();
}
// Mostra cartão quando a forma é Cartão ou a compra é parcelada; mostra parcelamento só se marcado.
function togLancCampos(form) {
  const parc = form.elements.parcelada.checked;
  form.querySelector('#lbl-cartao').hidden = !(parc || form.elements.forma.value === 'Cartão');
  form.querySelector('#lbl-fatura').hidden = form.querySelector('#lbl-cartao').hidden;
  form.querySelector('#lbl-valor').hidden = parc;
  const campos = form.querySelector('#campos-parc');
  campos.hidden = !parc;
  campos.style.display = parc ? 'contents' : '';
}

// Escolha da fatura em compras no cartão: a do mês da compra ('') ou a seguinte ('prox').
const optsFatura = sel => `<option value="" ${sel ? '' : 'selected'}>Fatura atual</option><option value="prox" ${sel ? 'selected' : ''}>Próxima fatura</option>`;
// Preenche o mês da 1ª parcela a partir da data da compra e da fatura escolhida.
function sugerirMesFatura(form, campoData, campoMes) {
  const f = form.elements;
  if (f[campoData].value) f[campoMes].value = addM(mkOf(f[campoData].value), f.fatura.value === 'prox' ? 1 : 0);
}

let lancEdit = null; // { tipo: 'lanc' | 'parc', id }
function editarLanc(tipo, id) {
  lancEdit = { tipo, id };
  render();
  const form = document.querySelector('form[onsubmit="salvarLanc(event)"]');
  if (form) {
    form.scrollIntoView({ block: 'start', behavior: 'smooth' });
    const primeiro = form.querySelector('input:not([type=hidden]), select');
    if (primeiro) setTimeout(() => primeiro.focus({ preventScroll: true }), 300);

}
function cancelarLanc() { lancEdit = null; render(); }

function formEdicaoLanc() {

      <button>Salvar alterações</button>

  </section>`;
}

function salvarLanc(e) {
  e.preventDefault();
  const f = e.target.elements;
  if (!lancEdit) return render();
  const descricao = f.descricao.value.trim();
  if (!descricao) return alert('Informe a descrição.');
  if (lancEdit.tipo === 'lanc') {
    const it = S.lancamentos.find(x => x.id === lancEdit.id);
    if (!it) { lancEdit = null; return render(); }
    const valor = parseFloat(f.valor.value);
    if (!(valor > 0)) return alert('Informe um valor maior que zero.');
    if (f.forma.value === 'Cartão' && !f.cartao.value) return alert('Escolha o cartão em que o gasto foi lançado.');
    Object.assign(it, {
      data: f.data.value, descricao, categoria: f.categoria.value, forma: f.forma.value,
      cartao: f.forma.value === 'Cartão' ? f.cartao.value : '', valor
    });
    if (f.forma.value === 'Cartão' && f.fatura.value === 'prox') it.prox = true; else delete it.prox;
  } else {
    const p = S.parcelados.find(x => x.id === lancEdit.id);
    if (!p) { lancEdit = null; return render(); }
    const valorTotal = parseFloat(f.valorTotal.value), parcelas = parseInt(f.parcelas.value, 10);
    if (!(valorTotal > 0) || !(parcelas >= 1)) return alert('Confira o valor e o número de parcelas.');
    if (!f.inicio.value) return alert('Informe o mês da 1ª parcela.');
    const lancado = (S.estornos || []).filter(x => x.parcelaId === p.id).reduce((a, x) => a + x.valor, 0);
    if (lancado > valorTotal + 0.005) return alert(`Já há estornos/abatimentos de ${brl(lancado)} nesta compra. O novo total não pode ficar abaixo disso.`);
    Object.assign(p, {
      dataCompra: f.dataCompra.value, descricao, categoria: f.categoria.value, cartao: f.cartao.value,
      valorTotal, parcelas, inicio: mkOf(f.inicio.value)
    });
    delete p.valorParcela; // a parcela volta a ser total ÷ nº de parcelas
  }
  lancEdit = null;
  commit();
}

let recFixo = (() => { try { return JSON.parse(localStorage.getItem('cf-rec-fixo') || 'null'); } catch (e) { return null; } })();
function fixarRec(form) {
  if (recFixo) {

/* ---------- faturas dos cartões ---------- */
let faturaMes = null;
let fatModo = 'total';
const CARTOES = 'Cartões';
const FMT_VAL = '#,##0.00';
const fatModoSet = m => { fatModo = m; render(); };

// Lançamentos de cada cartão no mês: parcelas em andamento e recorrentes do cartão.
function linhasFatura(m) {
  return S.config.cartoes.map(c => {
    const itens = [];
    S.parcelados.filter(p => p.cartao === c && parcelaAtiva(p, m)).forEach(p => {
      const n = mIdx(m) - mIdx(p.inicio) + 1;
      itens.push({ tipo: 'Parcelado', descricao: p.descricao, parcela: `${n}/${p.parcelas}`, categoria: p.categoria || 'Outros', valor: valorParcela(p) });
    });
    S.recorrentes.filter(r => r.grupo === 'Cartão' && r.cartao === c && recNaFatura(r, m)).forEach(r => {
      itens.push({ tipo: 'Recorrente', descricao: r.descricao, parcela: '', categoria: r.categoria || 'Outros', valor: r.valor });
    });
    ajustesMes(m).filter(e => parcDe(e).cartao === c).forEach(e => {
      const p = parcDe(e);
      itens.push({ tipo: e.tipo, descricao: e.descricao || p.descricao, parcela: '', categoria: p.categoria || 'Outros', valor: -valorAjusteMes(e, m) });
    });
    // Gastos avulsos lançados no cartão (Lançamentos, Forma = Cartão) entram na fatura real deste cartão.
    S.lancamentos.filter(l => l.forma === 'Cartão' && l.cartao === c && mesFatLanc(l) === m).forEach(l => {
      itens.push({ tipo: 'Lançamento', descricao: l.descricao, parcela: '', categoria: l.categoria || 'Outros', valor: l.valor });
    });
    creditosMes(c, m).forEach(x => {
      itens.push({ tipo: 'Ajuste', descricao: x.descricao || 'Ajuste manual', parcela: '', categoria: '', valor: -x.valor });
    });
    return { cartao: c, itens, total: itens.reduce((t, i) => t + i.valor, 0) };
  });
}

// Aba da planilha de um mês: uma seção por cartão, com subtotal em fórmula e total geral em fórmula.
function abaFatura(m) {
  const linhas = [];
  linhas.push([N('Fatura de ' + mFatura(m))]);
  linhas.push([N('Cartão'), N('Descrição'), N('Tipo'), N('Parcela'), N('Categoria'), N('Valor')]);
  const subtotais = [];
  linhasFatura(m).forEach(b => {
    const ini = linhas.length + 1;
    b.itens.forEach(i => linhas.push([N(b.cartao), N(i.descricao), N(i.tipo), N(i.parcela), N(i.categoria), N(i.valor, FMT_VAL)]));
    const fim = linhas.length;
    const ref = `F${linhas.length + 1}`;
    subtotais.push(ref);
    linhas.push([N('Subtotal ' + b.cartao), null, null, null, null,
      b.itens.length ? F(`SUM(F${ini}:F${fim})`, b.total, FMT_VAL) : N(0, FMT_VAL)]);
    linhas.push([]);
  });
  const total = linhasFatura(m).reduce((t, b) => t + b.total, 0);
  linhas.push([N('Total das faturas'), null, null, null, null,
    subtotais.length ? F(subtotais.join('+'), total, FMT_VAL) : N(0, FMT_VAL)]);
  return { nome: 'Fatura ' + m, linhas };
}

function exportarFatura() {
  XL.baixar(XL.gerar([abaFatura(faturaMes)]), `fatura-${faturaMes}.xlsx`);
}

function exportarFaturas12() {
  const meses = Array.from({ length: 12 }, (_, i) => addM(faturaMes, i));

// Meses que a aba Faturas oferece: começa no mês da fatura mais antiga com gasto no cartão (até 12 meses
// antes da projeção), para que compras anteriores ao 1º mês da projeção também possam ser consultadas.
function mesesFatura() {
  const p0 = S.config.primeiroMes;
  const antigos = S.lancamentos.filter(l => l.forma === 'Cartão' && l.cartao).map(mesFatLanc)
    .concat(S.parcelados.map(p => mkOf(p.inicio)))
    .filter(m => /^\d{4}-\d{2}$/.test(m) && mIdx(m) < mIdx(p0) && mIdx(m) >= mIdx(addM(p0, -12)));
  const ini = antigos.reduce((a, m) => (mIdx(m) < mIdx(a) ? m : a), p0);
  return Array.from({ length: 36 + mIdx(p0) - mIdx(ini) }, (_, i) => addM(ini, i));
}
// Posição do mês em relação a hoje, por extenso.
function mesRelativo(m) {
  const d = mIdx(m) - mIdx(mkOf(hoje()));
  if (d === 0) return 'mês atual';
  if (d === 1) return 'próximo mês';
  if (d === -1) return 'mês passado';
  return d > 0 ? `daqui a ${d} meses` : `há ${-d} meses`;
}
function faturaPasso(n) {
  const meses = mesesFatura(), i = meses.indexOf(faturaMes) + n;
  if (i >= 0 && i < meses.length) { faturaMes = meses[i]; render(); }
}

// Simulação de estorno integral sobre uma compra parcelada (não grava nada).
let cmpEst = null;
function compararEstorno(e) {
  e.preventDefault();
  const f = e.target.elements;
  const p = S.parcelados.find(x => x.id === f.parcelaId.value);
  if (!p) return alert('Escolha a compra parcelada.');
  if (!f.mes.value) return alert('Informe o mês do estorno.');
  if (mIdx(f.mes.value) < mIdx(mkOf(p.dataCompra))) return alert('O mês não pode ser anterior à data da compra.');
  cmpEst = { parcelaId: p.id, mes: mkOf(f.mes.value) };
  render();
}

function cenariosEstorno(p, M) {
  const v = valorParcela(p), total = p.valorTotal;
  const parcelas = Array.from({ length: p.parcelas }, (_, k) => addM(p.inicio, k));
  const pagas = parcelas.filter(m => mIdx(m) < mIdx(M)).length * v;
  const todos = [...parcelas, M];
  const ini = todos.reduce((a, b) => (mIdx(b) < mIdx(a) ? b : a));
  const fim = todos.reduce((a, b) => (mIdx(b) > mIdx(a) ? b : a));
  const linhas = [];
  for (let k = 0; mIdx(ini) + k <= mIdx(fim); k++) {
    const m = addM(ini, k);
    const cobra = parcelas.includes(m) ? v : 0;
    // A: estorno integral, parcelas continuam sendo cobradas.
    const creditoA = m === M ? total : 0;
    // B: cancelamento no mês M. As parcelas a partir de M são canceladas e só o já pago é devolvido (vira bônus).
    const cobraB = mIdx(m) < mIdx(M) ? cobra : 0;
    const creditoB = m === M ? pagas : 0;
    linhas.push({ m, base: cobra, A: cobra - creditoA, B: cobraB - creditoB });
  }
  const soma = k => linhas.reduce((a, l) => a + l[k], 0);
  return {
    linhas,
    A: { saldo: soma('A') },
    B: { saldo: soma('B'), bonus: pagas },
    pagas, total
  };
}

function blocoCenarios() {
  if (!cmpEst) return '';
  const p = S.parcelados.find(x => x.id === cmpEst.parcelaId);
  if (!p) return '';
  const r = cenariosEstorno(p, cmpEst.mes);
  const linhas = r.linhas.map(l => `<tr>
      <td>${mNome(l.m)}</td>
      <td class="num">${brl(l.base)}</td>
      <td class="num ${l.A < 0 ? 'pos' : ''}">${brl(l.A)}</td>
      <td class="num ${l.B < 0 ? 'pos' : ''}">${brl(l.B)}</td>
    </tr>`).join('');
  return `
    <section class="card"><h2>Comparação de cenários de estorno</h2>
      <p class="muted">${esc(p.descricao)} · ${esc(p.cartao)} · total ${brl(r.total)} · cancelamento/estorno em ${mNome(cmpEst.mes)}. Valores negativos são crédito na fatura.</p>
      <div class="cards">
        ${card('Cenário A · parcelas mantidas', brl(r.A.saldo), 'Saldo líquido da compra (negativo = a seu favor)', r.A.saldo < 0 ? 'pos' : 'neg')}
        ${card('Cenário B · cancelamento', brl(r.B.saldo), `Parcelas futuras canceladas · devolução de ${brl(r.B.bonus)} vira bônus`, r.B.saldo < 0 ? 'pos' : 'neg')}
      </div>
      <div class="scroll"><table>
        <thead><tr><th>Mês</th><th class="num">Sem estorno</th><th class="num">Cenário A</th><th class="num">Cenário B</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table></div>
    </section>`;
}

/* ---------- check list do mês ----------
   Feito no dia 5 do mês seguinte: o de outubro, em 5 de novembro. Lista o que precisa ser pago no mês
   (faturas pelo valor global, contas fixas, despesas eventuais, boletos e outros) e compara o valor pago
   com o lançado. O previsto é sempre calculado na hora: ao corrigir um lançamento, a diferença some.
   S.checklist[mês] = { itens: { chave: { pago, valor } }, fora: 'sim' | 'nao' }. */
let clMesEsc = null; // mês escolhido; null = o mês anterior ao de hoje, que é o check list da vez
const clMesPadrao = () => addM(mkOf(hoje()), -1);
const clMesVisto = () => clMesEsc || clMesPadrao();
const dataChecklist = m => addM(m, 1) + '-05';
function clVer(m) { clMesEsc = m === clMesPadrao() ? null : m; render(); }
function clPasso(n) { clVer(addM(clMesVisto(), n)); }

function itensChecklist(m) {
  const itens = [];
  S.config.cartoes.forEach(c => {
    const v = fatCartao(c, m);
    if (v > 0.005) itens.push({ key: 'fat:' + c, grupo: 'Faturas (valor global)', nome: `Fatura ${c}`, previsto: v, tipo: 'fat', ref: c });
  });
  S.recorrentes.filter(r => r.grupo === 'Fixo' && ativo(r, m)).forEach(r =>
    itens.push({ key: 'rec:' + r.id, grupo: 'Contas fixas', nome: r.descricao, previsto: r.valor, tipo: 'rec', ref: r.id }));
  S.eventuais.filter(e => e.tipo === 'Despesa' && e.mes === m).forEach(e =>
    itens.push({ key: 'ev:' + e.id, grupo: 'Despesas eventuais', nome: e.descricao, previsto: e.valor, tipo: 'ev', ref: e.id }));
  S.lancamentos.filter(l => aVista(l) && !FORMAS_CONTA.includes(l.forma) && mkOf(l.data) === m).forEach(l =>
    itens.push({ key: 'lanc:' + l.id, grupo: 'Boletos e outros', nome: l.descricao, previsto: l.valor, tipo: 'lanc', ref: l.id }));
  return itens;
}
const clDoMes = m => (S.checklist && S.checklist[m]) || { itens: {} };
const clDif = (it, e) => (e.pago && e.valor != null ? Math.round((e.valor - it.previsto) * 100) / 100 : null);
function resumoChecklist(m) {
  const c = clDoMes(m), itens = itensChecklist(m);
  const ent = it => (c.itens || {})[it.key] || {};
  const pagos = itens.filter(it => ent(it).pago);
  const comValor = pagos.filter(it => ent(it).valor != null);
  const difs = comValor.filter(it => Math.abs(clDif(it, ent(it))) >= 0.005);
  const total = itens.reduce((a, it) => a + it.previsto, 0);
  const pagoTot = comValor.reduce((a, it) => a + ent(it).valor, 0);
  const previstoPagos = comValor.reduce((a, it) => a + it.previsto, 0);
  const respondeu = !!c.fora;
  return { itens, total, pagoTot, difTot: pagoTot - previstoPagos, pagos: pagos.length, comValor: comValor.length, difs: difs.length, respondeu,
    concluido: comValor.length === itens.length && respondeu };
}
// Aviso geral: a partir do dia 5, o check list do mês anterior ainda não concluído.
function avisoChecklist(dia = hoje()) {
  if (Number(dia.slice(8, 10)) < 5) return '';
  const m = addM(mkOf(dia), -1), r = resumoChecklist(m);
  if (!r.itens.length || r.concluido) return '';
  return `<div class="aviso" id="avisoChecklist"><span>Check list de ${mNome(m)} pendente: ${r.comValor} de ${r.itens.length} itens conferidos${r.respondeu ? '' : ', falta dizer se ficou algum gasto de fora'}.</span>
    <button class="small" onclick="clMesEsc=null;ir('checklist')">Abrir check list</button></div>`;
}

let clLinhas = []; // itens da tela, usados pelos botões (evita colocar nomes dentro do HTML dos botões)
function clEntrada(key, criar) {
  const m = clMesVisto();
  if (!S.checklist) S.checklist = {};
  if (criar && !S.checklist[m]) S.checklist[m] = { itens: {} };
  const c = S.checklist[m];
  if (!c) return {};
  if (!c.itens) c.itens = {};
  if (criar && !c.itens[key]) c.itens[key] = {};
  return c.itens[key] || {};
}
const clMov = e => (e.contaId ? (S.movConta || []).find(x => x.id === e.contaId) : null);
const clRemoverMov = e => { if (e.contaId) { S.movConta = (S.movConta || []).filter(x => x.id !== e.contaId); delete e.contaId; } };
function clMarcar(i, marcado) {
  const it = clLinhas[i];
  if (!it) return;
  if (marcado) clEntrada(it.key, true).pago = true;
  else if (S.checklist && S.checklist[clMesVisto()]) {
    const e = clEntrada(it.key);
    clRemoverMov(e);
    if (e.banco != null) { delete e.pago; delete e.valor; } // mantém o total importado da fatura
    else delete S.checklist[clMesVisto()].itens[it.key];
  }
  commit();
}
function clValor(i, valor) {
  const it = clLinhas[i], v = parseFloat(valor);
  if (!it) return;
  const e = clEntrada(it.key, true);
  if (v >= 0) {
    e.pago = true; e.valor = v;
    const mov = clMov(e);
    if (mov) mov.valor = v; // a saída na Conta acompanha o valor pago
  } else { delete e.valor; clRemoverMov(e); }
  commit();
}
// Fatura importada: marca paga com o total do banco.
function clPagaBanco(i) {
  const it = clLinhas[i];
  if (!it) return;
  const e = clEntrada(it.key, true);
  if (e.banco == null) return;
  e.pago = true; e.valor = e.banco;
  commit();
}
// O pagamento só sai da aba Conta quando o usuário pede, para não duplicar uma saída já lançada lá.
function clLancarConta(i) {
  const it = clLinhas[i];
  if (!it) return;
  const e = clEntrada(it.key, true);
  if (!(e.valor > 0) || clMov(e)) return;
  const id = uid();
  S.movConta = [...(S.movConta || []), { id, data: hoje(), descricao: `Pagamento: ${it.nome} (${mNome(clMesVisto())})`, tipo: 'Saída', valor: e.valor }];
  e.contaId = id;
  commit();
}
function clDesfazerConta(i) {
  const it = clLinhas[i];
  if (!it) return;
  clRemoverMov(clEntrada(it.key, true));
  commit();
}
// "Corrigir" leva ao lançamento: o valor previsto é recalculado e a diferença some.
function clCorrigir(i) {
  const it = clLinhas[i];
  if (!it) return;
  if (it.tipo === 'fat') { faturaMes = clMesVisto(); fatModo = 'individual'; ir('faturas'); }
  if (it.tipo === 'rec') { ir('recorrentes'); editarRec(it.ref); }
  if (it.tipo === 'ev') { ir('eventuais'); editarEv(it.ref); }
  if (it.tipo === 'lanc') { ir('lancamentos'); editarLanc('lanc', it.ref); }
}
function clFora(resposta) {
  const m = clMesVisto();
  if (!S.checklist) S.checklist = {};
  if (!S.checklist[m]) S.checklist[m] = { itens: {} };
  S.checklist[m].fora = resposta;
  commit();
}
function addFora(e) {
  e.preventDefault();
  const f = e.target.elements, m = clMesVisto();
  const valor = parseFloat(f.valor.value), descricao = f.descricao.value.trim();
  if (!descricao) return alert('Informe a descrição.');
  if (!(valor > 0)) return alert('Informe um valor maior que zero.');
  if (mkOf(f.data.value) !== m) return alert(`A data precisa ser em ${mNome(m)}, o mês deste check list.`);
  const cartao = f.forma.value === 'Cartão';
  if (cartao && !f.cartao.value) return alert('Escolha o cartão.');
  S.lancamentos.push({ id: uid(), data: f.data.value, descricao, categoria: f.categoria.value, forma: f.forma.value,
    cartao: cartao ? f.cartao.value : '', valor, cl: m, ...(cartao && f.fatura.value === 'prox' ? { prox: true } : {}) });
  commit();
}

V.checklist = () => {
  const m = clMesVisto(), r = resumoChecklist(m), c = clDoMes(m);
  clLinhas = r.itens;
  const ent = it => (c.itens || {})[it.key] || {};
  const situacao = it => {
    const e = ent(it), d = clDif(it, e);
    if (!e.pago) return '<span class="muted">⏳ Não pago</span>';
    if (d === null) return '<span>⚠️ Informe o valor pago</span>';
    if (Math.abs(d) < 0.005) return '<span class="pos">✓ Confere</span>';
    return `<span class="neg">⚠️ Pagou ${brl(Math.abs(d))} a ${d > 0 ? 'mais' : 'menos'} que o lançado</span>`;
  };
  const grupos = [...new Set(r.itens.map(it => it.grupo))];
  // A situação fica sob o nome do item, para continuar visível no celular, sem rolar a tabela.
  const corpo = grupos.map(g => `<tr><th colspan="4" style="padding-top:14px">${g}</th></tr>` + r.itens.map((it, i) => {
    if (it.grupo !== g) return '';
    const e = ent(it), d = clDif(it, e), temDif = d !== null && Math.abs(d) >= 0.005;
    return `<tr class="cl-item">
      <td>${esc(it.nome)}<div style="font-size:13px;margin-top:2px">${situacao(it)}</div>
        ${e.banco != null ? `<div class="muted cl-banco" style="margin-top:4px">Fatura importada do banco: ${brl(e.banco)} · ${Math.abs(e.banco - it.previsto) < 0.005 ? 'bate com o lançado' : `${brl(Math.abs(e.banco - it.previsto))} a ${e.banco > it.previsto ? 'mais' : 'menos'} que o lançado`}</div>
          ${e.pago && e.valor != null ? '' : `<button class="small" style="margin-top:4px;white-space:normal" onclick="clPagaBanco(${i})">Paga com ${brl(e.banco)}</button> `}` : ''}
        ${temDif ? `<button class="small" style="margin-top:4px;white-space:normal" onclick="clCorrigir(${i})">Corrigir lançamento</button> ` : ''}
        ${e.pago && e.valor > 0 ? (clMov(e)

/* ---------- avisos no celular ----------
   O service worker (sw.js) não lê os dados do app: a cada alteração, o app grava a lista do que avisar nos
   próximos dias (cache "cf-avisos"). Com o app instalado no Android, o sistema acorda o service worker
   (periodicSync) uma ou duas vezes por dia, e ele mostra o que vale para o dia. */
function agendaAvisos(d = hoje()) {
  const lista = [], vistos = new Set();
  [...vencimentos(d), ...vencimentos(somaDias(d, 32))].forEach(v => {
    const id = `venc:${v.cartao}:${v.data}`;
    if (vistos.has(id) || v.pago || !(v.valor > 0.005)) return;
    vistos.add(id);
    lista.push({ id, de: somaDias(v.data, -3), ate: v.data, titulo: `Fatura ${v.cartao}`, texto: `Vence em ${fmtData(v.data)}: ${brl(v.valor)}.` });
  });
  [addM(mkOf(d), -1), mkOf(d)].forEach(m => {
    const r = resumoChecklist(m), dia = dataChecklist(m);
    if (r.concluido || !r.itens.length) return;
    lista.push({ id: 'cl:' + m, de: dia, ate: somaDias(dia, 5), titulo: `Check list de ${mNome(m)}`, texto: `Confira o que foi pago: ${r.comValor} de ${r.itens.length} itens conferidos.` });
  });
  return lista.filter(a => a.ate >= d);
}
const avisosLigados = () => lsGet('cf-avisos-on', false) === true;
const URL_AVISOS = () => new URL('./avisos.json', location.origin + location.pathname).href;
async function gravarAgendaAvisos() {
  if (!avisosLigados() || !('caches' in window)) return;
  try {
    const c = await caches.open('cf-avisos');
    await c.put(URL_AVISOS(), new Response(JSON.stringify(agendaAvisos()), { headers: { 'Content-Type': 'application/json' } }));
  } catch (e) { /* sem cache, sem aviso */ }
}
let avisoCelEstado = '';
async function ativarAvisos() {
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !location.protocol.startsWith('http')) {
    avisoCelEstado = 'Este navegador não mostra avisos.';
    return render();
  }
  const p = await Notification.requestPermission();
  if (p !== 'granted') {
    avisoCelEstado = 'Os avisos foram bloqueados. Libere as notificações deste site nas configurações do navegador e tente de novo.';
    return render();
  }
  lsSet('cf-avisos-on', true);
  await gravarAgendaAvisos();
  const reg = await navigator.serviceWorker.ready;
  let fechado = false;
  if ('periodicSync' in reg) {
    try { await reg.periodicSync.register('cf-avisos', { minInterval: 12 * 3600 * 1000 }); fechado = true; } catch (e) { /* app não instalado */ }
  }
  avisoCelEstado = fechado ? 'Avisos ativados, também com o app fechado.'
    : 'Avisos ativados. Para receber com o app fechado, instale o app na tela inicial (Android) e ative de novo; no iPhone e no computador, os avisos aparecem ao abrir o app.';
  try { await reg.showNotification('Avisos ativados', { body: 'Você será avisado de faturas a vencer e do check list.', icon: 'icon-192.png', tag: 'cf-teste' }); } catch (e) {}
  render();
}
async function desativarAvisos() {
  lsSet('cf-avisos-on', false);
  avisoCelEstado = 'Avisos desativados.';
  try {
    const reg = await navigator.serviceWorker.ready;
    if (reg.periodicSync) await reg.periodicSync.unregister('cf-avisos');
    await caches.delete('cf-avisos');
  } catch (e) {}
  render();
}
function blocoAvisosCelular() {
  const on = avisosLigados() && 'Notification' in window && Notification.permission === 'granted';
  return `<section class="card" id="avisosCelular"><h2>Avisos no celular</h2>
      <p class="muted">Avisa da fatura que vence em até 3 dias (se o Check list não marcar paga) e do Check list a partir do dia 5. Com o app instalado no Android, avisa mesmo com o app fechado; o Android escolhe a hora (cerca de uma ou duas vezes por dia). No iPhone e no computador, os avisos aparecem só ao abrir o app.</p>
      <div class="row" style="margin-top:8px">${on ? '<button class="ghost-tema" id="avisosDesligar" onclick="desativarAvisos()">Desativar avisos</button>' : '<button id="avisosLigar" onclick="ativarAvisos()">Ativar avisos</button>'}</div>
      ${avisoCelEstado ? `<p id="avisoCelEstado" style="margin-top:8px">${esc(avisoCelEstado)}</p>` : ''}
    </section>`;
}

/* ---------- calendário: vencimentos e parcelas ----------
   A fatura de um mês vence no mês seguinte, no dia cadastrado para o cartão (S.config.vencimentos):
   a fatura de outubro, com vencimento dia 10, vence em 10 de novembro. */
const vencCfg = () => S.config.vencimentos || {};
function dataVenc(mes, dia) {
  const ultimo = new Date(Number(mes.slice(0, 4)), Number(mes.slice(5, 7)), 0).getDate();
  return `${mes}-${pad(Math.min(dia, ultimo))}`;
}
const diasEntre = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
function vencimentos(d = hoje()) {
  return S.config.cartoes.filter(c => vencCfg()[c]).map(c => {
    const dia = vencCfg()[c], m0 = mkOf(d);
    const mesVenc = dataVenc(m0, dia) >= d ? m0 : addM(m0, 1);
    const mesFatura = addM(mesVenc, -1), data = dataVenc(mesVenc, dia);
    const e = (clDoMes(mesFatura).itens || {})['fat:' + c] || {};
    return { cartao: c, data, mesFatura, valor: fatCartao(c, mesFatura), pago: !!e.pago, faltam: diasEntre(d, data) };
  }).sort((a, b) => a.data.localeCompare(b.data));
}
// Aviso geral: fatura não paga que vence em até 3 dias.
function avisoVencimento(d = hoje()) {
  const perto = vencimentos(d).filter(v => v.faltam <= 3 && v.valor > 0.005 && !v.pago);
  if (!perto.length) return '';

    <button class="small" onclick="ir('calendario')">Ver calendário</button></div>`;
}
function salvarVenc(e) {
  e.preventDefault();
  const f = e.target.elements, dia = parseInt(f.dia.value, 10);
  if (!(dia >= 1 && dia <= 31)) return alert('Informe um dia entre 1 e 31.');
  S.config.vencimentos = { ...vencCfg(), [f.cartao.value]: dia };

}
function removerVenc(i) {
  const c = S.config.cartoes[i], v = { ...vencCfg() };
  delete v[c];
  S.config.vencimentos = v;

}
// Compras que ainda têm parcelas a partir do mês m0, das que terminam primeiro às últimas.
function parcelasEmAberto(m0) {
  return S.parcelados.filter(p => mIdx(ultimaParcela(p)) >= mIdx(m0)).map(p => {
    const v = valorParcela(p), inicio = mkOf(p.inicio), fim = ultimaParcela(p);
    const restantes = mIdx(fim) - Math.max(mIdx(m0), mIdx(inicio)) + 1;
    const atual = mIdx(m0) - mIdx(inicio) + 1;
    return { descricao: p.descricao, cartao: p.cartao, parcela: v, atual: atual >= 1 ? atual : null, total: p.parcelas, inicio, fim, restantes, faltaPagar: Math.round(restantes * v * 100) / 100 };
  }).sort((a, b) => a.fim.localeCompare(b.fim) || a.descricao.localeCompare(b.descricao));
}
// Total de parcelas em cada mês e quanto fica livre em relação ao mês anterior.
function liberacaoParcelas(m0, n = 12) {
  const totalDe = m => S.parcelados.filter(p => parcelaAtiva(p, m)).reduce((a, p) => a + valorParcela(p), 0);
  return Array.from({ length: n }, (_, i) => {
    const m = addM(m0, i), ant = addM(m, -1), total = totalDe(m), dif = total - totalDe(ant);
    return { m, total, libera: dif < -0.005 ? -dif : 0, entra: dif > 0.005 ? dif : 0,
      terminaram: S.parcelados.filter(p => ultimaParcela(p) === ant).map(p => p.descricao) };
  });
}

/* ---------- exportar gastos (Excel) ----------
   Um bloco por mês, 36 meses, no modelo "Outubro (Novembro)": gastos em ordem alfabética, com nome e valor
   total, e no fim Gastos (total), Receita e Delta (receita − gastos), em fórmulas.
   A soma de cada mês é igual às "Despesas previstas" (mesBase): faturas pelo valor global, contas fixas,
   despesas eventuais, gastos à vista e o orçamento que ainda falta gastar em cada categoria.
   Fica uma folha por ano, porque o título do mês não tem o ano.
   Férias confirmadas ganham um bloco "FÉRIAS (DEZEMBRO - JANEIRO)" logo depois do 1º mês afetado, somando os
   gastos dos meses afetados e separando as receitas. Os blocos dos meses mantêm a receita normal, sem as férias. */
const MESES_LONGOS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const nomeMesLongo = m => MESES_LONGOS[Number(m.slice(5, 7)) - 1];
const tituloBlocoMes = m => `${nomeMesLongo(m)} (${nomeMesLongo(addM(m, 1))})`;
// Gastos de um mês como [tipo, nome, valor], somando o que tem o mesmo nome e tipo.
function gastosDoMes(m) {
  const itens = [];
  const add = (tipo, nome, v) => {
    if (Math.abs(v) < 0.005) return;
    const it = itens.find(x => x[0] === tipo && x[1] === nome);
    if (it) it[2] += v; else itens.push([tipo, nome, v]);
  };
  S.config.cartoes.forEach(c => add(0, c, fatCartao(c, m)));
  S.recorrentes.filter(r => r.grupo === 'Fixo' && ativo(r, m)).forEach(r => add(1, r.descricao, r.valor));
  S.eventuais.filter(e => e.tipo === 'Despesa' && e.mes === m).forEach(e => add(2, e.descricao, e.valor));
  S.lancamentos.filter(l => aVista(l) && mkOf(l.data) === m).forEach(l => add(3, l.descricao, l.valor));
  const o = orcEfetivo(m);
  S.config.categorias.forEach(c => add(4, c, Math.max(0, (Number(o[c]) || 0) - avulsosCat(c, m))));
  return itens;
}
// Os 36 meses com a mesma lista de gastos, para as linhas ficarem alinhadas entre os blocos. Sem o gasto no mês: zero.
function gastos36(ini) {
  const meses = Array.from({ length: 36 }, (_, i) => addM(ini, i));
  const porMes = meses.map(m => ({ m, itens: gastosDoMes(m) }));
  // Inclui os meses de férias confirmadas que passam do fim dos 36 meses, para o bloco FÉRIAS não perder gastos.
  const deFerias = feriasConfirmadas().filter(p => meses.includes(competenciasFerias(p)[0]))
    .flatMap(p => competenciasFerias(p)).filter(m => !meses.includes(m)).flatMap(m => gastosDoMes(m));
  const nomes = [...new Set([...porMes.flatMap(({ itens }) => itens), ...deFerias].map(x => x[1]))]
    .sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));
  const c2 = v => Math.round(v * 100) / 100;
  return { nomes, meses: porMes.map(({ m, itens }) => {
    const valores = nomes.map(n => c2(itens.filter(x => x[1] === n).reduce((a, x) => a + x[2], 0)));
    const b = mesBase(m); // receita normal do mês; os valores das férias ficam no bloco FÉRIAS
    const gastos = c2(valores.reduce((a, v) => a + v, 0)), receita = c2(b.rf + b.re);
    return { m, valores, gastos, receita, delta: c2(receita - gastos) };
  }) };
}
// Bloco consolidado de um período de férias. Sem "nomes", usa só os gastos dos meses afetados.
function blocoFerias(p, nomesBase) {
  const c2 = v => Math.round(v * 100) / 100, M = m => nomeMesLongo(m).toUpperCase();
  const comps = competenciasFerias(p), itens = comps.flatMap(m => gastosDoMes(m));
  const nomes = nomesBase || [...new Set(itens.map(x => x[1]))].sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));
  const valores = nomes.map(n => c2(itens.filter(x => x[1] === n).reduce((a, x) => a + x[2], 0)));
  const extras = (p.extras || []).map(x => ({ nome: x.nome, valor: Number(x.valor) || 0 }));
  const receitas = [{ nome: 'RECEITA FÉRIAS', valor: Number(p.valorFerias) || 0 }];
  comps.forEach(m => {
    const dias = diasTrabalhados(p, m), v = Number((p.residuais || {})[m]) || 0;
    if (dias > 0 || v) receitas.push({ nome: `RECEITA ${M(m)} (${M(addM(m, 1))}) ${dias} ${dias === 1 ? 'dia' : 'dias'}`, valor: v });
  });
  if (p.tem13) receitas.push({ nome: 'RECEITA DÉCIMO TERCEIRO', valor: Number(p.valor13) || 0 });
  const gastos = c2(valores.reduce((a, v) => a + v, 0) + extras.reduce((a, x) => a + x.valor, 0));
  const totalReceitas = c2(receitas.reduce((a, x) => a + x.valor, 0));
  const pgto = comps.map(m => M(addM(m, 1)));
  return { tipo: 'ferias', m: comps[0], titulo: `FÉRIAS (${pgto.length > 1 ? `${pgto[0]} - ${pgto[pgto.length - 1]}` : pgto[0]})`,
    nomes, valores, extras, receitas, gastos, totalReceitas, delta: c2(totalReceitas - gastos) };
}
// Blocos na ordem da exportação: cada mês e, depois do 1º mês afetado, o bloco das férias confirmadas.
function sequenciaGastos(ini) {
  const { nomes, meses } = gastos36(ini);
  const conf = feriasConfirmadas();
  return { nomes, blocos: meses.flatMap(x => [{ tipo: 'mes', titulo: tituloBlocoMes(x.m), ...x },
    ...conf.filter(p => competenciasFerias(p)[0] === x.m).map(p => blocoFerias(p, nomes))]) };
}
const FMT_GASTO = '_-"R$"\\ * #,##0.00_-;\\-"R$"\\ * #,##0.00_-;_-"R$"\\ * "-"??_-;_-@_-';
function abasGastos(ini) {
  const { nomes, blocos } = sequenciaGastos(ini);
  const col = i => { let s = ''; i += 1; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; };
  const anos = [...new Set(blocos.map(x => x.m.slice(0, 4)))];
  return anos.map(ano => {
    const doAno = blocos.filter(x => x.m.slice(0, 4) === ano);
    // Título, gastos (mais os extras das férias), uma linha em branco e os totais. Linhas do Excel (começam em 1):
    const maxExtras = Math.max(0, ...doAno.map(x => (x.extras || []).length));
    const fimItens = nomes.length + maxExtras + 1, lGastos = fimItens + 2;
    const linhas = [];
    const put = (l, c, nome, valor) => {
      for (let i = linhas.length; i < l; i++) linhas[i] = [];
      linhas[l - 1][c] = { v: nome, tema: 'linha' };
      linhas[l - 1][c + 1] = typeof valor === 'object' ? { ...valor, tema: 'linha' } : { v: valor, z: FMT_GASTO, tema: 'linha' };
    };
    linhas[0] = [];
    const larguras = [], mesclas = [];
    doAno.forEach((x, k) => {
      const c = k * 3; // nome, valor e uma coluna de separação
      linhas[0][c] = { v: x.titulo, tema: 'titulo' };
      linhas[0][c + 1] = { v: '', tema: 'titulo' };
      mesclas.push(`${col(c)}1:${col(c + 1)}1`);
      nomes.forEach((n, i) => put(i + 2, c, n, x.valores[i]));
      const v = col(c + 1);
      const fGastos = F(`SUM(${v}2:${v}${fimItens})`, x.gastos, FMT_GASTO);
      if (x.tipo === 'ferias') {
        x.extras.forEach((e, j) => put(nomes.length + 2 + j, c, e.nome, e.valor));
        put(lGastos, c, 'Gastos', fGastos);
        x.receitas.forEach((r, j) => put(lGastos + 1 + j, c, r.nome, r.valor));
        const fim = lGastos + x.receitas.length;
        put(fim + 2, c, 'DELTA', F(`SUM(${v}${lGastos + 1}:${v}${fim})-${v}${lGastos}`, x.delta, FMT_GASTO));
        larguras.push(Math.max(16, ...nomes.map(n => n.length + 2), ...x.extras.map(e => e.nome.length + 2), ...x.receitas.map(r => r.nome.length + 2)), 14, 3);
      } else {
        put(lGastos, c, 'Gastos', fGastos);
        put(lGastos + 1, c, 'Receita', x.receita);
        put(lGastos + 2, c, 'Delta', F(`${v}${lGastos + 1}-${v}${lGastos}`, x.delta, FMT_GASTO));
        larguras.push(Math.max(16, ...nomes.map(n => n.length + 2)), 14, 3);
      }
    });
    return { nome: ano, linhas, larguras, mesclas };
  });
}
let expIni = null; // primeiro mês da exportação; null = mês anterior ao de hoje, o do check list da vez
const expMes = () => expIni || addM(mkOf(hoje()), -1);
function exportarGastos() {
  XL.baixar(XL.gerar(abasGastos(expMes())), `gastos-36-meses-${expMes()}.xlsx`);
}
const valorBloco = v => (v ? brl(v) : 'R$ -');
// Um bloco em HTML, igual ao do Excel. Usado na prévia, no PDF e na aba Férias.
function htmlBlocoGastos(x, nomes, comAno = true) {
  const itens = nomes.map((n, i) => `<tr><td>${esc(n)}</td><td class="num">${valorBloco(x.valores[i])}</td></tr>`).join('');
  const ano = comAno ? ` <span class="exp-ano">${x.m.slice(0, 4)}</span>` : '';
  const vazia = '<tr class="exp-vazia"><td colspan="2"></td></tr>';
  const fim = x.tipo === 'ferias'
    ? `${x.extras.map(e => `<tr><td>${esc(e.nome)}</td><td class="num">${valorBloco(e.valor)}</td></tr>`).join('')}${vazia}
       <tr><td>Gastos</td><td class="num">${valorBloco(x.gastos)}</td></tr>
       ${x.receitas.map(r => `<tr><td>${esc(r.nome)}</td><td class="num">${valorBloco(r.valor)}</td></tr>`).join('')}${vazia}
       <tr><td>DELTA</td><td class="num">${valorBloco(x.delta)}</td></tr>`
    : `${vazia}<tr><td>Gastos</td><td class="num">${valorBloco(x.gastos)}</td></tr>
       <tr><td>Receita</td><td class="num">${valorBloco(x.receita)}</td></tr>
       <tr><td>Delta</td><td class="num">${valorBloco(x.delta)}</td></tr>`;
  return `<table class="exp-bloco ${x.tipo === 'ferias' ? 'exp-ferias' : ''}"><thead><tr><th colspan="2">${esc(x.titulo)}${ano}</th></tr></thead><tbody>${itens}${fim}</tbody></table>`;
}
// PDF: abre a impressão do navegador só com os blocos, em paisagem. É lá que se escolhe "Salvar como PDF".
function exportarGastosPDF() {
  const { nomes, blocos } = sequenciaGastos(expMes());
  const anos = [...new Set(blocos.map(x => x.m.slice(0, 4)))];
  $('impressao').innerHTML = anos.map(a => `<h3>${a}</h3><div class="exp-grade">${blocos.filter(x => x.m.slice(0, 4) === a).map(x => htmlBlocoGastos(x, nomes, false)).join('')}</div>`).join('');
  const pagina = document.createElement('style');
  pagina.textContent = '@page{size:A4 landscape;margin:8mm}';
  document.head.appendChild(pagina);
  document.body.classList.add('imprimindo');
  const fim = () => { document.body.classList.remove('imprimindo'); pagina.remove(); $('impressao').innerHTML = ''; window.removeEventListener('afterprint', fim); };
  window.addEventListener('afterprint', fim);
  window.print();
}

V.exportar = () => {

      <p class="muted" style="margin-top:10px">Um bloco por mês e uma folha por ano, com os gastos em ordem alfabética, pelo nome e o valor total. No fim de cada mês: Gastos (o total), Receita e Delta (receita menos gastos). Faturas aparecem pelo valor global de cada cartão. Sem gasto no mês, o valor aparece como "R$ -".</p>

/* ---------- regras de categoria ----------
   "Se a descrição contém X, a categoria é Y". Valem no lançamento (ao sair da descrição) e na importação de fatura,
   antes da sugestão pelo histórico. S.regrasCategoria = [{ id, texto, categoria }]. */
const regraPara = desc => {
  const d = semAcento(desc || '');
  return (S.regrasCategoria || []).find(r => r.texto && d.includes(semAcento(r.texto)) && S.config.categorias.includes(r.categoria));
};
function aplicarRegra(form) {
  if (!form || !form.categoria || !form.descricao) return;
  const r = regraPara(form.descricao.value);
  if (r) form.categoria.value = r.categoria;
}
function addRegra(e) {
  e.preventDefault();
  const f = e.target.elements, texto = f.texto.value.trim();
  if (!texto) return alert('Informe o texto que a descrição deve conter.');
  if ((S.regrasCategoria || []).some(r => semAcento(r.texto) === semAcento(texto))) return alert(`Já existe uma regra para "${texto}".`);
  S.regrasCategoria = [...(S.regrasCategoria || []), { id: uid(), texto, categoria: f.categoria.value }];
  commit();
}
function delRegra(id) { S.regrasCategoria = (S.regrasCategoria || []).filter(r => r.id !== id); commit(); }
function blocoRegras() {
  const regras = S.regrasCategoria || [];
  return `<section class="card" id="regrasCategoria"><h2>Regras de categoria</h2>
      <form class="fields" onsubmit="addRegra(event)">
        <label>Se a descrição contém<input type="text" name="texto" placeholder="Ex.: UBER" required></label>
        <label>A categoria é<select name="categoria">${opts(S.config.categorias)}</select></label>
        <button>Adicionar regra</button>
      </form>
      ${regras.length ? `<div class="scroll" style="margin-top:10px"><table><thead><tr><th>A descrição contém</th><th>Categoria</th><th></th></tr></thead><tbody>
        ${regras.map(r => `<tr><td>${esc(r.texto)}</td><td>${esc(r.categoria)}</td><td class="num"><button class="small danger" onclick="delRegra('${r.id}')">Excluir</button></td></tr>`).join('')}
      </tbody></table></div>` : ''}
      <p class="muted" style="margin-top:10px">A regra escolhe a categoria sozinha ao lançar (quando você sai do campo Descrição) e ao importar uma fatura. Não importa maiúscula nem acento. A primeira regra que servir é a usada.</p>
    </section>`;
}

/* ---------- importar fatura do cartão ----------
   Lê a fatura (PDF, CSV, OFX, Excel ou texto colado) no próprio aparelho: o arquivo não é enviado para lugar nenhum.
   Cada item vira uma linha para revisar, e só entra no app o que estiver marcado ao clicar em "Lançar".
   Compra → lançamento no cartão; "Parcela 3/10" → parcelamento (as parcelas seguintes entram sozinhas nas próximas
   faturas); valor negativo → ajuste na fatura (crédito); pagamento da fatura anterior → ignorado.
   O mês é o da fatura no modelo do app: a fatura de outubro vence em novembro. */
// Leitores baixados só quando necessários: PDF (pdf.js), imagem e PDF escaneado (Tesseract, reconhecimento de texto)
// e Excel antigo .xls (SheetJS).
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/';
const TESS_CORE = 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/';
const TESS_POR = 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/por@1.0.0/4.0.0_best_int';
const SHEETJS = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const MESES_CURTOS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const RE_DATA_FAT = '(\\d{1,2})[\\/.-](\\d{1,2})(?:[\\/.-](\\d{4}|\\d{2}))?|(\\d{1,2})\\s*(?:de\\s+)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\\.?(?:\\s*(?:de\\s+)?(\\d{4})(?!\\d))?';
const DATA_NC = RE_DATA_FAT.replace(/\((?!\?)/g, '(?:'); // a mesma, sem grupos de captura
// Valor: "1.234,56", "R$ 12,00", "-R$ 12,00", "12,00-", "12,00 C" (crédito) ou "12,00 D". O ponto como decimal
// ("23.90") também vale, porque o reconhecimento de texto de imagens às vezes troca a vírgula.
const RE_VALOR_FAT = '[-−–]?\\s*(?:R\\$\\s*)?[-−–]?\\s*(?:\\d{1,3}(?:\\.\\d{3})+|\\d+)[,.]\\d{2}(?![\\d,.])-?(?:\\s?[DCdc](?![A-Za-zÀ-ú]))?';
const PAGAMENTO_FAT = /\b(pagamento|pgto|pagto)\b|pag(amento)?\s+(de\s+)?fatura|payment/i;
const IGNORAR_FAT = /^(vencimento|total|subtotal|saldo|limite|fechamento|emiss[aã]o|pagamento m[ií]nimo|valor m[ií]nimo)/i;
let impFat = null; // { cartao, mes, origem, itens, total, venc }
let impMsg = '';

// Número no formato brasileiro ("1.234,56", "-R$ 12,00", "12,00-") ou americano ("1234.56").
function numFatura(s) {
  if (typeof s === 'number') return s;
  let t = String(s).replace(/\s|R\$|US\$|BRL/gi, '').replace(/[−–]/g, '-');
  const credito = /\dC$/i.test(t);
  t = t.replace(/(\d)[DC]$/i, '$1');
  const neg = credito || /^-|-$/.test(t) || /^\(.*\)$/.test(t);
  t = t.replace(/[-()]/g, '');
  t = /,\d{1,2}$/.test(t) ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  const n = parseFloat(t);
  return isNaN(n) ? null : (neg ? -n : n);
}
// Data como aparece na fatura: { d, m, y } (y = null quando a fatura não traz o ano).
function dataFatura(s) {
  if (typeof s === 'number') s = isoData(s);
  s = String(s || '').trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/) || s.match(/^(\d{4})(\d{2})(\d{2})/);
  if (m) return { d: +m[3], m: +m[2], y: +m[1] };
  m = s.match(new RegExp('^(?:' + RE_DATA_FAT + ')', 'i'));
  if (!m) return null;
  const d = +(m[1] || m[4]), mes = m[2] ? +m[2] : MESES_CURTOS.indexOf(m[5].toLowerCase()) + 1;
  let y = m[3] || m[6] ? +(m[3] || m[6]) : null;
  if (y != null && y < 100) y += 2000;
  return d >= 1 && d <= 31 && mes >= 1 && mes <= 12 ? { d, m: mes, y } : null;
}
// Sem ano na fatura: o ano mais recente que não passa do vencimento (mês seguinte ao da fatura).
function resolverDataFat(dt, mes) {
  const venc = addM(mes, 1);
  let y = dt.y;
  if (y == null) { y = +venc.slice(0, 4); if (mIdx(`${y}-${pad(dt.m)}`) > mIdx(venc)) y--; }
  return `${y}-${pad(dt.m)}-${pad(Math.min(dt.d, new Date(y, dt.m, 0).getDate()))}`;
}
// "LOJA PARC 02/10", "Loja - Parcela 2/10", "LOJA 02/10", "Parcela 2 de 10" → { descricao: 'LOJA', parcela: { k: 2, n: 10 } }.
function separarParcela(desc) {
  const res = [/\s*[-–(]?\s*parc(?:ela)?\.?\s*(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})\)?/i, /\s+\(?(\d{1,2})\/(\d{1,2})\)?\s*$/];
  for (const re of res) {
    const m = desc.match(re);
    if (m && +m[1] >= 1 && +m[2] >= 2 && +m[2] <= 72 && +m[1] <= +m[2])
      return { descricao: desc.replace(m[0], ' ').replace(/\s+/g, ' ').replace(/[\s-–]+$/, '').trim(), parcela: { k: +m[1], n: +m[2] } };
  }
  return { descricao: desc.trim(), parcela: null };
}

// Texto da fatura (PDF, imagem ou colado): cada compra começa com a data e termina com o valor.
// Uma linha pode ter mais de uma compra (faturas em duas colunas). Nos apps de banco, a data costuma vir sozinha
// numa linha ("09 OUT", "Sex, 9 de outubro") e as compras abaixo só com nome e valor: elas ficam com essa data.
function itensDoTexto(texto) {
  const VAL = `((?:\\s+(?:US\\$\\s*)?${RE_VALOR_FAT})+)`;
  const re = new RegExp(`^\\s*(${DATA_NC})\\s+(.+?)${VAL}(?=\\s+(?:${DATA_NC})\\s|\\s*$)`, 'i');
  const soData = new RegExp(`^\\s*(?:[a-zà-ú]{3,}\\.?,?\\s+)?(${DATA_NC})\\s*$`, 'i');
  const semData = new RegExp(`^\\s*(.*?[A-Za-zÀ-ú].*?)${VAL}\\s*$`, 'i');
  const limpar = d => d.replace(/\s+(US\$|R\$|RS|R\$-)\s*$/i, '').replace(/^[^A-Za-zÀ-ú0-9*]+/, '').trim();
  const valorFinal = s => { const v = s.match(new RegExp(RE_VALOR_FAT, 'g')); return numFatura(v[v.length - 1]); };
  const itens = [];
  let dataAtual = null;
  texto.split(/\r?\n/).forEach(linha => {
    const so = linha.match(soData);
    if (so) { dataAtual = dataFatura(so[1]); return; }
    let resto = linha, achou = false;
    for (let g = 0; g < 6; g++) {
      const m = resto.match(re);
      if (!m) break;
      itens.push({ dt: dataFatura(m[1]), descricao: limpar(m[2]), valor: valorFinal(m[3]) });
      resto = resto.slice(m[0].length);
      achou = true;
    }
    const m = !achou && dataAtual && linha.match(semData);
    if (m && limpar(m[1])) itens.push({ dt: dataAtual, descricao: limpar(m[1]), valor: valorFinal(m[2]) });
  });
  return itens;
}
// Tabela (CSV ou Excel): acha o cabeçalho com data e valor, e as colunas de descrição e parcela.
function itensDaTabela(linhas) {
  const norm = v => semAcento(String(v == null ? '' : v)).trim();
  const h = linhas.findIndex(l => l && l.some(c => /^(data|date)/.test(norm(c))) && l.some(c => /valor|amount|value/.test(norm(c))));
  if (h < 0) return null;
  const cab = linhas[h].map(norm);
  const achar = (...res) => { for (const r of res) { const i = cab.findIndex(c => r.test(c)); if (i >= 0) return i; } return -1; };
  const iD = achar(/^data( de compra| da compra)?$/, /^data/, /^date/);
  const iDesc = achar(/descri/, /estabelecimento/, /lancamento/, /^title$/, /historico/, /^titulo/, /memo/, /^nome$/);
  const iV = achar(/valor.*r\$/, /^valor$/, /^amount$/, /valor/, /amount|value/);
  const iP = achar(/^parcela/, /installment/);
  if (iDesc < 0) return null;
  return linhas.slice(h + 1).map(l => {
    if (!l || l[iV] == null || l[iV] === '') return null;
    const dt = dataFatura(l[iD]), valor = numFatura(l[iV]);
    let desc = String(l[iDesc] == null ? '' : l[iDesc]).trim();
    const p = iP >= 0 ? String(l[iP] == null ? '' : l[iP]).trim() : '';
    const mp = p.match(/^(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})$/i);
    if (mp) desc += ` Parcela ${mp[1]}/${mp[2]}`;
    return dt && valor != null && desc ? { dt, descricao: desc, valor } : null;
  }).filter(Boolean);
}
function lerCSV(t) {
  const prim = t.split(/\r?\n/).slice(0, 5).join('\n');
  const sep = [';', '\t', ','].map(s => [s, prim.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
  const linhas = [];
  let l = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { l.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; l.push(c); linhas.push(l); l = []; c = ''; }
    else c += ch;
  }
  if (c || l.length) { l.push(c); linhas.push(l); }
  return linhas;
}
// OFX: cada <STMTTRN> é um item. No OFX de cartão, as compras costumam vir negativas: se a maioria for, inverte.
function itensDoOFX(t) {
  const campo = (b, n) => { const m = b.match(new RegExp('<' + n + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
  const itens = t.split(/<STMTTRN>/i).slice(1).map(b => ({ dt: dataFatura(campo(b, 'DTPOSTED')), descricao: campo(b, 'MEMO') || campo(b, 'NAME'), valor: numFatura(campo(b, 'TRNAMT')) }))
    .filter(x => x.dt && x.valor != null && x.descricao);
  if (itens.filter(x => x.valor < 0).length > itens.length / 2) itens.forEach(x => { x.valor = -x.valor; });
  return itens;
}
function vencimentoNoTexto(t) {
  const m = t.match(new RegExp('vencimento[^0-9\\n]{0,25}(' + DATA_NC + ')', 'i'));
  const dt = m && dataFatura(m[1]);
  if (!dt) return null;
  return resolverDataFat(dt, addM(mkOf(hoje()), 5)); // sem ano: o mais recente até alguns meses à frente
}
function totalNoTexto(t) {
  const m = t.match(new RegExp(`(?:total\\s+(?:da|desta|de\\s+sua)\\s+fatura|valor\\s+total(?:\\s+da\\s+fatura)?|total\\s+a\\s+pagar)[^0-9\\n]{0,30}?(${RE_VALOR_FAT})`, 'i'));
  return m ? numFatura(m[1]) : null;
}

// Baixa um leitor na primeira vez que ele for usado; sem internet, falha com 'internet'.
const carregandoScript = {};
function carregarScript(url, global) {
  if (window[global]) return Promise.resolve(window[global]);
  carregandoScript[url] = carregandoScript[url] || new Promise((ok, falha) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => ok(window[global]);

const carregarPdfjs = () => carregarScript(PDFJS + 'pdf.min.js', 'pdfjsLib').then(lib => { lib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; return lib; });

// Imagens (prints do app do banco, fotos, páginas de PDF escaneado) → texto, em português.
async function textoDasImagens(imagens) {
  const T = await carregarScript(TESS + 'tesseract.min.js', 'Tesseract');
  impStatus('Preparando o leitor de imagens (na primeira vez, baixa cerca de 15 MB)…');
  const w = await T.createWorker('por', 1, { workerPath: TESS + 'worker.min.js', corePath: TESS_CORE, langPath: TESS_POR });
  const textos = [];
  try {
    for (let i = 0; i < imagens.length; i++) {
      impStatus(`Lendo imagem ${i + 1} de ${imagens.length}…`);
      textos.push((await w.recognize(imagens[i])).data.text);
    }
  } finally { await w.terminate(); impStatus(''); }
  return textos.join('\n');
}

// PDF: o leitor (pdf.js) é baixado na primeira vez. Junta os pedaços de texto que estão na mesma altura da página.
// PDF escaneado (sem texto): desenha cada página e lê como imagem.
async function textoDoPDF(buf) {
  const lib = await carregarPdfjs();
  let doc = null, senha;
  for (let tent = 0; !doc; tent++) {
    try {
      doc = await lib.getDocument({ data: new Uint8Array(buf.slice(0)), password: senha }).promise;
    } catch (e) {
      if (e.name !== 'PasswordException' || tent > 3) throw e;
      senha = prompt(tent ? 'Senha incorreta. Digite de novo a senha do PDF:' : 'Este PDF tem senha (muitos bancos usam parte do CPF). Digite a senha para abrir; ela não é guardada:');
      if (senha == null) throw new Error('cancelado');
    }
  }
  const linhas = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const pedacos = (await (await doc.getPage(p)).getTextContent()).items.filter(i => i.str.trim());
    const grupos = [];
    pedacos.forEach(i => {
      const y = i.transform[5], g = grupos.find(x => Math.abs(x.y - y) < 3);
      if (g) g.itens.push(i); else grupos.push({ y, itens: [i] });
    });
    grupos.sort((a, b) => b.y - a.y)
      .forEach(g => linhas.push(g.itens.sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str.trim()).join(' ')));
  }
  const texto = linhas.join('\n');
  if (texto.replace(/\s/g, '').length >= 40 * doc.numPages) return texto;
  const paginas = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const pag = await doc.getPage(p), vp = pag.getViewport({ scale: 2 });
    const cv = document.createElement('canvas');
    cv.width = vp.width; cv.height = vp.height;
    await pag.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    paginas.push(cv);
  }
  return textoDasImagens(paginas);
}
function textoDoArquivo(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}

const itensDasFolhas = folhas => folhas.map(itensDaTabela).find(x => x && x.length) || [];
// Lê um arquivo e devolve as linhas brutas e o texto (para achar vencimento e total).
async function lerArquivoFatura(arq) {
  const buf = await arq.arrayBuffer(), b = new Uint8Array(buf.slice(0, 8));
  const ini = String.fromCharCode(...b);
  if (ini.startsWith('%PDF')) { const t = await textoDoPDF(buf); return { brutos: itensDoTexto(t), texto: t }; }
  if (/^image\//.test(arq.type) || /\.(png|jpe?g|webp|bmp|gif)$/i.test(arq.name)) { const t = await textoDasImagens([arq]); return { brutos: itensDoTexto(t), texto: t }; }
  if (ini.startsWith('PK')) {
    try { return { brutos: itensDasFolhas(Object.values(await XL.ler(buf))), texto: '' }; } catch (e) { /* tenta o leitor completo abaixo */ }
  }
  if (ini.startsWith('PK') || (b[0] === 0xD0 && b[1] === 0xCF)) { // Excel antigo (.xls) ou .xlsx que o leitor do app não entendeu
    const X = await carregarScript(SHEETJS, 'XLSX');
    const wb = X.read(new Uint8Array(buf), { type: 'array' });
    return { brutos: itensDasFolhas(wb.SheetNames.map(n => X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }))), texto: '' };
  }
  const t = textoDoArquivo(buf);
  if (/<STMTTRN>/i.test(t)) return { brutos: itensDoOFX(t), texto: '' };
  const tab = itensDaTabela(lerCSV(t));
  return tab && tab.length ? { brutos: tab, texto: t } : { brutos: itensDoTexto(t), texto: t };
}
// Aceita vários arquivos juntos (por exemplo, vários prints da mesma fatura).
async function impLerArquivo(...arqs) {
  arqs = arqs.flatMap(a => (a && a.length != null && !a.name ? [...a] : a ? [a] : []));
  if (!arqs.length) return;
  impMsg = '';
  try {
    const lidos = [];
    for (const a of arqs) lidos.push(await lerArquivoFatura(a));
    impMontar(lidos.flatMap(l => l.brutos), arqs.map(a => a.name).join(', '), lidos.map(l => l.texto).join('\n'));
  } catch (e) {
    impStatus('');
    if (e.message === 'cancelado') return;
    alert(e.message === 'internet' ? 'Para ler esse arquivo, o app precisa de internet na primeira vez (o leitor é baixado). Tente de novo conectado, ou cole o texto da fatura.'
      : 'Não consegui ler esse arquivo. Tente o CSV ou o OFX do banco, ou cole o texto da fatura.');
  }
}
// Fatura recebida pelo "Compartilhar" do Android: o service worker guarda os arquivos e abre o app com ?compartilhado.
async function abrirCompartilhado() {
  history.replaceState(null, '', location.pathname);
  try {
    const c = await caches.open('cf-compartilhado'), arqs = [];
    for (const k of await c.keys()) {
      const r = await c.match(k), b = await r.blob();
      arqs.push(new File([b], decodeURIComponent(r.headers.get('X-Nome') || 'fatura'), { type: b.type }));
      await c.delete(k);
    }
    if (!arqs.length) return;
    impFat = null;
    ir('importar');
    await impLerArquivo(arqs);

    alert('Não consegui abrir o arquivo compartilhado. Use o campo de arquivo na aba Importar fatura.');
  }
}

// Categoria: a mesma da última compra com a mesma descrição; senão, por palavras conhecidas; senão, Outros.
const PALAVRAS_CATEGORIA = [
  [/ifood|rappi|restaurante|lanchonete|padaria|mercado|supermerc|hortifruti|acougue|pizzaria|burger|mcdonald|cafe|atacad|assai|carrefour|pao de acucar/, 'Alimentação'],
  [/uber|99app|99 pop|99pop|taxi|posto|combust|shell|ipiranga|petrobras|estaciona|pedagio|sem parar|conectcar|metro|onibus/, 'Transporte'],
  [/farmacia|drogaria|droga|raia|pacheco|panvel|hospital|clinica|laborat|odonto|dentist|unimed/, 'Saúde'],
  [/netflix|spotify|prime video|amazon prime|disney|hbo|youtube|deezer|globoplay|apple\.com|icloud|google one|paramount|assinatura/, 'Assinaturas'],
  [/cinema|ingresso|teatro|steam|playstation|xbox|nintendo|hotel|airbnb|booking|decolar|latam/, 'Lazer'],
  [/escola|faculdade|curso|udemy|alura|livraria|papelaria/, 'Educação'],
  [/renner|riachuelo|c&a|zara|shein|centauro|netshoes|calcad|hering/, 'Vestuário'],
  [/aluguel|condominio|energia|enel|cemig|copel|sabesp|internet/, 'Moradia']

const chaveDesc = d => semAcento(d || '').replace(/[^a-z ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !/^parc/.test(w)).slice(0, 2).join(' ');
function categoriaSugerida(desc) {
  const regra = regraPara(desc);
  if (regra) return regra.categoria;
  const cats = S.config.categorias, k = chaveDesc(desc);
  const h = k && [...S.lancamentos, ...S.parcelados].filter(x => x.categoria && cats.includes(x.categoria) && chaveDesc(x.descricao) === k).pop();
  if (h) return h.categoria;
  const d = semAcento(desc);
  const p = PALAVRAS_CATEGORIA.find(([re, c]) => re.test(d) && cats.includes(c));
  return p ? p[1] : (cats.includes('Outros') ? 'Outros' : cats[0]);
}

function impMontar(brutos, origem, texto) {
  const itens = brutos.filter(b => b.dt && b.valor && !IGNORAR_FAT.test(b.descricao)).map(b => {
    const { descricao, parcela } = separarParcela(b.descricao);
    const tipo = PAGAMENTO_FAT.test(descricao) ? 'pagamento' : b.valor < 0 ? 'credito' : 'compra';
    return { id: uid(), dt: b.dt, descricao, valor: Math.round(Math.abs(b.valor) * 100) / 100, parcela: tipo === 'compra' ? parcela : null, tipo,
      categoria: categoriaSugerida(descricao) };
  });
  if (!itens.length) {
    impFat = null;
    impMsg = 'Não encontrei compras nesse arquivo. Tente o CSV ou o OFX do banco, ou copie o texto da fatura e cole no campo abaixo.';
    return render();
  }
  // Mês da fatura: pelo vencimento, se a fatura informar; senão, o mês com mais compras à vista.
  const venc = texto ? vencimentoNoTexto(texto) : null;
  let mes = venc ? addM(mkOf(venc), -1) : null;
  if (!mes) {
    const cont = {};
    itens.filter(i => i.tipo === 'compra' && !i.parcela).forEach(i => { const m = mkOf(resolverDataFat(i.dt, addM(mkOf(hoje()), 1))); cont[m] = (cont[m] || 0) + 1; });
    mes = Object.keys(cont).sort((a, b) => cont[b] - cont[a] || b.localeCompare(a))[0] || addM(mkOf(hoje()), -1);
  }
  impFat = { cartao: impFat && impFat.cartao || S.config.cartoes[0] || '', mes, venc, origem, itens, total: texto ? totalNoTexto(texto) : null };
  impAnalisar();
  render();
}
// Situação de cada item no cartão e mês escolhidos: o que já está no app fica desmarcado.
function impAnalisar() {
  const { cartao, mes } = impFat, usados = new Set();
  impFat.itens.forEach(it => {
    const data = resolverDataFat(it.dt, mes);
    let sit;
    if (it.tipo === 'pagamento') sit = 'pagamento';
    else if (it.tipo === 'credito') sit = (S.creditos || []).some(c => c.cartao === cartao && c.mes === mes && Math.abs(c.valor - it.valor) < 0.01) ? 'lancado' : 'credito';
    else if (it.parcela) {
      const p = S.parcelados.find(x => !usados.has(x.id) && x.cartao === cartao && x.parcelas === it.parcela.n && Math.abs(valorParcela(x) - it.valor) < 0.02 && parcelaAtiva(x, mes));
      if (p) usados.add(p.id);
      sit = p ? 'lancado' : 'parcela';
    } else {
      const l = S.lancamentos.find(x => !usados.has(x.id) && x.forma === 'Cartão' && x.cartao === cartao && Math.abs(x.valor - it.valor) < 0.01 &&
        (Math.abs(diasEntre(x.data, data)) <= 3 || (mesFatLanc(x) === mes && chaveDesc(x.descricao) === chaveDesc(it.descricao))));
      const r = !l && S.recorrentes.find(x => !usados.has(x.id) && x.grupo === 'Cartão' && x.cartao === cartao && Math.abs(x.valor - it.valor) < 0.01 && recNaFatura(x, mes));
      if (l || r) usados.add((l || r).id);
      sit = l ? 'lancado' : r ? 'recorrente' : 'nova';
    }
    it.situacao = sit;
    it.marcado = ['nova', 'parcela', 'credito'].includes(sit);
  });
}
const SITUACAO_FAT = {
  nova: 'Nova compra', parcela: 'Parcela: cria o parcelamento', credito: 'Crédito: ajuste na fatura',
  lancado: 'Já está no app', recorrente: 'Já prevista (recorrente)', pagamento: 'Pagamento: ignorado'

function impItem(id, campo, v) {

// "Sempre assim": cria a regra com as primeiras palavras da descrição e aplica nos outros itens iguais.
function impRegra(id) {

  const texto = it && chaveDesc(it.descricao);

    S.regrasCategoria = [...(S.regrasCategoria || []).filter(r => semAcento(r.texto) !== texto), { id: uid(), texto, categoria: it.categoria }];
  impFat.itens.forEach(x => { if (x.tipo === 'compra' && regraPara(x.descricao)) x.categoria = regraPara(x.descricao).categoria; });

function lancarFatura() {
  const { cartao, mes } = impFat;
  if (!cartao) return alert('Escolha o cartão.');
  const sel = impFat.itens.filter(i => i.marcado && i.tipo !== 'pagamento');
  if (!sel.length) return alert('Nenhum item marcado.');
  const n = { compra: 0, parcela: 0, credito: 0 };
  sel.forEach(it => {
    const data = resolverDataFat(it.dt, mes);
    if (it.tipo === 'credito') {
      S.creditos = [...(S.creditos || []), { id: uid(), cartao, mes, valor: it.valor, descricao: it.descricao }];
      n.credito++;
    } else if (it.parcela) {
      const { k, n: tot } = it.parcela;
      S.parcelados.push({ id: uid(), dataCompra: data, cartao, descricao: it.descricao, categoria: it.categoria,
        valorTotal: Math.round(it.valor * tot * 100) / 100, valorParcela: it.valor, parcelas: tot, inicio: addM(mes, -(k - 1)) });
      n.parcela++;
    } else {
      // A compra fica na fatura escolhida: do mês da fatura, ou do mês anterior como "próxima fatura".
      // Compra de outro mês (lançada atrasada pelo banco) entra no 1º dia do mês, com a data original na descrição.
      const mm = mkOf(data), d = mIdx(mm) - mIdx(mes);
      const dataFinal = d === 0 || d === -1 ? data : d < -1 ? `${addM(mes, -1)}-01` : `${mes}-01`;
      S.lancamentos.push({ id: uid(), data: dataFinal, descricao: it.descricao + (dataFinal === data ? '' : ` (compra de ${fmtData(data)})`),
        categoria: it.categoria, forma: 'Cartão', cartao, valor: it.valor, ...(mkOf(dataFinal) !== mes ? { prox: true } : {}) });
      n.compra++;
    }
  });
  // Check list do mês: guarda o total da fatura do banco, para conferir o pagamento com um toque.
  const lido = Math.round(impFat.itens.filter(i => i.tipo !== 'pagamento').reduce((a, i) => a + (i.tipo === 'credito' ? -i.valor : i.valor), 0) * 100) / 100;
  const banco = impFat.total != null ? impFat.total : lido;
  if (!S.checklist) S.checklist = {};
  const cl = S.checklist[mes] = S.checklist[mes] || { itens: {} };
  cl.itens = cl.itens || {};
  cl.itens['fat:' + cartao] = { ...(cl.itens['fat:' + cartao] || {}), banco };
  impMsg = `Lançado na fatura ${mFatura(mes)} do ${cartao}: ${n.compra} compra(s), ${n.parcela} parcelamento(s) e ${n.credito} crédito(s). O total do banco (${brl(banco)}) foi para o Check list de ${mNome(mes)}.`;
  faturaMes = mes;
  impFat = null;
  commit();
}

/* ---------- período de férias: datas, meses afetados e valores ---------- */
const fpPlano = id => (S.feriasPlanos || []).find(x => x.id === id);
function somaDias(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
// Ao informar o início, sugere 30 dias de férias; o fim pode ser alterado.
function fpSugerirFim(form) {
  const f = form.elements;
  if (f.inicio.value) f.fim.value = somaDias(f.inicio.value, 29);
}
function addPeriodoFerias(e) {
  e.preventDefault();
  const f = e.target.elements;
  if (!f.inicio.value || !f.fim.value) return alert('Informe o início e o fim das férias.');
  if (f.fim.value < f.inicio.value) return alert('O fim das férias não pode ser antes do início.');
  S.feriasPlanos = [...(S.feriasPlanos || []), { id: uid(), inicio: f.inicio.value, fim: f.fim.value, valorFerias: null, residuais: {},
    tem13: false, valor13: null, extras: [], naoSubstitui: [], confirmado: false }];
  commit();
}
const fpNumero = v => { const n = parseFloat(v); return n >= 0 ? n : null; };
function fpData(id, campo, valor) {
  const p = fpPlano(id);
  if (!p || !valor) return render();
  const novo = { ...p, [campo]: valor };
  if (novo.fim < novo.inicio) { alert('O fim das férias não pode ser antes do início.'); return render(); }
  p[campo] = valor;
  commit();
}
function fpCampo(id, campo, valor) { const p = fpPlano(id); if (p) { p[campo] = fpNumero(valor); commit(); } }
function fpResidual(id, m, valor) {
  const p = fpPlano(id);
  if (!p) return;
  const n = fpNumero(valor);
  p.residuais = { ...(p.residuais || {}) };
  if (n === null) delete p.residuais[m]; else p.residuais[m] = n;
  commit();
}
function fp13(id, valor) { const p = fpPlano(id); if (p) { p.tem13 = valor === 'sim'; commit(); } }
function fpSubst(id, rid, substitui) {
  const p = fpPlano(id);
  if (!p) return;
  const fora = (p.naoSubstitui || []).filter(x => x !== rid);
  p.naoSubstitui = substitui ? fora : [...fora, rid];
  commit();
}
function addExtraFerias(e, id) {
  e.preventDefault();
  const p = fpPlano(id), f = e.target.elements, nome = f.nome.value.trim(), valor = fpNumero(f.valor.value);
  if (!p) return;
  if (!nome) return alert('Informe o nome do gasto.');
  if (valor === null) return alert('Informe o valor (pode ser zero).');
  p.extras = [...(p.extras || []), { id: uid(), nome, valor }];
  commit();
}
function delExtraFerias(id, eid) { const p = fpPlano(id); if (p) { p.extras = (p.extras || []).filter(x => x.id !== eid); commit(); } }
// Só confirma com os valores preenchidos: confirmar é o que leva as férias para a Projeção.
function fpConfirmar(id) {
  const p = fpPlano(id);
  if (!p) return;
  const comps = competenciasFerias(p), faltam = [];
  if (p.valorFerias == null) faltam.push('o valor das férias');
  comps.forEach(m => { if (diasTrabalhados(p, m) > 0 && (p.residuais || {})[m] == null) faltam.push(`o salário residual de ${mNome(m)}`); });
  if (p.tem13 && p.valor13 == null) faltam.push('o valor do 13º');
  if (faltam.length) return alert(`Para confirmar, informe ${faltam.join(', ')}.`);
  const choque = feriasConfirmadas().find(o => o.id !== id && competenciasFerias(o).some(m => comps.includes(m)));
  if (choque) return alert(`Estas férias usam um mês das férias confirmadas de ${fmtData(choque.inicio)} a ${fmtData(choque.fim)}. Volte aquelas para simulação antes de confirmar estas.`);
  p.confirmado = true;
  commit();
}
function fpSimular(id) { const p = fpPlano(id); if (p) { p.confirmado = false; commit(); } }

function htmlPeriodoFerias(p) {

  const num = (id, rotulo, valor, acao) => `<label>${rotulo}<input type="number" step="0.01" min="0" id="${id}" value="${valor != null ? valor : ''}" onchange="${acao}"></label>`;

    <p class="fp-status ${p.confirmado ? 'pos' : ''}"><strong>${p.confirmado ? '✓ Confirmada: já está na Projeção' : 'Simulação: nada entra na Projeção'}</strong></p>
    <div class="filtros" style="margin-top:8px">
      <label>Início<input type="date" id="fpI_${p.id}" value="${p.inicio}" onchange="fpData('${p.id}', 'inicio', this.value)"></label>
      <label>Fim<input type="date" id="fpF_${p.id}" value="${p.fim}" onchange="fpData('${p.id}', 'fim', this.value)"></label>

    <div class="filtros">
      ${comps.map(m => {

        return d > 0 ? num(`fpR_${p.id}_${m}`, `${tituloBlocoMes(m)} · ${d} ${d === 1 ? 'dia trabalhado' : 'dias trabalhados'} (R$)`, (p.residuais || {})[m], `fpResidual('${p.id}', '${m}', this.value)`)
          : `<p class="muted">${tituloBlocoMes(m)}: mês inteiro de férias, sem salário residual.</p>`;
      }).join('')}
    </div>
    <h3 class="fp-sub">Férias e 13º</h3>
    <div class="filtros">
      ${num(`fpV_${p.id}`, 'Valor das férias (R$)', p.valorFerias, `fpCampo('${p.id}', 'valorFerias', this.value)`)}
      <label>Haverá 13º?<select id="fp13_${p.id}" onchange="fp13('${p.id}', this.value)"><option value="nao" ${p.tem13 ? '' : 'selected'}>Não</option><option value="sim" ${p.tem13 ? 'selected' : ''}>Sim</option></select></label>
      ${p.tem13 ? num(`fpD_${p.id}`, 'Valor do 13º (R$)', p.valor13, `fpCampo('${p.id}', 'valor13', this.value)`) : ''}
    </div>
    <h3 class="fp-sub">Gastos extras do período (opcional)</h3>
    <form class="fields" onsubmit="addExtraFerias(event, '${p.id}')">
