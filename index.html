      <button>Adicionar</button>
    </form>
    ${(p.extras || []).length ? `<div class="fp-extras" style="margin-top:8px">${p.extras.map(x => `<span class="chip">${esc(x.nome)}: ${valorBloco(x.valor)} <button class="small danger" onclick="delExtraFerias('${p.id}', '${x.id}')">×</button></span>`).join('')}</div>` : ''}
    <h3 class="fp-sub">Receitas normais que as férias substituem</h3>
    ${unicas.length ? `<div class="fp-subst">${unicas.map(({ x }) => `<label style="grid-auto-flow:column;justify-content:start;align-items:center;gap:8px;margin:4px 0"><input type="checkbox" id="fpS_${p.id}_${x.id}" ${(p.naoSubstitui || []).includes(x.id) ? '' : 'checked'} onchange="fpSubst('${p.id}', '${x.id}', this.checked)"> ${esc(x.descricao)} (${brl(x.valor)})</label>`).join('')}</div>
      <p class="muted">Nos meses afetados, as receitas marcadas saem da Projeção e entram os valores acima. Desmarque o que você continua recebendo normalmente.</p>` : '<p class="muted">Nenhuma receita prevista nesses meses.</p>'}
    <h3 class="fp-sub">Resultado</h3>
    <div class="grid fp-totais">
      ${card('Gastos dos meses', brl(b.gastos), comps.length > 1 ? 'Meses somados' : 'Gastos do mês', 'neg')}
      ${card('Receitas informadas', brl(b.totalReceitas), 'Férias, salários residuais e 13º', 'pos')}
      ${card('Delta', brl(b.delta), 'Receitas menos gastos', b.delta < 0 ? 'neg' : 'pos')}
    </div>
    <div class="scroll" style="margin-top:12px">${htmlBlocoGastos(b, b.nomes, false)}</div>
    <div class="row" style="margin-top:12px">
      ${p.confirmado ? `<button class="ghost-tema" onclick="fpSimular('${p.id}')">Voltar para simulação</button>`
        : `<button onclick="fpConfirmar('${p.id}')">Confirmar férias</button>`}
      <button class="danger" onclick="excluir('feriasPlanos','${p.id}')">Excluir</button>
    </div>
    <p class="muted" style="margin-top:8px">Na Projeção, as férias, o 13º e os gastos extras entram no primeiro mês afetado, e cada salário residual entra no próprio mês. Confirmadas, as férias também aparecem na exportação em Excel e em PDF.</p>
  </section>`;
}

/* ---------- plano de férias ----------
   O usuário informa cada valor que recebe e quais meses ele fica responsável por quitar. Valores cujos
   meses se sobrepõem formam um bloco: os gastos dos meses são unificados e comparados com a soma dos valores.
   Não altera a Projeção; período com falta entra como alerta e limite na Saúde financeira.
   S.planoFerias = [{ id, descricao, valor, de: 'aaaa-mm', ate: 'aaaa-mm' }]. */
function blocosFerias() {
  const itens = [...(S.planoFerias || [])].sort((a, b) => a.de.localeCompare(b.de) || a.ate.localeCompare(b.ate));
  const blocos = [];
  itens.forEach(it => {
    const ult = blocos[blocos.length - 1];
    if (ult && mIdx(it.de) <= mIdx(ult.ate)) {
      ult.itens.push(it);
      if (mIdx(it.ate) > mIdx(ult.ate)) ult.ate = it.ate;
    } else blocos.push({ de: it.de, ate: it.ate, itens: [it] });
  });
  blocos.forEach(b => {
    b.meses = Array.from({ length: mIdx(b.ate) - mIdx(b.de) + 1 }, (_, i) => {
      const m = addM(b.de, i), x = mesBase(m);
      return { m, fixas: x.ef, faturas: x.fat, outros: x.av + x.ed, orcamento: x.ov, total: x.I, receitas: x.rt };
    });
    b.valor = b.itens.reduce((a, i) => a + i.valor, 0);
    b.gastos = b.meses.reduce((a, x) => a + x.total, 0);
    b.receitas = b.meses.reduce((a, x) => a + x.receitas, 0);
    b.resultado = Math.round((b.valor - b.gastos) * 100) / 100;
  });
  return blocos;
}
let pfEdit = null;
function editarPF(id) {
  pfEdit = id;
  render();
  const form = document.querySelector('form[onsubmit="salvarPF(event)"]');
  if (form) form.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function cancelarPF() { pfEdit = null; render(); }
function dadosPF(f) {
  const valor = parseFloat(f.valor.value), descricao = f.descricao.value.trim(), de = f.de.value, ate = f.ate.value || de;
  if (!descricao) return alert('Informe a descrição.'), null;
  if (!(valor > 0)) return alert('Informe um valor maior que zero.'), null;
  if (!de) return alert('Informe o primeiro mês que este valor cobre.'), null;
  if (mIdx(ate) < mIdx(de)) return alert('O último mês não pode ser anterior ao primeiro.'), null;
  return { descricao, valor, de, ate };
}
function addPF(e) {
  e.preventDefault();
  const d = dadosPF(e.target.elements);
  if (!d) return;
  S.planoFerias = [...(S.planoFerias || []), { id: uid(), ...d }];
  commit();
}
function salvarPF(e) {
  e.preventDefault();
  const it = (S.planoFerias || []).find(x => x.id === pfEdit);
  if (!it) { pfEdit = null; return render(); }
  const d = dadosPF(e.target.elements);
  if (!d) return;
  Object.assign(it, d);
  pfEdit = null;
  commit();
}
const nomePeriodo = (de, ate) => (de === ate ? mNome(de) : `${mNome(de)} a ${mNome(ate)}`);
const textoResultado = v => (v < 0 ? `Falta ${brl(-v)}` : v > 0 ? `Sobra ${brl(v)}` : 'Fica zerado');

V.ferias = () => {
  const blocos = blocosFerias();
  const it = pfEdit ? (S.planoFerias || []).find(x => x.id === pfEdit) : null;
  if (pfEdit && !it) pfEdit = null;
  const padrao = addM(mkOf(hoje()), 1);
  const totalValor = blocos.reduce((a, b) => a + b.valor, 0), totalGastos = blocos.reduce((a, b) => a + b.gastos, 0);
  const final = blocos.reduce((a, b) => a + b.resultado, 0);
  const faltas = blocos.filter(b => b.resultado < 0);
  const quadros = blocos.map((b, n) => `
    <section class="card pf-bloco"><h2>${blocos.length > 1 ? `Bloco ${n + 1}: ` : ''}${nomePeriodo(b.de, b.ate)}</h2>
      <div class="big ${b.resultado < 0 ? 'neg' : 'pos'}">${textoResultado(b.resultado)}</div>
      <p class="muted">${brl(b.valor)} informados − ${brl(b.gastos)} de gastos${b.meses.length > 1 ? ' unificados' : ''}.
        ${b.resultado < 0 ? `Para fechar, guarde ${brl(-b.resultado)} antes de ${mNome(b.de)}.` : ''}</p>
      <div class="scroll pf-valores" style="margin-top:10px"><table>
        <thead><tr><th>Valor informado</th><th class="num">Valor</th><th></th></tr></thead>
        <tbody>${b.itens.map(x => `<tr><td>${esc(x.descricao)}<div class="muted">Cobre ${nomePeriodo(x.de, x.ate)}</div></td><td class="num pos">${brl(x.valor)}</td>
          <td class="num"><button class="small" onclick="editarPF('${x.id}')">Editar</button>
          <button class="danger small" onclick="excluir('planoFerias','${x.id}')">Excluir</button></td></tr>`).join('')}</tbody>
      </table></div>
      <div class="scroll" style="margin-top:12px"><table>
        <thead><tr><th>Mês</th><th class="num">Gastos</th><th class="num">Fixas</th><th class="num">Faturas</th><th class="num">À vista e eventuais</th><th class="num">Orçamento restante</th></tr></thead>
        <tbody>${b.meses.map(x => `<tr><td>${mNome(x.m)}</td><td class="num"><strong>${brl(x.total)}</strong></td><td class="num">${brl(x.fixas)}</td><td class="num">${brl(x.faturas)}</td><td class="num">${brl(x.outros)}</td><td class="num">${brl(x.orcamento)}</td></tr>`).join('')}</tbody>
        ${b.meses.length > 1 ? `<tfoot><tr><th>Gastos unificados</th><th class="num">${brl(b.gastos)}</th><th colspan="4"></th></tr></tfoot>` : ''}
      </table></div>
      ${b.receitas > 0.005 ? `<p class="muted" style="margin-top:8px">Há ${brl(b.receitas)} de receitas já previstas nesses meses (Recorrentes e Eventuais). Elas não entram nesta conta: se o salário for substituído pelas férias, não some os dois.</p>` : ''}
    </section>`).join('');
  return `
    <section class="card"><h2>Novo período de férias</h2>
      <form class="fields" onsubmit="addPeriodoFerias(event)">
        <label>Início das férias<input type="date" name="inicio" required onchange="fpSugerirFim(this.form)"></label>
        <label>Fim das férias<input type="date" name="fim" required></label>
        <button>Ver meses afetados</button>
      </form>
      <p class="muted" style="margin-top:10px">Com as datas, o app mostra os meses afetados, os dias trabalhados em cada um e os campos para os valores. Fica como simulação até você confirmar: só então entra na Projeção e na exportação.</p>
    </section>
    ${(S.feriasPlanos || []).map(htmlPeriodoFerias).join('')}
    <section class="card"><h2>${it ? 'Editar valor' : 'Plano livre: novo valor'}</h2>
      <form class="fields" onsubmit="${it ? 'salvarPF' : 'addPF'}(event)">
        <label>Descrição<input type="text" name="descricao" value="${it ? esc(it.descricao) : ''}" placeholder="Ex.: férias + 1/3" required></label>
        <label>Valor (R$)<input type="number" step="0.01" min="0.01" name="valor" value="${it ? it.valor : ''}" required></label>
        <label>Cobre de<input type="month" name="de" value="${it ? it.de : padrao}" required></label>
        <label>Até (se for mais de um mês)<input type="month" name="ate" value="${it ? it.ate : padrao}"></label>
        <button>${it ? 'Salvar alterações' : 'Adicionar'}</button>
        ${it ? '<button type="button" class="small" onclick="cancelarPF()">Cancelar</button>' : ''}
      </form>
      <p class="muted" style="margin-top:10px">Informe cada valor que você vai receber e quais meses ele fica responsável por quitar, olhando o aviso de férias e o holerite. Se o valor cobre mais de um mês, os gastos desses meses são somados. Valores que cobrem o mesmo mês entram na mesma conta.</p>
    </section>
    ${blocos.length ? `<section class="grid" id="pfResumo">
      ${card('Total informado', brl(totalValor), `${(S.planoFerias || []).length} valor(es)`)}
      ${card('Gastos dos meses cobertos', brl(totalGastos), `${blocos.reduce((a, b) => a + b.meses.length, 0)} mês(es)`)}
      ${card('Resultado final', textoResultado(Math.round(final * 100) / 100), faltas.length ? `${faltas.length} período(s) com falta: veja abaixo quanto guardar` : 'Os valores cobrem os gastos dos meses informados', final < 0 || faltas.length ? 'neg' : 'pos')}
    </section>${quadros}` : '<section class="card"><p class="muted">Nenhum valor informado. Adicione o primeiro acima para ver quanto sobra ou falta.</p></section>'}
    <section class="card"><p class="muted">Este plano não altera a Projeção. Um período com falta reduz a nota de Saúde financeira e aparece nos alertas dela. Os gastos vêm dos seus lançamentos e do orçamento, então mudam quando você lança algo novo nesses meses.</p></section>`;
};

// Transforma uma receita eventual em recorrente, a partir do mês dela.

  const e = S.eventuais.find(x => x.id === id);

// Aviso quando há dados e o último backup exportado tem mais de 30 dias.
function avisoBackup() {
  if (falhaSalvar) return `<div class="aviso"><span>Não foi possível salvar neste navegador (armazenamento cheio ou bloqueado). Exporte o backup agora, senão as alterações podem se perder.</span>
    <button class="small" onclick="exportar()">Exportar backup</button></div>`;
  const temDados = S.recorrentes.length || S.parcelados.length || S.eventuais.length ||
    S.lancamentos.length || S.patrimonio.aportes.length;
  if (!temDados) return '';
  const avisos = [];
  if (lsGet('cf-base', null) === null) avisos.push('Este aparelho ainda não está sincronizado com o Drive: os dados ficam só neste navegador.');
  const copia = lsGet('cf-sync', {}).ultimaCopia, ultimo = [S.ultimoBackup, copia].filter(Boolean).sort().pop();
  const dias = ultimo ? Math.floor((new Date(hoje()) - new Date(ultimo)) / 864e5) : null;
  if (dias === null || dias > 30) avisos.push(dias === null ? 'Você ainda não exportou um backup.' : `Último backup há ${dias} dias.`);
  if (!avisos.length) return '';
  return `<div class="aviso"><span>${avisos.join(' ')}</span>
    <button class="small" onclick="exportar()">Exportar backup</button></div>`;
}

let abaRenderizada = null;

/* ---------- calculadora ----------
   Botão flutuante em todas as abas. O resultado pode ir para o último campo de valor tocado
   (ou, se nenhum foi tocado, para o primeiro campo de valor da aba). */
// Avalia + − × ÷ e parênteses, sem eval. Número com vírgula usa ponto como milhar (1.234,56);
// sem vírgula, o ponto é a casa decimal. Devolve null se a conta estiver incompleta ou inválida.
function calcAvaliar(expr) {
  const toks = String(expr).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').match(/\d[\d.,]*|[-+*/()]|\S/g) || [];
  let i = 0;
  const num = t => {
    const s = t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : ((t.match(/\./g) || []).length > 1 ? t.replace(/\./g, '') : t);
    return /^\d+(\.\d+)?\.?$/.test(s) ? Number(s) : NaN;
  };
  const fator = () => {
    const t = toks[i++];
    if (t === '-') return -fator();
    if (t === '+') return fator();
    if (t === '(') { const v = soma(); if (toks[i++] !== ')') throw 0; return v; }
    if (t !== undefined && /^\d/.test(t)) { const v = num(t); if (isNaN(v)) throw 0; return v; }
    throw 0;
  };
  const termo = () => { let v = fator(); while (toks[i] === '*' || toks[i] === '/') v = toks[i++] === '*' ? v * fator() : v / fator(); return v; };
  function soma() { let v = termo(); while (toks[i] === '+' || toks[i] === '-') v = toks[i++] === '+' ? v + termo() : v - termo(); return v; }
  try {
    if (!toks.length) return null;
    const v = soma();
    return i === toks.length && isFinite(v) ? Math.round(v * 1e8) / 1e8 : null;
  } catch (e) { return null; }
}
const calcFmt = v => v.toLocaleString('pt-BR', { maximumFractionDigits: 2 });

let calcExpr = '';
let calcAlvo = null; // { form, name, rotulo } do último campo de valor tocado
document.addEventListener('focusin', e => {
  const el = e.target;
  if (!el.matches || !el.matches('#conteudo input[type=number]')) return;
  const lb = el.closest('label');
  calcAlvo = { id: el.id, form: el.form ? el.form.getAttribute('onsubmit') : '', name: el.name,
    rotulo: lb ? lb.firstChild.textContent.trim() : (el.getAttribute('aria-label') || el.name) };
  if (!$('calc').hidden) calcDesenhar();
});
const visivelEl = el => !!el && el.offsetParent !== null;
// Campo que vai receber o resultado: o último tocado (se ainda estiver na tela) ou o primeiro campo de valor da aba.
function calcCampo() {
  if (calcAlvo) {
    const el = calcAlvo.form ? document.querySelector(`#conteudo form[onsubmit="${calcAlvo.form}"] [name="${calcAlvo.name}"]`) : $(calcAlvo.id);
    if (visivelEl(el)) return { el, rotulo: calcAlvo.rotulo };
  }
  const el = [...document.querySelectorAll('#conteudo input[type=number]')]
    .find(x => visivelEl(x) && /^valor/.test(x.name));
  if (!el) return null;
  const lb = el.closest('label');
  return { el, rotulo: lb ? lb.firstChild.textContent.trim() : el.name };
}
function calcDesenhar() {
  const r = calcAvaliar(calcExpr), alvo = calcCampo();
  const tecla = (t, cls = '', v = t) => `<button type="button" class="${cls}" onclick="calcTecla('${v}')">${t}</button>`;
  $('calc').innerHTML = `
    <div class="calc-barra" id="calcBarra" onpointerdown="calcArrastar(event)" title="Arraste para mover"><span>⠿ Calculadora</span>
      <button type="button" class="small" onclick="calcFechar()" aria-label="Fechar">✕</button></div>
    <input class="visor" id="calcVisor" inputmode="none" autocomplete="off" aria-label="Conta" value="${esc(calcExpr)}"
      oninput="calcExpr=this.value;calcPrevia()" onkeydown="calcTeclado(event)">
    <div class="res" id="calcRes">${r !== null && calcExpr ? '= ' + calcFmt(r) : ''}</div>
    <div class="teclas">
      ${tecla('C', 'op')}${tecla('(', 'op')}${tecla(')', 'op')}${tecla('÷', 'op')}
      ${tecla('7')}${tecla('8')}${tecla('9')}${tecla('×', 'op')}
      ${tecla('4')}${tecla('5')}${tecla('6')}${tecla('−', 'op')}
      ${tecla('1')}${tecla('2')}${tecla('3')}${tecla('+', 'op')}
      ${tecla('0')}${tecla(',')}${tecla('⌫', 'op')}${tecla('=', 'igual')}
    </div>
    <button type="button" id="calcUsar" onclick="calcUsar()" ${alvo && r !== null ? '' : 'disabled style="opacity:.5"'}>${
      alvo ? `Usar em "${esc(alvo.rotulo)}"` : 'Nenhum campo de valor nesta aba'}</button>`;
}
// Atualiza só a prévia e o botão "Usar" (sem redesenhar o visor, para não perder o cursor ao digitar).
function calcPrevia() {
  const r = calcAvaliar(calcExpr), b = $('calcUsar');
  $('calcRes').textContent = r !== null && calcExpr ? '= ' + calcFmt(r) : '';
  if (b && calcCampo()) { b.disabled = r === null; b.style.opacity = r === null ? '.5' : ''; }
}
function calcTecla(t) {
  if (t === 'C') calcExpr = '';
  else if (t === '⌫') calcExpr = calcExpr.slice(0, -1);
  else if (t === '=') { const r = calcAvaliar(calcExpr); if (r !== null) calcExpr = calcFmt(r).replace(/\./g, ''); }
  else calcExpr += t;
  calcDesenhar();
}
function calcTeclado(e) {
  if (e.key === 'Enter') { e.preventDefault(); calcTecla('='); setTimeout(() => $('calcVisor').focus(), 0); }
  if (e.key === 'Escape') calcFechar();
}
function calcAbrir() {
  if (!$('calc').hidden) return calcFechar();
  $('calc').hidden = false;
  calcDesenhar();
  calcPosicionar();
}
// Arrastar pela barra do topo, para tirar a calculadora de cima do que se quer ver. A posição vale até fechar o app.
let calcPos = null;
function calcArrastar(e) {
  if (e.target.closest('button')) return;
  const r = $('calc').getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
  const mover = ev => { calcPos = { x: ev.clientX - dx, y: ev.clientY - dy }; calcPosicionar(); };
  const soltar = () => { removeEventListener('pointermove', mover); removeEventListener('pointerup', soltar); };
  addEventListener('pointermove', mover);
  addEventListener('pointerup', soltar);
  e.preventDefault();
}
// Mantém a calculadora inteira dentro da janela (também ao mudar o tamanho ou o zoom).
function calcPosicionar() {
  const el = $('calc');
  if (!calcPos || el.hidden) return;
  const x = Math.max(0, Math.min(calcPos.x, innerWidth - el.offsetWidth)), y = Math.max(0, Math.min(calcPos.y, innerHeight - el.offsetHeight));
  Object.assign(el.style, { left: x + 'px', top: y + 'px', right: 'auto', bottom: 'auto' });
}
addEventListener('resize', calcPosicionar);
function calcFechar() { $('calc').hidden = true; }
function calcUsar() {
  const r = calcAvaliar(calcExpr), alvo = calcCampo();
  if (r === null || !alvo) return;
  alvo.el.value = (Math.round(r * 100) / 100).toFixed(2);
  alvo.el.dispatchEvent(new Event('input', { bubbles: true }));
  alvo.el.dispatchEvent(new Event('change', { bubbles: true }));
  calcFechar();
  alvo.el.scrollIntoView({ block: 'center' });
  alvo.el.focus({ preventScroll: true });
}

/* ---------- foco e rascunhos ----------
   Ao lançar, o cursor volta ao primeiro campo do mesmo formulário; o que foi digitado
   e ainda não lançado fica salvo no navegador (sem senhas nem dados de sincronização). */
const RASC_KEY = 'cf-rascunhos';
// Formulários de edição (salvarLanc, salvarRec, salvarEv) também ficam sem rascunho: eles servem para qualquer item,
// e um rascunho de outra edição sobrescreveria os dados do item aberto.
const SEM_RASCUNHO = /salvarClientId|trocarSenha|conectar|senha|^salvar(Lanc|Rec|Ev|PF)\(/i;
let ultimoEnvio = null;
document.addEventListener('submit', e => {
  const k = e.target && e.target.getAttribute && e.target.getAttribute('onsubmit');
  if (!k) return;
  ultimoEnvio = k;
  setTimeout(() => { ultimoEnvio = null; }, 0);
}, true);

function lerRascunhos() { try { return JSON.parse(localStorage.getItem(RASC_KEY) || '{}'); } catch (e) { return {}; } }
function gravarRascunhos(o) { try { localStorage.setItem(RASC_KEY, JSON.stringify(o)); } catch (e) {} }
const chaveForm = el => (el.form && el.form.getAttribute('onsubmit')) || null;
function salvarRascunho(el) {
  const k = chaveForm(el);
  if (!k || !el.name || !['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)) return;
  if (el.type === 'password' || el.type === 'file' || el.type === 'checkbox' || el.type === 'radio' || SEM_RASCUNHO.test(k)) return;
  const r = lerRascunhos();
  (r[k] = r[k] || {})[el.name] = el.value;
  gravarRascunhos(r);
}
document.addEventListener('input', e => salvarRascunho(e.target), true);
document.addEventListener('change', e => salvarRascunho(e.target), true);

function restaurarRascunhos() {
  const r = lerRascunhos();
  let mudou = false;
  // Apaga rascunhos de formulários que não usam rascunho (sobras de versões anteriores do app).
  Object.keys(r).forEach(k => { if (SEM_RASCUNHO.test(k)) { delete r[k]; mudou = true; } });
  $('conteudo').querySelectorAll('form[onsubmit]').forEach(form => {
    const k = form.getAttribute('onsubmit');
    if (k === ultimoEnvio) { if (r[k]) { delete r[k]; mudou = true; } return; } // acabou de ser lançado: volta vazio
    const d = r[k];
    if (!d) return;
    Object.entries(d).forEach(([nome, valor]) => {
      const el = form.elements[nome];
      if (el && el.type !== 'password' && el.value !== valor) el.value = valor;
    });
  });
  if (mudou) gravarRascunhos(r);
}

const chaveCampo = el => [el.id, el.name, el.getAttribute('onchange') || '', el.getAttribute('oninput') || '', chaveForm(el) || ''].join('|');
function capturarFoco() {
  const a = document.activeElement;
  if (!a || !$('conteudo').contains(a) || !['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName)) return null;
  let pos = null;
  try { pos = a.selectionStart; } catch (e) {}
  return { chave: chaveCampo(a), pos };
}
function restaurarFoco(foco) {
  const c = $('conteudo');
  if (ultimoEnvio) {
    const form = [...c.querySelectorAll('form')].find(f => f.getAttribute('onsubmit') === ultimoEnvio);
    const primeiro = form && form.querySelector('input:not([type=hidden]):not([type=button]):not([type=submit]), select, textarea');
    if (primeiro) primeiro.focus({ preventScroll: true });
    return;
  }
  if (!foco) return;
  const el = [...c.querySelectorAll('input, select, textarea')].find(x => chaveCampo(x) === foco.chave);
  if (!el) return;
  el.focus({ preventScroll: true });
  if (foco.pos != null) { try { el.setSelectionRange(foco.pos, foco.pos); } catch (e) {} }
}

/* ---------- handlers ---------- */
function marcarFerias(m, on) {
  if (on) S.ferias[m] = true; else delete S.ferias[m];
  commit();
}

function setOrc(cat, valor) {
  const m = S.config.mesRef;
  if (!S.orcamentoMeses[m]) S.orcamentoMeses[m] = { ...S.orcamento };
  S.orcamentoMeses[m][cat] = parseFloat(valor) || 0;
  commit();
}

function copiarOrc(e) {
  e.preventDefault();
  const f = e.target.elements;
  const origem = mkOf(S.config.mesRef);
  const de = f.de.value, ate = f.ate.value;
  if (!de || !ate || mIdx(ate) < mIdx(de)) return alert('O mês final deve ser igual ou posterior ao inicial.');
  const off = mIdx(ate) - mIdx(de);
  if (off > 120) return alert('Período máximo: 10 anos.');
  const destinos = [];
  for (let o = 0; o <= off; o++) {
    const m = addM(de, o);
    if (m !== origem) destinos.push(m);
  }
  if (!destinos.length) return alert('O período não inclui meses diferentes do mês de referência.');
  if (!confirm(`Copiar o orçamento de ${mNome(origem)} para ${destinos.length} mês(es)? Os orçamentos desses meses serão substituídos.`)) return;
  const valores = { ...orcEfetivo(origem) };
  destinos.forEach(m => { S.orcamentoMeses[m] = { ...valores }; });
  commit();
  alert(`Orçamento copiado para ${destinos.length} mês(es).`);
}

function addLista(e, lista) {

function delLista(lista, i) {
  const nome = S.config[lista][i];
  const usado = lista === 'cartoes'
    ? S.parcelados.some(p => p.cartao === nome) || S.recorrentes.some(r => r.cartao === nome) ||
      S.lancamentos.some(l => l.cartao === nome) || (S.creditos || []).some(x => x.cartao === nome)
    : S.lancamentos.some(l => l.categoria === nome) || S.recorrentes.some(r => r.categoria === nome) ||
      S.parcelados.some(p => p.categoria === nome) || (S.regrasCategoria || []).some(r => r.categoria === nome);
  if (usado) return alert(`"${nome}" está em uso. Para trocar o nome sem perder nada, use "Renomear".`);
  if (lista === 'cartoes' && S.config.vencimentos) delete S.config.vencimentos[nome];
  S.config[lista].splice(i, 1);
  commit();
}

// Troca o nome de um cartão ou categoria em todos os lugares em que ele aparece, inclusive nas opções fixas.
function renomearLista(e, lista) {
  e.preventDefault();
  const f = e.target.elements;
  const antigo = f.antigo.value, novo = f.novo.value.trim();
  if (!novo || novo === antigo) return;
  if (S.config[lista].some(x => x !== antigo && x.toLowerCase() === novo.toLowerCase())) return alert(`Já existe "${novo}".`);
  if (lista === 'categorias' && novo === CARTOES) return alert(`"${CARTOES}" é reservado para a linha das faturas no orçamento.`);
  const campo = lista === 'cartoes' ? 'cartao' : 'categoria';
  const troca = arr => (arr || []).forEach(x => { if (x[campo] === antigo) x[campo] = novo; });
  S.config[lista] = S.config[lista].map(x => (x === antigo ? novo : x));
  troca(S.parcelados); troca(S.recorrentes); troca(S.lancamentos); troca(S.regrasCategoria);
  if (lista === 'cartoes') {
    troca(S.creditos);
    if (S.config.vencimentos && S.config.vencimentos[antigo]) { S.config.vencimentos[novo] = S.config.vencimentos[antigo]; delete S.config.vencimentos[antigo]; }
    // O check list guarda as faturas pelo nome do cartão.
    Object.values(S.checklist || {}).forEach(c => {
      if (c.itens && c.itens['fat:' + antigo]) { c.itens['fat:' + novo] = c.itens['fat:' + antigo]; delete c.itens['fat:' + antigo]; }
    });
  } else {
    // Orçamentos são guardados por nome da categoria.
    const renomeiaChave = o => { if (o && Object.prototype.hasOwnProperty.call(o, antigo)) { o[novo] = o[antigo]; delete o[antigo]; } };
    renomeiaChave(S.orcamento);
    Object.values(S.orcamentoMeses || {}).forEach(renomeiaChave);
  }
  [['cf-lanc-fixo', lancFixo], ['cf-rec-fixo', recFixo], ['cf-parc-fixo', parcFixo]].forEach(([k, o]) => {
    if (o && o[campo] === antigo) { o[campo] = novo; try { localStorage.setItem(k, JSON.stringify(o)); } catch (err) {} }
  });
  commit();
}

function excluir(tipo, id) {

  if (!confirm(`Excluir ${nome ? `"${nome}"` : 'este item'}?${extra}`)) return;

  commit();
}


// Forma de pagamento na planilha: 'Cartão: Nubank' vira forma 'Cartão' + cartão 'Nubank'.
// Coluna "Fatura" da planilha: "Próxima" (com ou sem acento, qualquer caixa) marca a fatura seguinte.
const ehProxima = v => /^pr[oó]xima/i.test(String(v || '').trim());
// Data 'aaaa-mm-dd' n meses depois, como o EDATE da planilha (dia limitado ao fim do mês).
function addMesData(iso, n) {
  if (!n) return iso;
  const [a, m, d] = iso.split('-').map(Number);
  const k = a * 12 + (m - 1) + n, ano = Math.floor(k / 12), mes = k % 12 + 1;
  const ultimo = new Date(ano, mes, 0).getDate();
  return `${ano}-${pad(mes)}-${pad(Math.min(d, ultimo))}`;
}

function formaECartao(v) {
  const t = v ? String(v) : '';
  const m = /^Cartão: (.+)$/.exec(t);
  return m ? { forma: 'Cartão', cartao: m[1].trim() } : { forma: t, cartao: '' };
}

function addLanc(e) {
  e.preventDefault();
  const f = e.target.elements;
  const descricao = f.descricao.value.trim();
  if (!descricao) return alert('Informe a descrição.');

  if (f.parcelada.checked) {
    const parcelas = parseInt(f.nParcelas.value, 10);
    const valorParc = parseFloat(f.valorParcela.value);
    if (!(parcelas >= 1)) return alert('Informe o número de parcelas.');
    if (!(valorParc > 0)) return alert('Informe o valor de cada parcela.');
    if (!f.cartao.value) return alert('Escolha o cartão.');
    if (!f.primeira.value) return alert('Informe o mês da 1ª parcela.');
    S.parcelados.push({
      id: uid(), dataCompra: f.data.value, cartao: f.cartao.value, descricao,
      categoria: f.categoria.value, valorTotal: Math.round(parcelas * valorParc * 100) / 100,
      valorParcela: valorParc, parcelas, inicio: f.primeira.value
    });
  } else {
    const valor = parseFloat(f.valor.value);
    if (!(valor > 0)) return alert('Informe um valor maior que zero.');
    if (f.forma.value === 'Cartão' && !f.cartao.value) return alert('Escolha o cartão em que o gasto foi lançado.');
    S.lancamentos.push({ id: uid(), data: f.data.value, descricao, categoria: f.categoria.value, forma: f.forma.value,
      cartao: f.forma.value === 'Cartão' ? f.cartao.value : '', valor,
      ...(f.forma.value === 'Cartão' && f.fatura.value === 'prox' ? { prox: true } : {}) });
  }
  commit();
}

// Dados do formulário de recorrente (null se inválido).
function dadosRec(f) {
  const valor = parseFloat(f.valor.value);
  if (!(valor > 0)) return alert('Informe um valor maior que zero.'), null;
  if (f.grupo.value === 'Cartão' && !f.cartao.value) return alert('Escolha o cartão.'), null;
  if (f.fim.value && f.fim.value < f.inicio.value) return alert('A data final não pode ser anterior à inicial.'), null;
  return {
    descricao: f.descricao.value.trim(), grupo: f.grupo.value,
    cartao: f.grupo.value === 'Cartão' ? f.cartao.value : '',
    prox: f.grupo.value === 'Cartão' && f.fatura.value === 'prox',
    categoria: f.categoria.value, valor, inicio: f.inicio.value, fim: f.fim.value
  };
}

// Edição: altera o próprio item (mesmo id), sem excluir nem recriar.
let recEdit = null;
function editarRec(id) {
  recEdit = id;
  render();
  // O formulário de edição fica no topo da aba: leva a tela até ele e posiciona o cursor no 1º campo.
  const form = document.querySelector('form[onsubmit="salvarRec(event)"]');
  if (form) {
    form.scrollIntoView({ block: 'start', behavior: 'smooth' });
    const primeiro = form.querySelector('input, select');
    if (primeiro) setTimeout(() => primeiro.focus({ preventScroll: true }), 300);
  }
}
function cancelarRec() { recEdit = null; render(); }
// Dia anterior a uma data 'aaaa-mm-dd'.
function diaAnterior(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  const x = new Date(a, m - 1, d - 1);
  return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
}
function salvarRec(e) {
  e.preventDefault();
  const f = e.target.elements;
  const it = S.recorrentes.find(x => x.id === recEdit);
  if (!it) { recEdit = null; return render(); }
  const aPartir = f.aPartir ? f.aPartir.value : '';
  if (aPartir && aPartir > it.inicio) {
    // Alteração a partir de uma data: o item antigo termina no dia anterior; o novo começa na data escolhida.
    if (it.fim && aPartir > it.fim) return alert('A data escolhida é depois do fim deste item. Use "Fim" para encerrá-lo.');
    const d = dadosRec({ descricao: f.descricao, grupo: f.grupo, cartao: f.cartao, fatura: f.fatura, categoria: f.categoria, valor: f.valor, fim: f.fim, inicio: { value: aPartir } });
    if (!d) return;
    it.fim = diaAnterior(aPartir);
    S.recorrentes.push({ id: uid(), ...d, inicio: aPartir, fim: d.fim });
    recEdit = null;
    return commit();
  }
  const d = dadosRec(f);
  if (!d) return;
  Object.assign(it, d);
  recEdit = null;
  commit();
}

function addParc(e) {
  e.preventDefault();

  const valorTotal = parseFloat(f.valorTotal.value);

  if (!(atual >= 1 && atual <= parcelas)) return alert('O nº da parcela atual deve estar entre 1 e ' + parcelas + '.');
  // Compra já em andamento: o mês informado é o da parcela atual; a 1ª parcela é calculada.
  // Só as parcelas restantes (a partir da atual) entram nas faturas e no executado.
  S.parcelados.push({
    id: uid(), dataCompra: f.dataCompra.value, cartao: f.cartao.value,
    descricao: f.descricao.value.trim(), categoria: f.categoria.value,

  });
  commit();
}

/* ---------- importação / exportação ---------- */
function importarPlanilhaLegada(todas) {
  (() => {
    try {
      const grade = nome => todas[nome] || [];
      const cel = (g, linha, col) => ((g[linha] || [])[col]) ?? null;
      const cfg = grade('Config'), rec = grade('Recorrentes'), par = grade('Compras_Parceladas');
      const ev = grade('Eventuais'), lan = grade('Lancamentos'), orc = grade('Orcamento'), proj = grade('Projecao_36m');
      if (!cfg.length) throw new Error('sem aba Config');

      const primeiroMes = mkOf(isoData(cel(cfg, 2, 1))) || S.config.primeiroMes;
      const categorias = [];
      for (let i = 7; i <= 15; i++) { const v = cel(cfg, i, 1); if (v) categorias.push(String(v).trim()); }
      const cartoes = [];
      for (let i = 7; i <= 14; i++) { const v = cel(cfg, i, 0); if (v) cartoes.push(String(v).trim()); }
      const orcamento = {};
      categorias.forEach((c, i) => { const v = Number(cel(orc, 4 + i, 1)) || 0; if (v) orcamento[c] = v; });
      const ferias = {};
      for (let i = 0; i < 36; i++) { if (Number(cel(proj, 3 + i, 9)) === 1) ferias[addM(primeiroMes, i)] = true; }

      const recorrentes = rec.slice(1).filter(r => r[0] && r[4]).map(r => ({
        id: uid(), descricao: String(r[0]), grupo: String(r[1] || 'Fixo'), cartao: r[2] ? String(r[2]) : '',
        categoria: r[3] ? String(r[3]) : 'Outros', valor: Number(r[4]) || 0,
        inicio: isoData(r[5]) || hoje(), fim: isoData(r[6])
      }));
      const parcelados = par.slice(1).filter(r => r[2] && r[3] && r[4]).map(r => ({
        id: uid(), dataCompra: isoData(r[0]) || hoje(), cartao: String(r[1] || ''), descricao: String(r[2]),
        valorTotal: Number(r[3]), parcelas: Math.max(1, parseInt(r[4], 10)),
        inicio: mkOf(isoData(r[5])) || addM(mkOf(isoData(r[0]) || hoje()), 1)
      }));
      const eventuais = ev.slice(1).filter(r => r[0] && r[3]).map(r => ({
        id: uid(), mes: mkOf(isoData(r[0])), descricao: String(r[1] || ''), tipo: String(r[2] || 'Despesa'), valor: Number(r[3]) || 0
      }));
      const lancamentos = lan.slice(1).filter(r => r[0] && r[3]).map(r => ({
        id: uid(), data: isoData(r[0]) || hoje(), descricao: String(r[1] || ''), categoria: String(r[2] || 'Outros'),
        valor: Number(r[3]) || 0, forma: String(r[4] || '')
      }));

      if (!confirm('Importar a planilha substitui orçamento, recorrentes, parcelamentos, eventuais e lançamentos atuais. O patrimônio é mantido. Continuar?')) return;
      S = {
        ...S,
        config: {
          ...S.config,
          saldoConta: Number(cel(cfg, 3, 1)) || 0,
          primeiroMes,
          cartoes: cartoes.length ? cartoes : S.config.cartoes,
          categorias: categorias.length ? categorias : S.config.categorias
        },
        orcamento, orcamentoMeses: {}, recorrentes, parcelados, estornos: [], creditos: [], movConta: [], checklist: {}, planoFerias: [], feriasPlanos: [], regrasCategoria: [], eventuais, lancamentos, ferias
      };
      commit();
      alert(`Planilha importada: ${recorrentes.length} recorrentes, ${parcelados.length} parcelamento(s), ${eventuais.length} evento(s) e ${lancamentos.length} lançamento(s).`);
    } catch (err) {
      alert('Não consegui ler essa planilha. Use o arquivo .xlsx do Orçamento e Projeção.');
    }
  })();
}

/* ---------- leitor/escritor de .xlsx embutido (sem bibliotecas externas) ---------- */
const XL = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const XMLH = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const NS_MAIN = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const NS_REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const NS_PKG = 'http://schemas.openxmlformats.org/package/2006/relationships';
  const esc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const colNome = c => { let s = ''; c += 1; while (c > 0) { const r = (c - 1) % 26; s = String.fromCharCode(65 + r) + s; c = Math.floor((c - 1) / 26); } return s; };
  const colNum = s => [...s].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
  const TAB = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = TAB[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };

  // Monta um arquivo ZIP sem compressão (método 0), com os XMLs já em texto.
  function zip(arquivos) {
    const partes = [], cd = [];
    let off = 0;
    arquivos.forEach(a => {
      const nome = enc.encode(a.nome), dados = enc.encode(a.xml), crc = crc32(dados);
      const loc = new DataView(new ArrayBuffer(30));
      loc.setUint32(0, 0x04034b50, true); loc.setUint16(4, 20, true); loc.setUint16(6, 0x0800, true);
      loc.setUint16(8, 0, true); loc.setUint16(10, 0, true); loc.setUint16(12, 0x21, true);
      loc.setUint32(14, crc, true); loc.setUint32(18, dados.length, true); loc.setUint32(22, dados.length, true);
      loc.setUint16(26, nome.length, true); loc.setUint16(28, 0, true);
      partes.push(loc, nome, dados);
      const cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true);
      cen.setUint16(10, 0, true); cen.setUint16(12, 0, true); cen.setUint16(14, 0x21, true);
      cen.setUint32(16, crc, true); cen.setUint32(20, dados.length, true); cen.setUint32(24, dados.length, true);
      cen.setUint16(28, nome.length, true); cen.setUint16(30, 0, true); cen.setUint16(32, 0, true);
      cen.setUint16(34, 0, true); cen.setUint16(36, 0, true); cen.setUint32(38, 0, true); cen.setUint32(42, off, true);
      cd.push(cen, nome);
      off += 30 + nome.length + dados.length;
    });
    const cdTam = cd.reduce((t, p) => t + p.byteLength, 0);
    const fim = new DataView(new ArrayBuffer(22));
    fim.setUint32(0, 0x06054b50, true); fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true);
    fim.setUint32(12, cdTam, true); fim.setUint32(16, off, true);
    return new Blob([...partes, ...cd, fim], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  // Gera o .xlsx a partir de abas: [{nome, linhas, larguras?, mesclas?}], onde célula = valor | {v, f, z, tema?}.
  // tema: 'titulo' (fundo verde, centralizado, com borda) ou 'linha' (com borda).
  function gerar(abas) {
    const formatos = [], estilos = [], idxEstilo = new Map();
    const estiloDe = (z, tema) => {
      if (!z && !tema) return 0;
      const chave = `${z || ''}|${tema || ''}`;
      if (!idxEstilo.has(chave)) {
        if (z && !formatos.includes(z)) formatos.push(z);
        estilos.push({ z, tema });
        idxEstilo.set(chave, estilos.length);
      }
      return idxEstilo.get(chave);
    };
    const planilhas = abas.map(a => {
      let linhas = '';
      (a.linhas || []).forEach((linha, r) => {
        let celulas = '';
        (linha || []).forEach((c, k) => {
          if (c === null || c === undefined) return;
          const obj = typeof c === 'object' ? c : { v: c };
          const ref = colNome(k) + (r + 1);
          const sAttr = (() => { const s = estiloDe(obj.z, obj.tema); return s ? ` s="${s}"` : ''; })();
          const v = obj.v;
          if (obj.f) {
            const f = `<f>${esc(String(obj.f).replace(/^=/, ''))}</f>`;
            if (typeof v === 'number' && isFinite(v)) celulas += `<c r="${ref}"${sAttr}>${f}<v>${v}</v></c>`;
            else if (typeof v === 'string' && v !== '') celulas += `<c r="${ref}"${sAttr} t="str">${f}<v>${esc(v)}</v></c>`;
            else celulas += `<c r="${ref}"${sAttr}>${f}</c>`;
          } else if (typeof v === 'number') {
            if (isFinite(v)) celulas += `<c r="${ref}"${sAttr}><v>${v}</v></c>`;
          } else if (v !== undefined && v !== null && v !== '') {
            celulas += `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
          } else if (obj.tema) {
            celulas += `<c r="${ref}"${sAttr}/>`; // célula vazia, mas com borda (ex.: parte de uma mesclagem)
          }
        });
        if (celulas) linhas += `<row r="${r + 1}">${celulas}</row>`;
      });
      const cols = a.larguras ? `<cols>${a.larguras.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
      const mesclas = a.mesclas && a.mesclas.length ? `<mergeCells count="${a.mesclas.length}">${a.mesclas.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '';
      return `${XMLH}<worksheet xmlns="${NS_MAIN}">${cols}<sheetData>${linhas}</sheetData>${mesclas}</worksheet>`;
    });
    const numFmts = formatos.length ? `<numFmts count="${formatos.length}">${formatos.map((z, i) => `<numFmt numFmtId="${164 + i}" formatCode="${esc(z)}"/>`).join('')}</numFmts>` : '';
    const xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>']
      .concat(estilos.map(({ z, tema }) => {
        const num = z ? 164 + formatos.indexOf(z) : 0;
        const titulo = tema === 'titulo';
        return `<xf numFmtId="${num}" fontId="0" fillId="${titulo ? 2 : 0}" borderId="${tema ? 1 : 0}" xfId="0"${z ? ' applyNumberFormat="1"' : ''}${titulo ? ' applyFill="1"' : ''}${tema ? ' applyBorder="1"' : ''}${titulo ? ' applyAlignment="1"><alignment horizontal="center"/></xf>' : '/>'}`;
      })).join('');
    const lado = n => `<${n} style="thin"><color auto="1"/></${n}>`;
    const styles = `${XMLH}<styleSheet xmlns="${NS_MAIN}">${numFmts}<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFA9D08E"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border>${lado('left')}${lado('right')}${lado('top')}${lado('bottom')}<diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${estilos.length + 1}">${xfs}</cellXfs></styleSheet>`;
    const workbook = `${XMLH}<workbook xmlns="${NS_MAIN}" xmlns:r="${NS_REL}"><sheets>${abas.map((a, i) => `<sheet name="${esc(a.nome)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`;
    const rels = `${XMLH}<Relationships xmlns="${NS_PKG}">${abas.map((a, i) => `<Relationship Id="rId${i + 1}" Type="${NS_REL}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${abas.length + 1}" Type="${NS_REL}/styles" Target="styles.xml"/></Relationships>`;
    const ct = `${XMLH}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${abas.map((a, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
    const raiz = `${XMLH}<Relationships xmlns="${NS_PKG}"><Relationship Id="rId1" Type="${NS_REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
    return zip([
      { nome: '[Content_Types].xml', xml: ct }, { nome: '_rels/.rels', xml: raiz },
      { nome: 'xl/workbook.xml', xml: workbook }, { nome: 'xl/_rels/workbook.xml.rels', xml: rels },
      { nome: 'xl/styles.xml', xml: styles },
      ...planilhas.map((x, i) => ({ nome: `xl/worksheets/sheet${i + 1}.xml`, xml: x }))
    ]);
  }

  // Lê o .xlsx: devolve { nomeDaAba: linhas }, onde linhas[r][c] é valor, texto ou null.
  async function ler(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(buf);
    let fim = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { fim = i; break; }
    if (fim < 0) throw new Error('arquivo não é um .xlsx');
    const n = dv.getUint16(fim + 10, true);
    let p = dv.getUint32(fim + 16, true);
    const entradas = {};
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('diretório inválido');
      const metodo = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true);
      const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      const loc = dv.getUint32(p + 42, true);
      entradas[dec.decode(u8.subarray(p + 46, p + 46 + nl))] = { metodo, csz, loc };
      p += 46 + nl + el + cl;
    }
    const conteudo = async nome => {
      const e = entradas[nome];
      if (!e) return null;
      const ini = e.loc + 30 + dv.getUint16(e.loc + 26, true) + dv.getUint16(e.loc + 28, true);
      const dados = u8.subarray(ini, ini + e.csz);
      let bytes = dados;
      if (e.metodo === 8) {
        if (typeof DecompressionStream === 'undefined') throw new Error('navegador sem descompressão');
        const saida = new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        bytes = new Uint8Array(await new Response(saida).arrayBuffer());
      } else if (e.metodo !== 0) throw new Error('compressão não suportada');
      return dec.decode(bytes);
    };
    const xml = s => new DOMParser().parseFromString(s, 'application/xml');
    const textoDe = el => [...el.getElementsByTagName('t')].map(t => t.textContent).join('');
    const compartilhadas = [];
    const sst = await conteudo('xl/sharedStrings.xml');
    if (sst) [...xml(sst).getElementsByTagName('si')].forEach(si => compartilhadas.push(textoDe(si)));
    const wb = xml(await conteudo('xl/workbook.xml'));
    const rels = xml(await conteudo('xl/_rels/workbook.xml.rels'));
    const alvo = {};
    [...rels.getElementsByTagName('Relationship')].forEach(r => { alvo[r.getAttribute('Id')] = r.getAttribute('Target'); });
    const resultado = {};
    for (const sh of [...wb.getElementsByTagName('sheet')]) {
      let t = (alvo[sh.getAttribute('r:id')] || '').replace(/^\//, '');
      if (!t.startsWith('xl/')) t = 'xl/' + t;
      resultado[sh.getAttribute('name')] = lerAba(await conteudo(t), compartilhadas, textoDe);
    }
    return resultado;
  }

  function lerAba(xmlTexto, compartilhadas, textoDe) {
    const linhas = [];
    if (!xmlTexto) return linhas;
    const doc = new DOMParser().parseFromString(xmlTexto, 'application/xml');
    [...doc.getElementsByTagName('row')].forEach((linha, idx) => {
      const r = linha.getAttribute('r') ? +linha.getAttribute('r') - 1 : idx;
      linhas[r] = linhas[r] || [];
      [...linha.getElementsByTagName('c')].forEach(c => {
        const col = colNum((c.getAttribute('r') || 'A').replace(/\d+/g, ''));
        const tipo = c.getAttribute('t');
        const v = c.getElementsByTagName('v')[0];
        const is = c.getElementsByTagName('is')[0];
        let val = null;
        if (tipo === 's' && v) val = compartilhadas[+v.textContent] ?? null;
        else if (tipo === 'inlineStr' && is) val = textoDe(is);
        else if (tipo === 'str' && v) val = v.textContent;
        else if (tipo === 'b' && v) val = v.textContent === '1';
        else if (tipo === 'e' || !v) val = null;
        else { const x = Number(v.textContent); val = isNaN(x) ? v.textContent : x; }
        linhas[r][col] = val;
      });
    });
    for (let i = 0; i < linhas.length; i++) {
      linhas[i] = linhas[i] || [];
      for (let j = 0; j < linhas[i].length; j++) if (linhas[i][j] === undefined) linhas[i][j] = null;
    }
    return linhas;
  }

  function baixar(blob, nome) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  return { gerar, ler, baixar };
})();

/* ---------- planilha com fórmulas: exportar e reimportar ---------- */
const FMT_DATA = 'dd/mm/yyyy', FMT_MES = 'mm/yyyy', FMT_VALOR = '#,##0.00', FMT_PCT = '0.00%';
const NMESES = 36;
const NCART = 20; // máximo de cartões
const N = (v, z) => ({ v, z });
const F = (f, v, z) => ({ f, v: v === undefined || v === null ? '' : v, z });
const colL = c => { let s = ''; c += 1; while (c > 0) { const r = (c - 1) % 26; s = String.fromCharCode(65 + r) + s; c = Math.floor((c - 1) / 26); } return s; };
const serialDate = iso => Math.round((Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) - Date.UTC(1899, 11, 30)) / 864e5);
const serialMes = mk => serialDate(mk + '-01');
const at = (rows, r, c) => ((rows && rows[r - 1]) || [])[c] ?? null; // r: linha (1-based), c: coluna (0-based)

// Monta as abas como células (valor, fórmula e formato). Não depende da biblioteca de planilhas.

  const inicioOrc = mIdx(c.mesRef) < mIdx(c.primeiroMes) ? c.mesRef : c.primeiroMes;
  const nOrc = mIdx(c.primeiroMes) + NMESES - mIdx(inicioOrc);
  const mesesOrc = Array.from({ length: nOrc }, (_, i) => addM(inicioOrc, i));
  const meses = Array.from({ length: NMESES }, (_, i) => addM(c.primeiroMes, i));
  const colMes = i => colL(i + 1); // i = 0 → B
  const ultCol = colMes(nOrc - 1);
  const abas = [];

  abas.push({ nome: 'Leia-me', linhas: [
    ['Controle Financeiro · planilha com fórmulas'],

  // Config

    ['Configurações'],

  const listas = [cartoes, cats, GRUPOS, ['Receita', 'Despesa'], FORMAS];
  const nLinhasCfg = Math.max(...listas.map(l => l.length), NCART);
  for (let i = 0; i < nLinhasCfg; i++) cfg.push(listas.map(l => (l[i] ?? null)));
  abas.push({ nome: 'Config', linhas: cfg });

  // Recorrentes. "Fatura" = Próxima desloca a cobrança do cartão para a fatura do mês seguinte (colunas J e K).
  const rec = [['Descrição', 'Grupo', 'Cartão (se Cartão)', 'Categoria', 'Valor mensal', 'Início', 'Fim (vazio = sem fim)', 'Fim considerado',
    'Fatura (vazio = atual)', 'Início na fatura', 'Fim na fatura']];

    const formulaK = F(`EDATE(H${r},IF(I${r}="Próxima",1,0))`, serialDate(addMesData(fim, desl)), FMT_DATA);
    if (it) rec.push([it.descricao, it.grupo, it.cartao || null, it.categoria, N(it.valor, FMT_VALOR),

    ['Orçamento mensal por categoria (edite os valores)'],
    ['Os nomes das categorias vêm da aba Config.'],
    ['Categoria', ...mesesOrc.map(m => N(serialMes(m), FMT_MES))],
  ];
  cats.forEach((cat, i) => om.push([F(`Config!B${8 + i}`, cat), ...mesesOrc.map(m => N(Number((orcEfetivo(m) || {})[cat]) || 0, FMT_VALOR))]));
  om.push(['Total', ...mesesOrc.map((m, i) => F(`SUM(${colMes(i)}4:${colMes(i)}${ultimaCat})`, totalOrc(m), FMT_VALOR))]);
  abas.push({ nome: 'Orcamento_Meses', linhas: om });

  // Orçamento x gasto lançado do mês de referência (fórmulas)
  const resumo = [
    ['Orçamento x gasto lançado · mês de referência (tudo calculado)'],
    ['Mês de referência', F('Config!B5', serialMes(c.mesRef), FMT_MES)],
    ['Categoria', 'Orçamento mensal', 'Gasto lançado no mês', 'Diferença', '% usado'],
  ];
  let totB = 0, totC = 0;
  cats.forEach((cat, i) => {
    const r = 4 + i;
    const bud = Number((orcEfetivo(c.mesRef) || {})[cat]) || 0;
    const exe = execCat(cat, c.mesRef);
    totB += bud; totC += exe;
    resumo.push([
      F(`Config!B${8 + i}`, cat),
      F(`IFERROR(INDEX(Orcamento_Meses!$B${r}:$${ultCol}${r},MATCH(Config!$B$5,Orcamento_Meses!$B$3:$${ultCol}$3,0)),0)`, bud, FMT_VALOR),
      F(`SUMIFS(Lancamentos!$D$2:$D$2000,Lancamentos!$C$2:$C$2000,A${r},Lancamentos!$A$2:$A$2000,">="&Config!$B$5,Lancamentos!$A$2:$A$2000,"<"&EDATE(Config!$B$5,1))+SUMIFS(Compras_Parceladas!$G$2:$G$300,Compras_Parceladas!$I$2:$I$300,A${r},Compras_Parceladas!$F$2:$F$300,"<="&Config!$B$5,Compras_Parceladas!$H$2:$H$300,">="&Config!$B$5)-SUMIFS(Estornos!$K$2:$K$500,Estornos!$C$2:$C$500,A${r},Estornos!$I$2:$I$500,"<="&Config!$B$5,Estornos!$J$2:$J$500,">="&Config!$B$5)`, exe, FMT_VALOR),
      F(`B${r}-C${r}`, bud - exe, FMT_VALOR),
      F(`IF(B${r}=0,"",C${r}/B${r})`, bud === 0 ? '' : exe / bud, '0%'),
    ]);
  });
  resumo.push(['Total',
    F(`SUM(B4:B${ultimaCat})`, totB, FMT_VALOR), F(`SUM(C4:C${ultimaCat})`, totC, FMT_VALOR),
    F(`B${ultimaCat + 1}-C${ultimaCat + 1}`, totB - totC, FMT_VALOR)]);
  abas.push({ nome: 'Orcamento', linhas: resumo });

  // Faturas por cartão (36 meses)
  const fat = [['Fatura por cartão (parcelamentos + assinaturas + gastos lançados no cartão − estornos e ajustes)'], [],
    ['Mês', ...Array.from({ length: NCART }, (_, j) => F(`IF(Config!A${8 + j}="","",Config!A${8 + j})`, cartoes[j] || '')), 'Total faturas']];
  meses.forEach((m, i) => {
    const r = 4 + i;
    const row = [i === 0 ? F('Config!$B$3', serialMes(m), FMT_MES) : F(`EDATE(A${r - 1},1)`, serialMes(m), FMT_MES)];
    let total = 0;
    for (let j = 0; j < NCART; j++) {
      const col = colL(j + 1), card = cartoes[j];
      const val = card ? fatCartao(card, m) : 0;
      total += val;
      row.push(F(`IF(${col}$3="",0,SUMIFS(Compras_Parceladas!$G$2:$G$300,Compras_Parceladas!$B$2:$B$300,${col}$3,Compras_Parceladas!$F$2:$F$300,"<="&EOMONTH($A${r},0),Compras_Parceladas!$H$2:$H$300,">="&$A${r})+SUMIFS(Recorrentes!$E$2:$E$300,Recorrentes!$B$2:$B$300,"Cartão",Recorrentes!$C$2:$C$300,${col}$3,Recorrentes!$J$2:$J$300,"<="&EOMONTH($A${r},0),Recorrentes!$K$2:$K$300,">="&$A${r})-SUMIFS(Estornos!$K$2:$K$500,Estornos!$B$2:$B$500,${col}$3,Estornos!$I$2:$I$500,"<="&$A${r},Estornos!$J$2:$J$500,">="&$A${r})-SUMIFS(Ajustes_Fatura!$C$2:$C$500,Ajustes_Fatura!$B$2:$B$500,${col}$3,Ajustes_Fatura!$A$2:$A$500,$A${r})+SUMIFS(Lancamentos!$D$2:$D$2000,Lancamentos!$H$2:$H$2000,${col}$3,Lancamentos!$G$2:$G$2000,$A${r}))`, val, FMT_VALOR));
    }
    row.push(F(`SUM(B${r}:${colL(NCART)}${r})`, total, FMT_VALOR));
    fat.push(row);
  });
  abas.push({ nome: 'Faturas', linhas: fat });

  // Projeção de 36 meses (fórmulas)
  const proj = projecao(NMESES);
  const pr = [
    ['Projeção mês a mês (36 meses) · tudo calculado'],
    ['Marque 1 na coluna J no mês em que o orçamento paga também o mês seguinte (o mês seguinte fica zerado).'],
    ['Mês', 'Receitas fixas', 'Receitas eventuais', 'Total receitas', 'Despesas fixas', 'Faturas dos cartões', 'Despesas eventuais',
      'Orçamento restante (orçado − já lançado, por categoria)', 'Base de despesas do mês', 'Férias: marque 1', 'Ajuste de férias', 'Despesas totais do mês',
      'Saldo do mês', 'Saldo acumulado', 'Gasto lançado (Lancamentos + parcelas)', 'Previsto - lançado', 'Gastos à vista (fora do cartão)',
      'Férias confirmadas: ajuste da receita', 'Férias confirmadas: gastos extras'],
  ];
  // Avulsos lançados por categoria no mês (vetor alinhado às categorias de Orcamento_Meses), sem os do Simulador.
  const lancCatF = r => `SUMIFS(Lancamentos!$D$2:$D$2000,Lancamentos!$C$2:$C$2000,Orcamento_Meses!$A$4:$A$${ultimaCat},Lancamentos!$A$2:$A$2000,">="&$A${r},Lancamentos!$A$2:$A$2000,"<"&EDATE($A${r},1),Lancamentos!$E$2:$E$2000,"<>Planejada")`;
  const orcMesF = r => `INDEX(Orcamento_Meses!$B$4:$${ultCol}$${ultimaCat},0,MATCH($A${r},Orcamento_Meses!$B$3:$${ultCol}$3,0))`;
  const sumRecF = g => `SUMIFS(Recorrentes!$E$2:$E$300,Recorrentes!$B$2:$B$300,"${g}",Recorrentes!$F$2:$F$300,"<="&EOMONTH($A{r},0),Recorrentes!$H$2:$H$300,">="&$A{r})`;
  const sumEvF = t => `SUMIFS(Eventuais!$D$2:$D$300,Eventuais!$C$2:$C$300,"${t}",Eventuais!$A$2:$A$300,">="&$A{r},Eventuais!$A$2:$A$300,"<"&EDATE($A{r},1))`;
  proj.forEach((x, i) => {
    const r = 4 + i;
    let adj;
    if (i === 0) adj = `IF(J${r}=1,I${r + 1},0)`;
    else if (i < NMESES - 1) adj = `IF(J${r}=1,I${r + 1},0)-IF(J${r - 1}=1,I${r},0)`;
    else adj = `-IF(J${r - 1}=1,I${r},0)`;
    pr.push([
      i === 0 ? F('Config!$B$3', serialMes(x.m), FMT_MES) : F(`EDATE(A${r - 1},1)`, serialMes(x.m), FMT_MES),
      F(sumRecF('Receita').replace(/\{r\}/g, r), x.rf, FMT_VALOR),
      F(sumEvF('Receita').replace(/\{r\}/g, r), x.re, FMT_VALOR),
      F(`B${r}+C${r}+R${r}`, x.rt, FMT_VALOR),
      F(sumRecF('Fixo').replace(/\{r\}/g, r), x.ef, FMT_VALOR),
      F(`Faturas!${colL(NCART + 1)}${r}`, x.fat, FMT_VALOR),
      F(sumEvF('Despesa').replace(/\{r\}/g, r), x.ed, FMT_VALOR),
      F(`SUMPRODUCT((${orcMesF(r)}-${lancCatF(r)}>0)*(${orcMesF(r)}-${lancCatF(r)}))`, x.ov, FMT_VALOR),
      F(`E${r}+F${r}+G${r}+H${r}+Q${r}+S${r}`, x.I, FMT_VALOR),
      N(x.ferias ? 1 : 0),
      F(adj, x.adj, FMT_VALOR),
      F(`I${r}+K${r}`, x.L, FMT_VALOR),
      F(`D${r}-L${r}`, x.saldo, FMT_VALOR),
      F(`Config!$B$4+SUM($M$4:M${r})`, x.acum, FMT_VALOR),
      F(`SUMIFS(Lancamentos!$D$2:$D$2000,Lancamentos!$A$2:$A$2000,">="&$A${r},Lancamentos!$A$2:$A$2000,"<"&EDATE($A${r},1))+SUMIFS(Compras_Parceladas!$G$2:$G$300,Compras_Parceladas!$F$2:$F$300,"<="&EOMONTH($A${r},0),Compras_Parceladas!$H$2:$H$300,">="&$A${r})-SUMIFS(Estornos!$K$2:$K$500,Estornos!$I$2:$I$500,"<="&$A${r},Estornos!$J$2:$J$500,">="&$A${r})`, x.exec, FMT_VALOR),
      F(`IF($A${r}<=TODAY(),L${r}-O${r},0)`, x.dif, FMT_VALOR),
      F(`SUMIFS(Lancamentos!$D$2:$D$2000,Lancamentos!$H$2:$H$2000,"-",Lancamentos!$A$2:$A$2000,">="&$A${r},Lancamentos!$A$2:$A$2000,"<"&EDATE($A${r},1),Lancamentos!$E$2:$E$2000,"<>Planejada")`, x.av, FMT_VALOR),
      N(x.ferR, FMT_VALOR),
      N(x.ferD, FMT_VALOR),
    ]);
  });
  abas.push({ nome: 'Projecao_36m', linhas: pr });

  // Patrimônio
  const p = S.patrimonio, pj = projPatr();
  abas.push({ nome: 'Patrimonio', linhas: [
    ['Patrimônio · valores editáveis e cálculos'],
    [],
    ['Valor inicial (R$)', N(p.valorInicial, FMT_VALOR)],
    ['Taxa anual (ex.: 8% = 0,08)', N(p.taxaAnual, FMT_PCT)],
    ['Prazo (anos)', N(p.prazoAnos)],
    ['Aporte mensal previsto (R$)', N(p.aporteMensal, FMT_VALOR)],
    ['Meta (R$)', N(p.meta, FMT_VALOR)],
    [],
    ['Total de aportes (R$)', F('SUM(Aportes!C2:C1000)', sum(p.aportes), FMT_VALOR)],
    ['Patrimônio atual (R$)', F('B3+B9', pj.P, FMT_VALOR)],
    ['Taxa mensal equivalente', F('(1+B4)^(1/12)-1', pj.i, '0.0000%')],
    ['Meses', F('B5*12', Math.round(p.prazoAnos * 12))],
    ['Valor projetado (R$)', F('IF(B11=0,B10+B6*B12,B10*(1+B11)^B12+B6*((1+B11)^B12-1)/B11)', pj.fv, FMT_VALOR)],
  ]});

  // Aportes do patrimônio
  const apo = [['Data', 'Descrição', 'Valor']];
  p.aportes.forEach(a => apo.push([N(serialDate(a.data), FMT_DATA), a.descricao || null, N(a.valor, FMT_VALOR)]));
  abas.push({ nome: 'Aportes', linhas: apo });

  return abas;
}

// Gera o .xlsx com fórmulas e formatos, usando o escritor embutido.
function exportarPlanilha() {
  XL.baixar(XL.gerar(montarPlanilha()), `planilha-controle-financeiro-${hoje()}.xlsx`);
}

// Lê uma planilha no formato gerado pelo app. g: { nomeDaAba: linhas }
function interpretarNova(g) {
  const cfg = g.Config;
  const primeiroMes = mkOf(isoData(at(cfg, 3, 1))) || S.config.primeiroMes;
  const mesRef = mkOf(isoData(at(cfg, 5, 1))) || S.config.mesRef;
  const saldoConta = Number(at(cfg, 4, 1)) || 0;
  const cartoes = [];
  for (let i = 0; i < NCART; i++) { const v = at(cfg, 8 + i, 0); if (v) cartoes.push(String(v).trim()); }
  const categorias = [];
  for (let i = 0; i < 30; i++) { const v = at(cfg, 8 + i, 1); if (!v) break; categorias.push(String(v).trim()); }

  const recorrentes = g.Recorrentes.slice(1).filter(r => r[0] && r[4]).map(r => ({
    id: uid(), descricao: String(r[0]), grupo: String(r[1] || 'Fixo'), cartao: r[2] ? String(r[2]) : '',
    categoria: r[3] ? String(r[3]) : 'Outros', valor: Number(r[4]) || 0,
    inicio: isoData(r[5]) || hoje(), fim: isoData(r[6]),
    ...(String(r[1] || '') === 'Cartão' && ehProxima(r[8]) ? { prox: true } : {})
  }));

  const parcelados = g.Compras_Parceladas.slice(1).filter(r => r[2] && r[3] && r[4]).map(r => {
    const dataCompra = isoData(r[0]) || hoje();
    return {
      id: uid(), dataCompra, cartao: String(r[1] || ''), descricao: String(r[2]),
      categoria: r[8] ? String(r[8]) : 'Outros', valorTotal: Number(r[3]) || 0,
      parcelas: Math.max(1, parseInt(r[4], 10)),
      inicio: mkOf(isoData(r[5])) || addM(mkOf(dataCompra), 1)
    };
  });

  // Estornos: vinculados à compra pela chave (cartão, descrição e mês da 1ª parcela).
  const estornos = (g.Estornos || []).slice(1).filter(r => r[0] && r[5]).map(r => {
    const p = parcelados.find(x => x.cartao === String(r[1] || '') && x.descricao === String(r[6] || '') &&
      mkOf(x.inicio) === mkOf(isoData(r[7])));
    return p ? { id: uid(), parcelaId: p.id, tipo: String(r[3] || 'Estorno'), mes: mkOf(isoData(r[0])),
      descricao: r[4] ? String(r[4]) : '', valor: Number(r[5]) || 0 } : null;
  }).filter(Boolean);

  const eventuais = g.Eventuais.slice(1).filter(r => r[0] && r[3]).map(r => ({
    id: uid(), mes: mkOf(isoData(r[0])), descricao: String(r[1] || ''), tipo: String(r[2] || 'Despesa'), valor: Number(r[3]) || 0
  }));

  // Movimentações da conta (aba opcional: planilhas antigas não têm).
  const movConta = (g.Conta || []).slice(1).filter(r => r[0] && r[1] && r[3]).map(r => ({
    id: uid(), data: isoData(r[0]) || hoje(), descricao: String(r[1]),
    tipo: /^entrada/i.test(String(r[2] || '').trim()) ? 'Entrada' : 'Saída', valor: Number(r[3]) || 0
  }));

  // Ajustes manuais na fatura (aba opcional: planilhas antigas não têm).
  const creditos = (g.Ajustes_Fatura || []).slice(1).filter(r => r[0] && r[1] && r[2]).map(r => ({
    id: uid(), cartao: String(r[1]), mes: mkOf(isoData(r[0])), valor: Number(r[2]) || 0, descricao: r[3] ? String(r[3]) : ''
  }));

  const lancamentos = g.Lancamentos.slice(1).filter(r => r[0] && r[3]).map(r => {
    const fc = formaECartao(r[4]);
    return {
      id: uid(), data: isoData(r[0]) || hoje(), descricao: String(r[1] || ''), categoria: String(r[2] || 'Outros'),
      valor: Number(r[3]) || 0, ...fc, ...(fc.forma === 'Cartão' && ehProxima(r[5]) ? { prox: true } : {})
    };
  });

  // Check list (aba opcional): religa cada item pelo nome, porque os ids são novos a cada importação.
  const checklist = {};
  (g.Checklist || []).slice(1).filter(r => r[0] && r[1] && r[2]).forEach(r => {
    const m = mkOf(isoData(r[0])), tipo = String(r[1]), nome = String(r[2]);
    const c = checklist[m] = checklist[m] || { itens: {} };
    if (tipo === 'fora') { c.fora = nome; return; }
    const achado = tipo === 'rec' ? recorrentes.find(x => x.descricao === nome)
      : tipo === 'ev' ? eventuais.find(x => x.mes === m && x.descricao === nome)
      : tipo === 'lanc' ? lancamentos.find(x => mkOf(x.data) === m && x.descricao === nome) : null;
    const key = tipo === 'fat' ? 'fat:' + nome : achado ? `${tipo}:${achado.id}` : null;
    if (!key) return;
    const mov = r[5] ? movConta.find(x => x.descricao === String(r[5])) : null;
    c.itens[key] = { pago: Number(r[3]) === 1, ...(r[4] != null && r[4] !== '' ? { valor: Number(r[4]) } : {}), ...(mov ? { contaId: mov.id } : {}) };
  });

  // Períodos de férias (aba opcional).
  const lerJSON = (t, padrao) => { try { return JSON.parse(String(t)); } catch (e) { return padrao; } };
  const feriasPlanos = (g.Ferias_Periodos || []).slice(1).filter(r => r[0] && r[1]).map(r => ({
    id: uid(), inicio: isoData(r[0]), fim: isoData(r[1]), valorFerias: r[2] != null && r[2] !== '' ? Number(r[2]) : null,
    tem13: Number(r[3]) === 1, valor13: r[4] != null && r[4] !== '' ? Number(r[4]) : null, confirmado: Number(r[5]) === 1,
    residuais: lerJSON(r[6], {}), extras: lerJSON(r[7], []).map(e => ({ id: uid(), nome: e.nome, valor: e.valor })),
    naoSubstitui: [...recorrentes, ...eventuais].filter(i => lerJSON(r[8], []).includes(i.descricao) && i.valor !== undefined).map(i => i.id)
  }));

  // Regras de categoria (aba opcional).
  const regrasCategoria = (g.Regras_Categoria || []).slice(1).filter(r => r[0] && r[1]).map(r => ({ id: uid(), texto: String(r[0]), categoria: String(r[1]) }));

  // Vencimentos (aba opcional).
  const vencimentosCfg = {};
  (g.Vencimentos || []).slice(1).filter(r => r[0] && r[1]).forEach(r => { vencimentosCfg[String(r[0])] = Number(r[1]); });

  // Plano de férias (aba opcional).
  const planoFerias = (g.Plano_Ferias || []).slice(1).filter(r => r[0] && r[1] && r[2]).map(r => {
    const de = mkOf(isoData(r[2]));
    return { id: uid(), descricao: String(r[0]), valor: Number(r[1]) || 0, de, ate: mkOf(isoData(r[3])) || de };
  });

  const om = g.Orcamento_Meses;
  const header = om[2] || [];
  const colMeses = [];
  for (let c = 1; c < header.length; c++) { const mk = mkOf(isoData(header[c])); if (mk) colMeses.push({ c, mk }); }
  const orcamentoMeses = {};
  colMeses.forEach(({ mk }) => { orcamentoMeses[mk] = {}; });
  for (let r = 4; r <= om.length; r++) {
    const nome = at(om, r, 0);
    if (!nome || String(nome).trim().toLowerCase() === 'total') continue;
    colMeses.forEach(({ c, mk }) => { orcamentoMeses[mk][String(nome).trim()] = Number(at(om, r, c)) || 0; });
  }

  const ferias = {};
  const proj = g.Projecao_36m || [];
  for (let r = 4; r < 4 + NMESES; r++) {
    if (Number(at(proj, r, 9)) === 1) ferias[mkOf(isoData(at(proj, r, 0))) || addM(primeiroMes, r - 4)] = true;
  }

  const patrimonio = g.Patrimonio ? {
    ...S.patrimonio,
    valorInicial: Number(at(g.Patrimonio, 3, 1)) || 0,
    taxaAnual: Number(at(g.Patrimonio, 4, 1)) || 0,
    prazoAnos: Number(at(g.Patrimonio, 5, 1)) || 0,
    aporteMensal: Number(at(g.Patrimonio, 6, 1)) || 0,
    meta: Number(at(g.Patrimonio, 7, 1)) || 0,
    aportes: (g.Aportes || []).slice(1).filter(r => r[0] && r[2]).map(r => ({
      id: uid(), data: isoData(r[0]) || hoje(), descricao: String(r[1] || ''), valor: Number(r[2]) || 0
    }))
  } : S.patrimonio;

  return {
    config: {
      ...S.config, saldoConta, primeiroMes, mesRef, vencimentos: vencimentosCfg,
      cartoes: cartoes.length ? cartoes : S.config.cartoes,
      categorias: categorias.length ? categorias : S.config.categorias
    },
    orcamento: {}, orcamentoMeses, recorrentes, parcelados, estornos, creditos, movConta, checklist, planoFerias, feriasPlanos, regrasCategoria, eventuais, lancamentos, ferias, patrimonio
  };
}

// Lê o arquivo escolhido e decide: planilha do app (com Orcamento_Meses) ou a planilha original.
function lerPlanilha(input, aoLer) {
  const f = input.files[0];
  input.value = '';
  if (!f) return;
  f.arrayBuffer().then(buf => XL.ler(buf)).then(aoLer, () => alert('Não consegui ler essa planilha. Use um arquivo .xlsx.'));
}

function importarPlanilha(input) {
  lerPlanilha(input, g => {
    if (!g.Orcamento_Meses || !g.Config) return importarPlanilhaLegada(g);
    try {
      const nova = interpretarNova(g);
      if (!confirm('Importar a planilha substitui todos os dados atuais pelo conteúdo dela. Continuar?')) return;
      S = { ...S, ...nova };
      commit();
      alert(`Planilha importada: ${S.recorrentes.length} recorrentes, ${S.parcelados.length} parcelamento(s), ${S.eventuais.length} evento(s), ${S.lancamentos.length} lançamento(s), ${(S.creditos || []).length} ajuste(s) de fatura, ${(S.movConta || []).length} movimentação(ões) da conta.`);
    } catch (err) {
      alert('A planilha tem um formato inesperado. Use a planilha exportada pelo app.');
    }
  });
}

function importarJSON(input) {
  const f = input.files[0];
  input.value = '';
  if (!f) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try {
      const d = JSON.parse(leitor.result);
      let novo;
      if (d.config && d.patrimonio) novo = Object.assign(blank(), d);
      else if (d.metas && Array.isArray(d.categorias)) novo = deBackup(d);
      else throw new Error('formato');
      if (!confirm('Substituir todos os dados atuais pelo backup?')) return;
      S = novo;
      commit();
      alert('Backup importado com sucesso.');
    } catch (err) {
      alert('Arquivo inválido. Use um backup JSON do Controle Financeiro.');
    }
  };
  leitor.readAsText(f);
}

function exportar() {
  S.ultimoBackup = hoje();
  salvar();
  const blobUrl = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = blobUrl;
