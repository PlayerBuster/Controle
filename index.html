<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Controle Financeiro</title>
<style>
:root{--g-rec:#00908f;--g-desp:#d9730d;--g-saldo:#6d4fc4;--bg:#f5f6fa;--card:#fff;--ink:#1d2330;--muted:#6b7385;--line:#e3e6ee;--accent:#2f6fed;--good:#1f9d62;--bad:#d64545;--header:#1d2330;--aviso:#fff4d6;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g-rec:#14a3a3;--g-desp:#d4751b;--g-saldo:#9575f0;--bg:#0f1420;--card:#171e2c;--ink:#e7ebf3;--muted:#9aa4b8;--line:#2a3345;--accent:#4d86f5;--good:#2fbf7c;--bad:#ef6464;--header:#0a0e17;--aviso:#3a2f10;color-scheme:dark}}
:root[data-theme="dark"]{--g-rec:#14a3a3;--g-desp:#d4751b;--g-saldo:#9575f0;--bg:#0f1420;--card:#171e2c;--ink:#e7ebf3;--muted:#9aa4b8;--line:#2a3345;--accent:#4d86f5;--good:#2fbf7c;--bad:#ef6464;--header:#0a0e17;--aviso:#3a2f10;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--header);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{font-size:18px;margin:0}
.abas{display:grid;gap:8px;padding:8px 20px 10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
main{max-width:1100px;margin:0 auto;padding:20px 20px 84px;display:grid;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:13px;margin:0 0 12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.big{font-size:22px;font-weight:700;margin:4px 0}
.pos{color:var(--good)}
.neg{color:var(--bad)}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:#fff;border:1px solid #fff}
button.tab{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 12px}
button.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grupos,.sub-abas{display:flex;gap:6px;overflow-x:auto;min-width:0}
button.grupo{background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;border-radius:0;padding:4px 10px;font-weight:600}
button.grupo.on{color:var(--accent);border-bottom-color:var(--accent)}
button.danger{background:var(--bad)}
button.small{padding:3px 9px;font-size:13px}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;width:100%;background:var(--card);color:var(--ink)}
input[type=checkbox]{width:auto}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
form.fields,.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
form.fields button{height:38px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}
.bar>div{height:100%;background:var(--good)}
.bar>div.over{background:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:0 6px 6px 0}
p{margin:6px 0}
[hidden]{display:none!important}
.gauge{display:grid;justify-items:center;text-align:center;gap:4px;align-content:start}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
.aviso{background:var(--aviso);border:1px solid #e0a100;border-radius:10px;padding:10px 14px;margin:12px 20px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.aviso button{background:#e0a100}
/* Indicador do mês na aba Faturas: fica visível abaixo da barra de abas ao rolar a página */
.mes-fatura{position:sticky;top:var(--abas-h,52px);z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--accent);color:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.mes-fatura strong{font-size:17px}
.mes-fatura .rel{font-size:13px;opacity:.9}
.mes-fatura button{background:rgba(255,255,255,.18);font-size:18px;line-height:1;padding:6px 12px}
.mes-fatura button:disabled{opacity:.35;cursor:default}
.mes-fatura input[type=month]{width:auto;max-width:190px;padding:3px 6px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);border-color:transparent;color-scheme:dark}
.mes-fatura button.voltar{font-size:12px;padding:3px 8px;margin-left:4px}
button.ghost-tema{background:transparent;color:var(--ink);border:1px solid var(--line)}
/* Prévia da exportação de gastos: mesmo modelo do Excel */
.exp-grade{display:flex;gap:14px;align-items:flex-start}
table.exp-bloco{width:auto;min-width:210px;flex:none;border:1px solid var(--line)}
table.exp-bloco th{background:#a9d08e;color:#1d2330;text-align:center;border:1px solid var(--line);white-space:nowrap}
table.exp-bloco td{border:1px solid var(--line);white-space:nowrap;padding:3px 6px}
.exp-ano{font-weight:400;font-size:12px}
table.exp-bloco tr.exp-vazia td{height:12px;padding:0;border-left:0;border-right:0}
#impTabela{min-width:760px}#impTabela select{min-width:120px}#impRevisao h2{overflow-wrap:anywhere}
.fp-sub{font-size:14px;margin:14px 0 6px}
.fp-status{margin:0}
@media print{
  body.imprimindo{background:#fff}
  body.imprimindo>*:not(#impressao){display:none!important}
  body.imprimindo #impressao{display:block!important}
  #impressao h3{margin:6px 0;font-size:12px;color:#000}
  #impressao .exp-grade{flex-wrap:wrap;gap:8px}
  #impressao table.exp-bloco{min-width:0;break-inside:avoid;border:1px solid #000}
  #impressao table.exp-bloco td,#impressao table.exp-bloco th{color:#000;border:1px solid #000;font-size:9px;padding:1px 4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #impressao table.exp-bloco tr.exp-vazia td{height:8px;border-left:0;border-right:0}
}
/* Dica do gráfico da Projeção */
.dica{position:absolute;top:6px;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.5;pointer-events:none;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.25)}
.dica b{display:block;margin-bottom:2px}
.dica span{float:right;margin-left:14px}
/* Calculadora flutuante */
.calc-fab{position:fixed;right:16px;bottom:16px;z-index:5;width:52px;height:52px;border-radius:50%;font-size:24px;padding:0;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.calc{position:fixed;right:16px;bottom:80px;z-index:6;width:min(300px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.3);display:grid;gap:8px;max-height:calc(100vh - 96px);overflow:auto}
.calc-barra{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:move;user-select:none;touch-action:none}
.calc-barra button{padding:2px 10px;background:var(--line);color:var(--ink)}
/* No computador, a calculadora fica ao lado do botão (ganha altura) e, em janela baixa ou com zoom, as teclas encolhem. */
@media(min-width:700px){#calc.calc{bottom:16px;right:80px;max-height:calc(100vh - 32px)}}
@media(max-height:600px){#calc.calc{gap:5px;padding:8px}#calc.calc .teclas{gap:4px}#calc.calc .teclas button{padding:5px 0;font-size:15px}#calc.calc .visor{font-size:17px;padding:4px 8px}#calc.calc .res{min-height:14px;font-size:13px}}
.calc .visor{font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.calc .res{text-align:right;color:var(--muted);font-size:14px;min-height:18px}
.calc .teclas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .teclas button{padding:10px 0;font-size:17px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.calc .teclas button.op{background:var(--line)}
.calc .teclas button.igual{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:600px){th,td{font-size:13px}main{padding:12px}header{padding:12px 14px}header h1{width:100%}header .row{width:100%}header .row button{flex:1 1 auto;padding:8px 10px}form.fields,.filtros{grid-template-columns:1fr 1fr}.card{padding:14px}main{padding-bottom:84px}.aviso{margin:10px 12px 0}}
@media(max-width:380px){form.fields,.filtros{grid-template-columns:1fr}}
@media print{header,.abas,#aviso,.aviso,form,button,.row,.calc,.mes-fatura{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{break-inside:avoid;border:1px solid #999;box-shadow:none}}
</style>
</head>
<body>
<header>
  <h1>Controle Financeiro</h1>
  <div class="row">
    <button class="ghost" onclick="$('fx').click()">Importar planilha .xlsx</button>
    <button class="ghost" onclick="$('fj').click()">Importar backup .json</button>
    <button class="ghost" onclick="exportar()">Exportar .json</button>
    <button class="ghost" onclick="exportarPlanilha()">Exportar planilha .xlsx</button>
    <button class="ghost" onclick="exemplo()">Carregar exemplo</button>
    <button class="ghost" onclick="zerar()">Zerar tudo</button>
  </div>
</header>
<div id="aviso"></div>
<nav class="abas" id="abas"></nav>
<main id="conteudo"></main>
<button class="calc-fab" id="calcBtn" onclick="calcAbrir()" aria-label="Calculadora" title="Calculadora">🧮</button>
<div class="calc" id="calc" hidden></div>
<div id="impressao" hidden></div>
<input type="file" id="fx" accept=".xlsx,.xls" hidden>
<input type="file" id="fj" accept=".json,application/json" hidden>

<script>
const KEY = 'controle-financeiro-v2';
const KEY1 = 'controle-financeiro-v1';
const CATS = ['Moradia','Alimentação','Transporte','Saúde','Lazer','Educação','Vestuário','Assinaturas','Outros'];
const GRUPOS = ['Receita','Fixo','Cartão'];
const FORMAS = ['Cartão','Pix','Débito','Dinheiro','Boleto','Outros'];
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = arr => arr.reduce((s, x) => s + (Number(x.valor) || 0), 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const mkOf = d => String(d || '').slice(0, 7);
const mIdx = m => { const [y, mo] = m.split('-').map(Number); return y * 12 + mo - 1; };
const addM = (m, n) => { const k = mIdx(m) + n; return `${Math.floor(k / 12)}-${pad(k % 12 + 1)}`; };
const mNome = m => { const [y, mo] = m.split('-'); return `${MESES[Number(mo) - 1]}/${y}`; };
// Mês da fatura e, entre parênteses, o mês seguinte: "Out/2026 (Nov./2026)". Usado na aba Faturas.
const mFatura = m => {
  const nome = x => { const t = MESES[Number(x.slice(5, 7)) - 1]; return t[0].toUpperCase() + t.slice(1); };
  const prox = addM(m, 1);
  return `${nome(m)}/${m.slice(0, 4)} (${nome(prox)}./${prox.slice(0, 4)})`;
};
const fmtData = s => (s ? s.split('-').reverse().join('/') : '—');
const pct = v => (v * 100).toFixed(2).replace('.', ',') + '%';

function isoData(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number') return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[2]}-${m[1]}`;
  m = s.match(/^\d{4}-\d{2}-\d{2}/);
  return m ? m[0] : '';
}

/* ---------- modelo de dados ---------- */
function blank() {
  return {
    config: { saldoConta: 0, primeiroMes: '2026-11', mesRef: mkOf(hoje()), cartoes: ['Nubank', 'Itaú'], categorias: [...CATS] },
    orcamento: {},
    orcamentoMeses: {},
    recorrentes: [],
    parcelados: [],
    estornos: [],
    creditos: [],
    movConta: [],
    checklist: {},
    planoFerias: [],
    feriasPlanos: [],
    regrasCategoria: [],
    eventuais: [],
    lancamentos: [],
    ferias: {},
    patrimonio: { valorInicial: 200, dataInicio: '2026-10-21', meta: 0, prazoAnos: 10, taxaAnual: 0.08, aporteMensal: 0, aportes: [] }
  };
}

function deBackup(d) {
  const b = blank();
  const m = d.metas || {};
  b.patrimonio = {
    valorInicial: Number(m.valorInicial) || 0,
    dataInicio: m.dataInicio || hoje(),
    meta: Number(m.meta) || 0,
    prazoAnos: Number(m.prazoAnos) || 0,
    taxaAnual: Number(m.taxaAnual) || 0,
    aporteMensal: Number(m.aporteMensal) || 0,
    aportes: (d.aportes || []).map(a => ({ id: uid(), data: a.data || hoje(), valor: Number(a.valor) || 0, descricao: a.descricao || '' }))
  };
  b.lancamentos = (d.gastos || []).map(g => ({
    id: uid(), data: g.data || hoje(), descricao: g.descricao || '', categoria: g.categoria || 'Outros', valor: Number(g.valor) || 0, forma: ''
  }));
  const cats = [...b.config.categorias];
  (d.categorias || []).forEach(c => { if (c.nome && !cats.includes(c.nome)) cats.push(c.nome); });
  b.config.categorias = cats;
  return b;
}

function carregar() {
  try {
    const v2 = localStorage.getItem(KEY);
    if (v2) return Object.assign(blank(), JSON.parse(v2));
    const v1 = localStorage.getItem(KEY1);
    if (v1) return deBackup(JSON.parse(v1));
  } catch (e) {}
  return blank();
}

let S = carregar();
let aba = 'resumo';
let filtroMes = '';

let falhaSalvar = false; // true quando o navegador recusa gravar (armazenamento cheio ou bloqueado)
function salvar() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); falhaSalvar = false; } catch (e) { falhaSalvar = true; }
}
function commit() { S.modificadoEm = agoraISO(); salvar(); render(); agendarEnvio(); gravarAgendaAvisos(); }

/* ---------- cálculos (replicam as fórmulas da planilha) ---------- */
const ativo = (it, m) =>
  mIdx(mkOf(it.inicio)) <= mIdx(m) && mIdx(it.fim ? mkOf(it.fim) : '2099-12') >= mIdx(m);

const valorParcela = p => (p.valorParcela != null ? p.valorParcela : Math.round(p.valorTotal / p.parcelas * 100) / 100);
const ultimaParcela = p => addM(p.inicio, p.parcelas - 1);
const parcelaAtiva = (p, m) => mIdx(p.inicio) <= mIdx(m) && mIdx(ultimaParcela(p)) >= mIdx(m);

const sumRec = (grupo, m) => S.recorrentes.filter(r => r.grupo === grupo && ativo(r, m)).reduce((a, r) => a + r.valor, 0);
const sumEv = (tipo, m) => S.eventuais.filter(e => e.tipo === tipo && e.mes === m).reduce((a, e) => a + e.valor, 0);
// Estornos e abatimentos: créditos lançados num mês de fatura, ligados a uma compra parcelada.
// Estorno: crédito único no mês da fatura. Abatimento: dividido igualmente pelas parcelas
// restantes a partir do mês escolhido (ou do início da compra, se o mês for anterior).
function intervaloAjuste(e) {
  const p = parcDe(e);
  if (e.tipo !== 'Abatimento') return { ini: e.mes, fim: e.mes, meses: 1 };
  const ini = mIdx(e.mes) > mIdx(p.inicio) ? e.mes : p.inicio;
  const fim = ultimaParcela(p);
  if (mIdx(ini) > mIdx(fim)) return { ini: e.mes, fim: e.mes, meses: 1 };
  return { ini, fim, meses: mIdx(fim) - mIdx(ini) + 1 };
}
const valorAjusteMes = (e, m) => {
  const i = intervaloAjuste(e);
  return mIdx(m) >= mIdx(i.ini) && mIdx(m) <= mIdx(i.fim) ? e.valor / i.meses : 0;
};
const ajustesMes = m => (S.estornos || []).filter(e => parcDe(e) && valorAjusteMes(e, m) !== 0);
const somaAjustes = (m, filtro = () => true) => ajustesMes(m).filter(filtro).reduce((a, e) => a + valorAjusteMes(e, m), 0);
const parcDe = e => S.parcelados.find(p => p.id === e.parcelaId);
// Compra no cartão marcada como "Próxima fatura" (prox) entra na fatura do mês seguinte ao da compra.
const mesFatLanc = l => (l.prox ? addM(mkOf(l.data), 1) : mkOf(l.data));
const recNaFatura = (r, m) => ativo(r, r.prox ? addM(m, -1) : m);
// Ajustes manuais na fatura (pagamento antecipado, reembolso, bônus): reduzem a fatura do cartão
// naquele mês, sem alterar parcelas nem o gasto por categoria.
const creditosMes = (c, m) => (S.creditos || []).filter(x => x.cartao === c && x.mes === m);

/* Regra dos lançamentos: o app é pensado para quem usa o cartão de crédito como forma principal.
   - No cartão: valor a pagar. Entra na fatura (mês da compra ou o seguinte, com "Próxima fatura")
     e só sai do saldo quando a fatura é paga.
   - Débito, Pix e Dinheiro: executado. Sai da conta na data (aba Conta).
   - Boleto e Outros: pagos no mês da data, mas não mexem na aba Conta.
   - Planejada (criada pelo Simulador): já está nas despesas eventuais; não entra de novo. */
const FORMAS_CONTA = ['Débito', 'Pix', 'Dinheiro'];
const noCartao = l => l.forma === 'Cartão' && !!l.cartao;
const avulsoConta = l => l.forma !== 'Planejada'; // avulso que conta como gasto no mês (exclui os do Simulador)
const aVista = l => !noCartao(l) && avulsoConta(l);
const fatCartao = (c, m) =>
  S.parcelados.filter(p => p.cartao === c && parcelaAtiva(p, m)).reduce((a, p) => a + valorParcela(p), 0) +
  S.recorrentes.filter(r => r.grupo === 'Cartão' && r.cartao === c && recNaFatura(r, m)).reduce((a, r) => a + r.valor, 0) +
  S.lancamentos.filter(l => noCartao(l) && l.cartao === c && mesFatLanc(l) === m).reduce((a, l) => a + l.valor, 0) -
  somaAjustes(m, e => parcDe(e).cartao === c) -
  creditosMes(c, m).reduce((a, x) => a + x.valor, 0);
const faturaTotal = m => S.config.cartoes.reduce((a, c) => a + fatCartao(c, m), 0);
// Gastos à vista do mês (pela data): Débito, Pix, Dinheiro, Boleto e Outros.
const aVistaMes = m => S.lancamentos.filter(l => aVista(l) && mkOf(l.data) === m).reduce((a, l) => a + l.valor, 0);
// Pago (executado): só o que saiu da conta (Débito, Pix, Dinheiro).
const pagoMes = m => S.lancamentos.filter(l => FORMAS_CONTA.includes(l.forma) && mkOf(l.data) === m).reduce((a, l) => a + l.valor, 0);
// Gasto lançado no mês (cartão + à vista + parcelas − estornos): quanto do orçamento já foi usado.
const execMes = m =>
  S.lancamentos.filter(l => mkOf(l.data) === m).reduce((a, l) => a + l.valor, 0) +
  S.parcelados.filter(p => parcelaAtiva(p, m)).reduce((a, p) => a + valorParcela(p), 0) -
  somaAjustes(m);
const execCat = (c, m) =>
  S.lancamentos.filter(l => l.categoria === c && mkOf(l.data) === m).reduce((a, l) => a + l.valor, 0) +
  S.parcelados.filter(p => (p.categoria || 'Outros') === c && parcelaAtiva(p, m)).reduce((a, p) => a + valorParcela(p), 0) -
  somaAjustes(m, e => (parcDe(e).categoria || 'Outros') === c);
// Orçamento de um mês: o próprio, se existir; senão, o padrão (S.orcamento).
const orcEfetivo = m => S.orcamentoMeses[m] || S.orcamento;
const totalOrc = (m = S.config.mesRef) => {
  const o = orcEfetivo(m);
  return S.config.categorias.reduce((a, c) => a + (Number(o[c]) || 0), 0);
};
// Orçamento que ainda falta gastar: por categoria, o orçado menos os gastos avulsos já lançados no mês
// (nunca negativo). Os avulsos já entram na fatura ou nos gastos à vista; assim nada é contado duas vezes.
const avulsosCat = (c, m) => S.lancamentos.filter(l => avulsoConta(l) && l.categoria === c && mkOf(l.data) === m).reduce((a, l) => a + l.valor, 0);
const orcRestante = m => {
  const o = orcEfetivo(m);
  return S.config.categorias.reduce((a, c) => a + Math.max(0, (Number(o[c]) || 0) - avulsosCat(c, m)), 0);
};

/* Período de férias (S.feriasPlanos): datas e valores digitados pelo usuário. Só altera a Projeção se estiver
   confirmado; caso contrário, é simulação. Confirmado, nos meses afetados as receitas normais saem (menos as
   marcadas em naoSubstitui) e entram os salários residuais. Férias, 13º e gastos extras entram no 1º mês afetado.
   { id, inicio, fim, valorFerias, residuais: { mês: valor }, tem13, valor13, extras: [{ id, nome, valor }],
     naoSubstitui: [ids], confirmado } */
const feriasConfirmadas = () => (S.feriasPlanos || []).filter(p => p.confirmado);
function competenciasFerias(p) {
  const a = mkOf(p.inicio);
  return Array.from({ length: mIdx(mkOf(p.fim)) - mIdx(a) + 1 }, (_, i) => addM(a, i));
}
const diasNoMes = m => new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0).getDate();
function diasTrabalhados(p, m) {
  const ini = m + '-01', fim = `${m}-${pad(diasNoMes(m))}`;
  const a = p.inicio > ini ? p.inicio : ini, b = p.fim < fim ? p.fim : fim;
  return diasNoMes(m) - (a <= b ? diasEntre(a, b) + 1 : 0);
}
const receitasNormais = m => [
  ...S.recorrentes.filter(r => r.grupo === 'Receita' && ativo(r, m)),
  ...S.eventuais.filter(e => e.tipo === 'Receita' && e.mes === m)];
function ajusteFerias(m) {
  const aj = { receita: 0, despesa: 0 };
  feriasConfirmadas().forEach(p => {
    const comps = competenciasFerias(p);
    if (!comps.includes(m)) return;
    aj.receita += Number((p.residuais || {})[m]) || 0;
    receitasNormais(m).forEach(x => { if (!(p.naoSubstitui || []).includes(x.id)) aj.receita -= x.valor; });
    if (m === comps[0]) {
      aj.receita += (Number(p.valorFerias) || 0) + (p.tem13 ? Number(p.valor13) || 0 : 0);
      aj.despesa += (p.extras || []).reduce((a, x) => a + (Number(x.valor) || 0), 0);
    }
  });
  return aj;
}

function mesBase(m) {
  const rf = sumRec('Receita', m), re = sumEv('Receita', m), ef = sumRec('Fixo', m);
  const fat = faturaTotal(m), av = aVistaMes(m), ed = sumEv('Despesa', m), ov = orcRestante(m);
  const aj = ajusteFerias(m);
  return { rf, re, ferR: aj.receita, ferD: aj.despesa, rt: rf + re + aj.receita, ef, fat, av, ed, ov, I: ef + fat + av + ed + ov + aj.despesa };
}

// Aba Conta: extrato com saldo inicial, gastos em Débito/Pix/Dinheiro (saem sozinhos) e movimentações manuais.
function extratoConta() {
  const itens = [
    ...S.lancamentos.filter(l => FORMAS_CONTA.includes(l.forma)).map(l => ({
      id: l.id, origem: 'lanc', data: l.data, descricao: l.descricao, detalhe: l.forma, valor: -l.valor })),
    ...(S.movConta || []).map(x => ({
      id: x.id, origem: 'mov', data: x.data, descricao: x.descricao, detalhe: x.tipo, valor: x.tipo === 'Entrada' ? x.valor : -x.valor }))
  ].sort((a, b) => a.data.localeCompare(b.data) || (a.origem === 'mov' ? -1 : 1));
  let saldo = Number(S.config.saldoConta) || 0;
  itens.forEach(i => { saldo += i.valor; i.saldo = saldo; });
  return itens;
}
const saldoContaEm = data => (Number(S.config.saldoConta) || 0) +
  extratoConta().filter(i => i.data <= data).reduce((a, i) => a + i.valor, 0);

function projecao(n) {
  const base = S.config.primeiroMes;
  const rows = [];
  for (let i = 0; i <= n; i++) {
    const m = addM(base, i);
    rows.push({ m, ...mesBase(m), ferias: !!S.ferias[m] });
  }
  let acum = S.config.saldoConta;
  const out = [];
  for (let i = 0; i < n; i++) {
    const r = rows[i];
    const adj = (r.ferias ? rows[i + 1].I : 0) - (i > 0 && rows[i - 1].ferias ? r.I : 0);
    r.adj = adj;
    r.L = r.I + adj;
    r.saldo = r.rt - r.L;
    acum += r.saldo;
    r.acum = acum;
    r.exec = execMes(r.m);
    r.futuro = mIdx(r.m) > mIdx(mkOf(hoje()));
    r.dif = r.futuro ? 0 : r.L - r.exec; // meses futuros ainda não têm execução
    out.push(r);
  }
  return out;
}

function projPatr() {
  const p = S.patrimonio;
  const P = p.valorInicial + sum(p.aportes);
  const i = Math.pow(1 + p.taxaAnual, 1 / 12) - 1;
  const n = Math.round(p.prazoAnos * 12);
  const A = p.aporteMensal;
  const fv = i === 0 ? P + A * n : P * Math.pow(1 + i, n) + A * (Math.pow(1 + i, n) - 1) / i;
  let mes = null;
  if (p.meta > 0) {
    if (P >= p.meta) mes = 0;
    else {
      let b = P;
      for (let k = 1; k <= 1200; k++) { b = b * (1 + i) + A; if (b >= p.meta) { mes = k; break; } }
    }
  }
  return { P, fv, i, mes };
}

function lerAba() {

  return 'resumo';

function card(titulo, valor, sub, cls = '') {

}
const opts = (arr, sel) => arr.map(x => `<option ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('');

/* ---------- visões ---------- */
const V = {};

/* ---------- pontuação ---------- */
const clamp01 = x => Math.max(0, Math.min(1, x));
const pctTxt = v => (v * 100).toFixed(1).replace('.', ',') + '%';
const soma = (g, k) => g.reduce((a, r) => a + r[k], 0);
const abrevMoeda = v => (v < 0 ? '−' : '') + 'R$ ' +
  (Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(1).replace('.', ',') + 'k' : Math.round(Math.abs(v)));

/* Saúde financeira, conservadora. Regra de fundo: em nenhum mês se pode gastar mais do que se recebe.
   - Série de 12 meses a partir do mês atual (mesmo que seja anterior ao 1º mês da projeção); o saldo
     acumulado parte do saldo inicial da conta e carrega o déficit do mês atual.
   - Cada critério é calculado em 3, 6 e 12 meses; o curto prazo pesa mais (50%, 30%, 20%).
   - Se os 3 meses forem piores que os 6, a nota perde a diferença (e isso é mostrado).
   - Poupança vale 0 no horizonte com algum mês em déficit; Reserva usa o pior saldo acumulado
     (negativo = 0); "Meses no azul" só conta mês com receita ≥ despesa e saldo acumulado ≥ 0.
   - Limites: déficit, saldo negativo ou falta no plano de férias nos próximos 3 meses → no máximo 25; nos 12 meses → no máximo 39;
     sem orçamento variável → no máximo 79 (a projeção não teria os gastos do dia a dia). */
const HORIZONTES = [{ h: 3, peso: 0.5 }, { h: 6, peso: 0.3 }, { h: 12, peso: 0.2 }];
function serieSaude() {
  const p0 = S.config.primeiroMes, ini = mIdx(mkOf(hoje())) < mIdx(p0) ? mkOf(hoje()) : p0;
  const proj = projecao(36);
  let acum = Number(S.config.saldoConta) || 0;
  return Array.from({ length: 12 }, (_, i) => {
    const m = addM(ini, i), r = proj.find(x => x.m === m);
    const b = r || mesBase(m), L = r ? r.L : b.I;
    acum += b.rt - L;
    return { m, rt: b.rt, L, ef: b.ef, fat: b.fat, saldo: b.rt - L, acum };
  });
}
function scoreSaude() {
  const serie = serieSaude();
  const deficit = r => r.saldo < -0.005;
  const compromMes = r => (r.rt > 0 ? (r.ef + r.fat) / r.rt : (r.ef + r.fat > 0 ? 9.99 : 0));
  // Valor de cada critério (0 a 1) num horizonte de h meses.
  const criterios = h => {
    const s = serie.slice(0, h);
    const rt = soma(s, 'rt'), taxa = rt > 0 ? soma(s, 'saldo') / rt : 0;
    const temDeficit = s.some(deficit);
    const azul = s.filter(r => !deficit(r) && r.acum >= 0).length / s.length;
    const piorComp = s.reduce((x, r) => (compromMes(r) > compromMes(x) ? r : x), s[0]);
    const piorAcum = s.reduce((x, r) => (r.acum < x.acum ? r : x), s[0]);
    const mediaDesp = soma(s, 'L') / s.length;
    const reserva = mediaDesp > 0 ? piorAcum.acum / mediaDesp : (piorAcum.acum >= 0 ? 6 : 0);
    return {
      Poupança: { v: temDeficit ? 0 : clamp01(taxa / 0.40), taxa, temDeficit },
      'Meses no azul': { v: azul },
      Comprometimento: { v: clamp01((0.9 - compromMes(piorComp)) / 0.4), comp: compromMes(piorComp), mes: piorComp.m },
      Reserva: { v: piorAcum.acum < 0 ? 0 : clamp01(reserva / 6), reserva, mes: piorAcum.m }
    };
  };
  const PESOS = { Poupança: 40, 'Meses no azul': 25, Comprometimento: 20, Reserva: 15 };
  const porH = HORIZONTES.map(({ h, peso }) => {
    const c = criterios(h);
    return { h, peso, c, score: Math.round(Object.keys(PESOS).reduce((a, k) => a + c[k].v * PESOS[k], 0)) };
  });
  const H = h => porH.find(x => x.h === h);
  const pct0 = v => Math.round(v * 100);
  const linhaH = k => porH.map(x => `${x.h}m ${pct0(x.c[k].v)}`).join(' · ');
  const c3 = H(3).c, c12 = H(12).c;
  const partes = Object.keys(PESOS).map(k => ({
    nome: k, peso: PESOS[k], valor: porH.reduce((a, x) => a + x.c[k].v * x.peso, 0),
    desc: (k === 'Poupança' ? (c3.Poupança.temDeficit ? 'Há mês com déficit nos próximos 3 meses: sem sobra de verdade, poupança zero'
          : `Sobra de ${pctTxt(c3.Poupança.taxa)} da receita nos próximos 3 meses (100 pontos a partir de 40%)`)
      : k === 'Meses no azul' ? `${pct0(H(12).c[k].v)}% dos próximos 12 meses com receita cobrindo a despesa e saldo acumulado positivo`
      : k === 'Comprometimento' ? `No mês mais apertado (${mNome(c12.Comprometimento.mes)}), fixos e faturas consomem ${pctTxt(c12.Comprometimento.comp)} da receita (ideal: até 50%)`
      : `Pior saldo dos próximos 12 meses (${mNome(c12.Reserva.mes)}) cobre ${Math.max(0, c12.Reserva.reserva).toFixed(1).replace('.', ',')} meses de despesa (meta: 6)`)
      + ` · por horizonte: ${linhaH(k)}`
  }));
  const ponderado = Math.round(porH.reduce((a, x) => a + x.score * x.peso, 0));
  const alertas = [];
  // Curto prazo pior que o médio prazo: perde a diferença.
  const piora = Math.max(0, H(6).score - H(3).score);
  if (piora > 0) alertas.push(`Os próximos 3 meses (nota ${H(3).score}) estão piores que os próximos 6 (nota ${H(6).score}): a nota perde ${piora} pontos.`);
  const bruto = Math.max(0, ponderado - piora);
  let teto = 100;
  const def = serie.filter(deficit);
  if (def.length) {
    const d = def[0], curto = serie.slice(0, 3).some(deficit);
    teto = Math.min(teto, curto ? 25 : 39);
    alertas.push(`Em ${mNome(d.m)}, as despesas (${brl(d.L)}) passam das receitas (${brl(d.rt)}) em ${brl(-d.saldo)}${def.length > 1 ? `; ${def.length} dos próximos 12 meses gastam mais do que recebem` : ''}.`);
  }
  const neg = serie.find(r => r.acum < 0);
  if (neg) {
    teto = Math.min(teto, serie.slice(0, 3).some(r => r.acum < 0) ? 25 : 39);
    alertas.push(`O saldo acumulado fica negativo em ${mNome(neg.m)} (${brl(neg.acum)}).`);
  }
  // Plano de férias: período com falta dentro dos 12 meses pesa como déficit (sobra não dá bônus).
  const noPeriodo = (b, s) => s.some(r => mIdx(r.m) >= mIdx(b.de) && mIdx(r.m) <= mIdx(b.ate));
  blocosFerias().filter(b => b.resultado < -0.005 && noPeriodo(b, serie)).forEach(b => {
    teto = Math.min(teto, noPeriodo(b, serie.slice(0, 3)) ? 25 : 39);
    alertas.push(`Plano de férias: faltam ${brl(-b.resultado)} para quitar ${nomePeriodo(b.de, b.ate)}.`);
  });
  if (serie.every(r => totalOrc(r.m) <= 0)) {
    teto = Math.min(teto, 79);
    alertas.push('Nenhum orçamento variável definido: a projeção não inclui gastos do dia a dia (mercado, transporte, lazer). Defina na aba Orçamento.');
  }
  return { score: Math.min(bruto, teto), bruto, ponderado, piora, horizontes: porH.map(x => ({ h: x.h, peso: x.peso, score: x.score })), partes, alertas };
}

// Aderência ao orçado no mês: categorias com orçamento > 0.
// Dentro do orçado = 100; cada 1% acima do orçado tira 2 pontos.
function scoreOrcamento(m) {
  const orc = orcEfetivo(m);
  const cats = S.config.categorias.filter(c => (Number(orc[c]) || 0) > 0);
  const execTotal = execMes(m);
  if (!cats.length) return { score: null, itens: [], semOrc: execTotal };
  const itens = cats.map(c => {
    const b = Number(orc[c]);
    const e = execCat(c, m);
    const s = e <= b ? 1 : clamp01(1 - 2 * (e / b - 1));
    return { c, b, e, s };
  });
  const score = Math.round(itens.reduce((a, i) => a + i.s, 0) / itens.length * 100);
  const semOrc = execTotal - soma(itens.map(i => ({ e: i.e })), 'e');
  return { score, itens, semOrc };
}

function gauge(score, titulo, sub) {
  const r = 52, c = 2 * Math.PI * r;
  const ok = score != null;
  const cor = !ok ? '#e3e6ee' : score >= 80 ? '#1f9d62' : score >= 60 ? '#2f6fed' : score >= 40 ? '#e0a100' : '#d64545';
  const faixa = !ok ? 'Sem dados' : score >= 80 ? 'Ótima' : score >= 60 ? 'Boa' : score >= 40 ? 'Atenção' : 'Crítica';
  const off = ok ? c * (1 - score / 100) : c;
  return `<div class="card gauge">
    <h2>${titulo}</h2>
    <svg viewBox="0 0 140 140" width="150" height="150">
      <circle cx="70" cy="70" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="12"/>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="${cor}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 70 70)"/>
      <text x="70" y="80" text-anchor="middle" font-size="30" font-weight="700" style="fill:var(--ink)">${ok ? score : '—'}</text>
    </svg>
    <div><b style="color:${ok ? cor : 'var(--muted)'}">${faixa}</b></div>
    <div class="muted">${sub}</div>
  </div>`;
}

function blocoScores(m = S.config.mesRef) {
  const sa = scoreSaude();
  const so = scoreOrcamento(m);
  const detalhe = sa.partes.map(p => `<div style="margin:10px 0">
      <div class="row" style="justify-content:space-between"><span>${p.nome} <span class="muted">(peso ${p.peso}%)</span></span><b>${Math.round(p.valor * 100)}/100</b></div>
      <div class="bar" style="height:10px"><div style="width:${(p.valor * 100).toFixed(1)}%"></div></div>
      <div class="muted">${p.desc}</div>
    </div>`).join('');
  const limitada = sa.score < sa.ponderado;
  const alertas = sa.alertas.length ? `<div class="aviso" style="margin:0 0 10px;display:block">
      ${sa.alertas.map(a => `<p style="margin:4px 0">⚠️ ${esc(a)}</p>`).join('')}
      ${limitada ? `<p class="muted" style="margin:6px 0 0">Pelos critérios abaixo a nota seria ${sa.ponderado}; com os alertas acima, fica em ${sa.score}.</p>` : ''}
    </div>` : '';
  const corH = s => (s >= 80 ? 'var(--good)' : s >= 60 ? 'var(--accent)' : s >= 40 ? '#e0a100' : 'var(--bad)');
  const horiz = `<div class="row" style="gap:10px;margin:0 0 12px">${sa.horizontes.map(x =>
      `<div class="chip" style="margin:0"><span class="muted">Próximos ${x.h} meses (peso ${Math.round(x.peso * 100)}%)</span> <b style="color:${corH(x.score)}">${x.score}</b></div>`).join('')}</div>`;
  return `<section class="grid">
    ${gauge(sa.score, 'Saúde financeira · 3, 6 e 12 meses', limitada ? 'Limitada pelos alertas abaixo' : 'Curto prazo pesa mais: 3 meses 50%, 6 meses 30%, 12 meses 20%')}
    ${gauge(so.score, `Aderência ao orçado · ${mNome(m)}`, so.score == null ? 'Defina o orçamento do mês para pontuar' : `Gasto sem orçamento: ${brl(so.semOrc)}`)}
    <section class="card" style="grid-column:1/-1"><h2>Como a saúde financeira é calculada</h2>${alertas}${horiz}${detalhe}
      <p class="muted" style="margin-top:8px">Regra de fundo: em nenhum mês se pode gastar mais do que se recebe. Cada critério é calculado nos próximos 3, 6 e 12 meses (a partir do mês atual) e o curto prazo pesa mais. Se os 3 meses forem piores que os 6, a nota perde a diferença. Mês com déficit zera a poupança daquele horizonte, e saldo acumulado negativo zera a reserva.</p></section>
  </section>`;
}

/* ---------- visão simplificada da projeção ---------- */
let periodoProj = 1;
let detalheAberto = false; // mantém a análise detalhada aberta entre redesenhos
const PERIODOS = { 1: 'Mensal', 3: 'Trimestral', 6: 'Semestral' };
function setPeriodo(n) { periodoProj = n; render(); }

// Quantos meses a Projeção mostra e qual gráfico: escolhas do usuário, lembradas neste navegador.
const HORIZ_PROJ = [6, 12, 24, 36];
const GRAFICOS = { colunas: 'Colunas e saldo', linhas: 'Linhas', area: 'Área do saldo', sobra: 'Sobra por período' };
const lerPref = (k, ok, padrao) => { try { const v = localStorage.getItem(k); return v !== null && ok(v) ? v : padrao; } catch (e) { return padrao; } };
let horizProj = Number(lerPref('cf-proj-horiz', v => HORIZ_PROJ.includes(Number(v)), 12));
let tipoGrafico = lerPref('cf-proj-grafico', v => !!GRAFICOS[v], 'colunas');
function setHorizProj(n) { horizProj = n; try { localStorage.setItem('cf-proj-horiz', String(n)); } catch (e) {} render(); }
function setGrafico(t) { tipoGrafico = t; try { localStorage.setItem('cf-proj-grafico', t); } catch (e) {} render(); }

function agruparPeriodos(rows, n) {
  const grupos = [];
  for (let i = 0; i < rows.length; i += n) {
    const g = rows.slice(i, i + n);
    const ini = g[0].m, fim = g[g.length - 1].m;
    grupos.push({
      curto: mNome(ini),
      rotulo: n === 1 ? mNome(ini) : `${mNome(ini)} – ${mNome(fim)}`,
      rt: soma(g, 'rt'), L: soma(g, 'L'), saldo: soma(g, 'saldo'),
      acum: g[g.length - 1].acum, exec: soma(g, 'exec'), dif: soma(g, 'dif'),
      futuro: g.every(r => r.futuro)
    });
  }
  return grupos;
}

// Gráfico da Projeção, em um dos tipos de GRAFICOS. Todas as séries são em reais, no mesmo eixo.
let projDados = [];
function graficoProj(grupos, tipo = 'colunas') {
  projDados = grupos;
  const estreito = window.innerWidth < 600;
  const W = estreito ? 360 : 760, H = estreito ? 240 : 300, P = { l: estreito ? 54 : 72, r: 12, t: 14, b: 34 };
  const campos = { colunas: ['rt', 'L', 'acum'], linhas: ['rt', 'L', 'acum'], area: ['acum'], sobra: ['saldo'] }[tipo];
  const valores = [0, ...grupos.flatMap(g => campos.map(c => g[c]))];
  // Eixo em valores redondos, sempre passando pelo zero, que separa sobra de déficit.
  const minV = Math.min(...valores), maxV = Math.max(...valores);
  const bruto = (maxV - minV) / 4 || 1, base = 10 ** Math.floor(Math.log10(bruto)), f = bruto / base;
  const passoY = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * base;
  const yMin = Math.floor(minV / passoY) * passoY, yMax = Math.max(Math.ceil(maxV / passoY) * passoY, yMin + passoY);
  const y = v => P.t + (1 - (v - yMin) / (yMax - yMin)) * (H - P.t - P.b);
  const y0 = y(0);
  const gw = (W - P.l - P.r) / grupos.length;
  const cxDe = i => P.l + i * gw + gw / 2;
  const passo = Math.ceil(grupos.length / (estreito ? 6 : 12));
  // Coluna ancorada no zero, com a ponta arredondada.
  const coluna = (x, w, v, cor) => {
    const yv = y(v), alt = Math.abs(yv - y0);
    if (alt < 1) return `<rect x="${x.toFixed(1)}" y="${(y0 - 0.5).toFixed(1)}" width="${w.toFixed(1)}" height="1" style="fill:${cor}"/>`;
    const r = Math.min(4, w / 2, alt), s = v >= 0 ? 1 : -1, ponta = yv + s * r;
    return `<path d="M${x.toFixed(1)} ${y0.toFixed(1)}V${ponta.toFixed(1)}Q${x.toFixed(1)} ${yv.toFixed(1)} ${(x + r).toFixed(1)} ${yv.toFixed(1)}H${(x + w - r).toFixed(1)}Q${(x + w).toFixed(1)} ${yv.toFixed(1)} ${(x + w).toFixed(1)} ${ponta.toFixed(1)}V${y0.toFixed(1)}Z" style="fill:${cor}"/>`;
  };
  const pontos = c => grupos.map((g, i) => `${cxDe(i).toFixed(1)},${y(g[c]).toFixed(1)}`);
  const linha = (c, cor, tracejada) => {
    let s = `<polyline fill="none" stroke-width="2" stroke-linejoin="round" ${tracejada ? 'stroke-dasharray="6 4"' : ''} style="stroke:${cor}" points="${pontos(c).join(' ')}"/>`;
    if (grupos.length <= 12) grupos.forEach((g, i) => { s += `<circle cx="${cxDe(i).toFixed(1)}" cy="${y(g[c]).toFixed(1)}" r="4" stroke-width="2" style="fill:${cor};stroke:var(--card)"/>`; });
    return s;
  };
  const rotulos = { colunas: 'Receitas, despesas e saldo acumulado', linhas: 'Receitas, despesas e saldo acumulado', area: 'Saldo acumulado', sobra: 'Sobra por período' };
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${rotulos[tipo]} por período" onpointerleave="projDicaFim()">`;
  for (let k = 0, n = Math.round((yMax - yMin) / passoY); k <= n; k++) {
    const v = yMin + passoY * k, yy = y(v).toFixed(1);
    svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/>`;
    svg += `<text class="proj-eixo" x="${P.l - 6}" y="${yy}" dy="4" text-anchor="end" font-size="11" style="fill:var(--muted)">${abrevMoeda(v)}</text>`;
  }
  if (yMin < 0) svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke-width="1.5" style="stroke:var(--muted)"/>`;
  if (tipo === 'colunas') {
    const bw = Math.max(2, Math.min(20, gw * 0.3));
    grupos.forEach((g, i) => { svg += coluna(cxDe(i) - bw - 1, bw, g.rt, 'var(--g-rec)') + coluna(cxDe(i) + 1, bw, g.L, 'var(--g-desp)'); });
    svg += linha('acum', 'var(--g-saldo)');
  } else if (tipo === 'linhas') {
    svg += linha('rt', 'var(--g-rec)') + linha('L', 'var(--g-desp)', true) + linha('acum', 'var(--g-saldo)');
  } else if (tipo === 'area') {
    svg += `<polygon points="${cxDe(0).toFixed(1)},${y0.toFixed(1)} ${pontos('acum').join(' ')} ${cxDe(grupos.length - 1).toFixed(1)},${y0.toFixed(1)}" opacity="0.2" style="fill:var(--g-saldo)"/>`;
    svg += linha('acum', 'var(--g-saldo)');
  } else {
    const bw = Math.max(3, Math.min(28, gw * 0.6));
    grupos.forEach((g, i) => { svg += coluna(cxDe(i) - bw / 2, bw, g.saldo, 'var(--g-saldo)'); });
  }
  grupos.forEach((g, i) => {
    if (i % passo === 0) svg += `<text x="${cxDe(i).toFixed(1)}" y="${H - P.b + 18}" text-anchor="middle" font-size="10" style="fill:var(--muted)">${esc(g.curto)}</text>`;
  });
  svg += `<line id="projMira" y1="${P.t}" y2="${H - P.b}" visibility="hidden" style="stroke:var(--muted)"/>`;
  // Áreas de toque de cada período: maiores que as marcas, para a dica funcionar no dedo e no mouse.
  grupos.forEach((g, i) => {
    svg += `<rect class="proj-alvo" x="${(P.l + i * gw).toFixed(1)}" y="${P.t}" width="${gw.toFixed(1)}" height="${H - P.t - P.b}" fill="transparent" onpointermove="projDica(event,${i},${cxDe(i).toFixed(1)})" onpointerdown="projDica(event,${i},${cxDe(i).toFixed(1)})"/>`;
  });
  return `<div id="projGraf" style="position:relative">${svg}</svg><div class="dica" id="projDica" hidden></div></div>`;
}
function projDica(ev, i, cx) {
  const g = projDados[i], caixa = $('projGraf'), d = $('projDica'), mira = $('projMira');
  if (!g || !d) return;
  d.innerHTML = `<b>${esc(g.rotulo)}</b>Receitas <span>${brl(g.rt)}</span><br>Despesas <span>${brl(g.L)}</span><br>Sobra <span>${brl(g.saldo)}</span><br>Saldo acumulado <span>${brl(g.acum)}</span>`;
  d.hidden = false;
  const r = caixa.getBoundingClientRect(), x = ev.clientX - r.left;
  d.style.left = `${Math.max(0, x + d.offsetWidth + 16 > r.width ? x - d.offsetWidth - 12 : x + 12)}px`;
  mira.setAttribute('x1', cx); mira.setAttribute('x2', cx); mira.setAttribute('visibility', 'visible');
}
function projDicaFim() {
  const d = $('projDica'), mira = $('projMira');
  if (d) d.hidden = true;
  if (mira) mira.setAttribute('visibility', 'hidden');
}

/* ---------- simulador de gasto (nada é salvo) ---------- */
const simEntrada = { valor: 300, categoria: '', mes: '', parcelas: 1 };

// Gastos simulados viram lançamentos (orçamento da categoria) e despesas eventuais (saldo do mês).
// Forma "Planejada": o lançamento mostra o uso do orçamento da categoria, mas na projeção a compra entra
// uma vez só, como despesa eventual extra, sem abater o orçamento restante (estimativa conservadora).
function geraSimulacao({ valor, categoria, mes, parcelas }) {
  const n = Math.max(1, Math.round(parcelas));
  const parcela = Math.round(valor / n * 100) / 100;
  const lancs = [], evs = [];
  for (let i = 0; i < n; i++) {
    const m = addM(mes, i);
    lancs.push({ id: 'sim' + i, data: m + '-01', descricao: 'Simulação', categoria, valor: parcela, forma: 'Planejada' });
    evs.push({ id: 'sim' + i, mes: m, descricao: 'Simulação', tipo: 'Despesa', valor: parcela });
  }
  return { lancs, evs, parcela, n };
}

// Aplica a simulação só durante fn(), depois restaura os dados reais.
function comGasto(gasto, fn) {
  const L0 = S.lancamentos, E0 = S.eventuais;
  const { lancs, evs } = geraSimulacao(gasto);
  S.lancamentos = L0.concat(lancs);
  S.eventuais = E0.concat(evs);
  try { return fn(); } finally { S.lancamentos = L0; S.eventuais = E0; }
}

// Foto do mês e da categoria com os dados atuais. Olha cada mês em que a compra cai (n parcelas) e os
// 12 meses a partir da compra, em vez de médias ou do fim dos 36 meses, que diluem o aperto.
// O que acontece antes da compra não depende dela: fica em "antes", só como aviso.
const HORIZ_SIM = 12;
function foto(mes, cat, n = 1) {
  const orc = Number(orcEfetivo(mes)[cat]) || 0;
  const exec = execCat(cat, mes);
  const proj = projecao(36);
  const desdeCompra = proj.filter(r => mIdx(r.m) >= mIdx(mes));
  const janela = desdeCompra.length ? desdeCompra.slice(0, HORIZ_SIM) : proj.slice(-1);
  // Saldo de um mês: da projeção; se o mês for anterior a ela (ex.: o mês atual), receita − despesa do mês.
  const saldoDe = m => { const r = proj.find(x => x.m === m); if (r) return r.saldo; const b = mesBase(m); return b.rt - b.I; };
  const negativo = desdeCompra.find(r => r.acum < 0);
  const neg12 = janela.find(r => r.acum < 0);
  const minR = janela.reduce((a, r) => (r.acum < a.acum ? r : a), janela[0]);
  return {
    orc, exec,
    saldoMes: saldoDe(mes),
    mesesCompra: Array.from({ length: Math.max(1, n) }, (_, i) => { const m = addM(mes, i); return { m, saldo: saldoDe(m) }; }),
    janela: janela.map(r => ({ m: r.m, saldo: r.saldo, acum: r.acum })),
    antes: proj.filter(r => mIdx(r.m) < mIdx(mes) && (r.saldo < -0.005 || r.acum < 0)).map(r => r.m),
    minAcum: minR.acum, minAcumMes: minR.m,
    despMedia12: soma(janela, 'L') / janela.length,
    vermelho12: janela.filter(r => r.saldo < -0.005).length,
    neg12: neg12 ? neg12.m : null,
    primeiroNeg: negativo ? negativo.m : null,
    scoreOrc: scoreOrcamento(mes).score,
    scoreSau: scoreSaude().score
  };
}

function simRodar(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  simEntrada.valor = Number(f.get('valor')) || 0;
  simEntrada.categoria = f.get('categoria');
  simEntrada.mes = f.get('mes');
  simEntrada.parcelas = Math.min(36, Math.max(1, Math.round(Number(f.get('parcelas')) || 1)));
  render();
}

const txtScore = v => (v == null ? '—' : v + '/100');
const txtNeg = v => (v == null ? 'nenhum' : mNome(v));

// Veredito conservador, com comentários. Avalia a partir do mês da compra, não médias nem meses anteriores:
// "Não recomendado": estoura o orçamento; algum mês em que a compra cai fica no vermelho (mesmo que já
//   estivesse); o saldo acumulado fica (ou já está) negativo nos 12 meses a partir da compra; ou fica negativo depois.
// "Com cuidado": sobra menos de 20% do orçamento; o menor saldo desses 12 meses fica abaixo de um mês
//   de despesas; ou alguma pontuação cai 10+ pontos.
// "Possível": demais casos. Meses no vermelho antes da compra não dependem dela: viram aviso, sem mudar o nível.
function veredito(a, d, g) {
  const motivos = [];
  let nivel = 'ok';
  const nao = t => { nivel = 'nao'; motivos.push(t); };
  const cuidado = t => { if (nivel === 'ok') nivel = 'cuidado'; motivos.push(t); };
  const restD = d.orc - d.exec;
  if (d.orc > 0 && restD < 0) nao(`Estoura o orçamento de ${g.categoria} em ${brl(-restD)}.`);
  else if (d.orc > 0 && restD < d.orc * 0.2) cuidado(`Deixa só ${brl(restD)} do orçamento de ${g.categoria} para o resto do mês (menos de 20%).`);
  // Cada mês em que a compra (ou uma parcela) cai.
  const vermelhos = (d.mesesCompra || [{ m: g.mes, saldo: d.saldoMes }]).filter(x => x.saldo < -0.005);
  if (vermelhos.length) {
    const x = vermelhos[0], antesX = (a.mesesCompra || []).find(y => y.m === x.m);
    nao(antesX && antesX.saldo < -0.005
      ? `${mNome(x.m)} já fica no vermelho (${brl(antesX.saldo)}) e a compra aumenta o rombo para ${brl(x.saldo)}${vermelhos.length > 1 ? `; ${vermelhos.length} meses da compra ficam no vermelho` : ''}.`
      : `Deixa ${mNome(x.m)} no vermelho: saldo do mês de ${brl(x.saldo)}${vermelhos.length > 1 ? `; ${vermelhos.length} meses da compra ficam no vermelho` : ''}.`);
  }
  // Saldo acumulado nos 12 meses a partir da compra.
  if (d.neg12) {
    nao(a.neg12
      ? `O saldo acumulado já está negativo em ${mNome(a.neg12)}, mesmo sem a compra; com ela, o pior momento vai a ${brl(d.minAcum)} (${mNome(d.minAcumMes)}).`
      : `Faz o saldo acumulado ficar negativo em ${mNome(d.neg12)} (pior momento: ${brl(d.minAcum)}).`);
  } else if (d.primeiroNeg && (!a.primeiroNeg || mIdx(d.primeiroNeg) < mIdx(a.primeiroNeg))) {
    nao(`Faz o saldo acumulado ficar negativo a partir de ${mNome(d.primeiroNeg)}.`);
  } else if (d.despMedia12 > 0 && d.minAcum < d.despMedia12) {
    cuidado(`O menor saldo dos 12 meses a partir da compra fica em ${brl(d.minAcum)} (${mNome(d.minAcumMes)}), menos de um mês de despesas (${brl(d.despMedia12)}).`);
  }
  if (a.scoreSau != null && d.scoreSau != null && a.scoreSau - d.scoreSau >= 10) cuidado(`Reduz a saúde financeira de ${a.scoreSau} para ${d.scoreSau} pontos.`);
  if (a.scoreOrc != null && d.scoreOrc != null && a.scoreOrc - d.scoreOrc >= 10) cuidado(`Reduz a aderência ao orçamento de ${a.scoreOrc} para ${d.scoreOrc} pontos.`);
  if (nivel === 'ok') motivos.unshift('Cabe no orçamento da categoria, nenhum mês da compra fica no vermelho e o saldo dos 12 meses a partir dela continua com folga.');
  const avisos = (a.antes || []).length
    ? [`Antes da compra, ${a.antes.length > 1 ? `${a.antes.length} meses ficam` : `${mNome(a.antes[0])} fica`} no vermelho${a.antes.length > 1 ? ` (o primeiro é ${mNome(a.antes[0])})` : ''}. Isso não depende desta compra, mas resolva primeiro.`]
    : [];
  return { nivel, motivos, avisos };
}

// Primeiro mês em que a mesma compra deixa de ser "Não recomendado" (null se nenhum dos meses servir).
function primeiroMesViavel(g, meses) {
  return meses.find(m => {
    const x = { ...g, mes: m };
    const a = foto(m, g.categoria, g.parcelas);
    return veredito(a, comGasto(x, () => foto(m, g.categoria, g.parcelas)), x).nivel !== 'nao';
  }) || null;
}

// Infográfico em barras: orçamento, saldo do mês e pontuações, antes e depois da compra.
function infografico(a, d, g) {
  const LARG = 300, X0 = 200, ALT = 22, GAP = 10, W = 640;
  let y = 0, out = '';
  const titulo = t => { y += 6; out += `<text x="0" y="${y + 14}" font-size="13" font-weight="700" fill="currentColor">${esc(t)}</text>`; y += 26; };
  const barra = (rot, val, maxV, cor, txt) => {
    const w = maxV > 0 ? Math.min(1, Math.abs(val) / maxV) * LARG : 0;
    out += `<text x="0" y="${y + 16}" font-size="12" fill="#6b7385">${esc(rot)}</text>
      <rect x="${X0}" y="${y}" width="${LARG}" height="${ALT}" rx="5" fill="#e3e6ee"/>
      <rect x="${X0}" y="${y}" width="${w.toFixed(1)}" height="${ALT}" rx="5" fill="${cor}"/>
      <text x="${X0 + LARG + 8}" y="${y + 16}" font-size="12" fill="currentColor">${esc(txt)}</text>`;
    y += ALT + GAP;
  };
  if (a.orc > 0) {
    const m = Math.max(a.orc, a.exec, d.exec, 1);
    titulo(`Orçamento de ${g.categoria}`);
    barra('Orçamento', a.orc, m, '#6b7385', brl(a.orc));
    barra('Gasto antes', a.exec, m, '#2f6fed', brl(a.exec));
    barra('Gasto depois', d.exec, m, d.exec > d.orc ? '#d64545' : '#1f9d62', brl(d.exec));
  }
  const ms = Math.max(Math.abs(a.saldoMes), Math.abs(d.saldoMes), 1);
  titulo('Saldo do mês');
  barra('Antes', a.saldoMes, ms, a.saldoMes < 0 ? '#d64545' : '#2f6fed', brl(a.saldoMes));
  barra('Depois', d.saldoMes, ms, d.saldoMes < 0 ? '#d64545' : '#1f9d62', brl(d.saldoMes));
  if (a.scoreSau != null && d.scoreSau != null) {
    titulo('Saúde financeira (0 a 100)');
    barra('Antes', a.scoreSau, 100, '#2f6fed', a.scoreSau + '/100');
    barra('Depois', d.scoreSau, 100, d.scoreSau < a.scoreSau ? '#d64545' : '#1f9d62', d.scoreSau + '/100');
  }
  return `<svg viewBox="0 0 ${W} ${y + 4}" width="100%" role="img" aria-label="Efeitos da compra" style="max-width:${W}px;font-family:system-ui,sans-serif;color:var(--ink)">${out}</svg>`;
}

function simuladorBase() {
  const cats = S.config.categorias;
  // Começa no mês atual, se ele for anterior ao 1º mês da projeção: compras de agora também podem ser simuladas.
  const ini = mIdx(mkOf(hoje())) < mIdx(S.config.primeiroMes) ? mkOf(hoje()) : S.config.primeiroMes;
  const meses = Array.from({ length: 36 + mIdx(S.config.primeiroMes) - mIdx(ini) }, (_, i) => addM(ini, i));
  if (!cats.includes(simEntrada.categoria)) simEntrada.categoria = cats[0];
  if (!meses.includes(simEntrada.mes)) simEntrada.mes = meses[0];
  const g = { ...simEntrada };
  const formulario = `
    <section class="card"><h2>Simulador de gasto</h2>
      <p class="muted">Veja como uma compra planejada mexe no orçamento da categoria, no saldo dos próximos meses e nas pontuações. Simular não salva nada; para registrar, use "Lançar esta compra", logo abaixo.</p>
      <form class="fields" onsubmit="simRodar(event)">
        <label>Valor total (R$) <input name="valor" type="number" step="0.01" min="0" value="${g.valor}" required></label>
        <label>Categoria <select name="categoria">${opts(cats, g.categoria)}</select></label>
        <label>Mês da compra <select name="mes">${meses.map(m => `<option value="${m}" ${m === g.mes ? 'selected' : ''}>${mNome(m)}</option>`).join('')}</select></label>
        <label>Parcelas <input name="parcelas" type="number" min="1" max="36" value="${g.parcelas}"></label>
        <div class="row"><button>Simular</button></div>
      </form>
      ${g.valor > 0 ? formSimLancar(g) : ''}
    </section>`;
  if (!(g.valor > 0)) return formulario + '<section class="card"><p class="muted">Informe um valor maior que zero.</p></section>';

  const antes = foto(g.mes, g.categoria, g.parcelas);
  const depois = comGasto(g, () => foto(g.mes, g.categoria, g.parcelas));
  const { parcela, n } = geraSimulacao(g);
  const restAntes = antes.orc - antes.exec, restDepois = depois.orc - depois.exec;
  const estoura = antes.orc > 0 && restDepois < 0;
  const corRest = v => (v < 0 ? 'color:var(--bad)' : '');
  const linhaComparacao = (nome, a, d, fmt = brl) =>
    `<tr><th>${nome}</th><td class="num">${fmt(a)}</td><td class="num">${fmt(d)}</td></tr>`;

  const orcamentoBloco = antes.orc > 0
    ? `<table><thead><tr><th>Categoria: ${esc(g.categoria)} · ${mNome(g.mes)}</th><th class="num">Antes</th><th class="num">Depois</th></tr></thead><tbody>
         ${linhaComparacao('Orçamento do mês', antes.orc, depois.orc)}
         ${linhaComparacao('Já gasto na categoria', antes.exec, depois.exec)}
         <tr><th>Restante</th><td class="num" style="${corRest(restAntes)}">${brl(restAntes)}</td><td class="num" style="${corRest(restDepois)}">${brl(restDepois)}</td></tr>
       </tbody></table>
       ${estoura ? `<p style="color:var(--bad)"><strong>Esta compra estoura o orçamento de ${esc(g.categoria)} em ${brl(-restDepois)}.</strong></p>` : '<p class="muted">Cabe no orçamento da categoria.</p>'}`
    : `<p class="muted">A categoria ${esc(g.categoria)} não tem orçamento em ${mNome(g.mes)}. Defina o orçamento para ver o efeito.</p>`;

  const v = veredito(antes, depois, g);
  const cores = { ok: '#1f9d62', cuidado: '#d68a1a', nao: '#d64545' };
  const rotulos = { ok: 'Compra possível', cuidado: 'Compra possível com cuidado', nao: 'Não recomendado' };
  const blocoVeredito = `
    <section class="card"><h2>Veredito</h2>
      <div style="font-size:22px;font-weight:700;color:${cores[v.nivel]}">${rotulos[v.nivel]}</div>
      <ul style="margin:10px 0 0;padding-left:20px">${v.motivos.map(m => `<li style="margin:4px 0">${esc(m)}</li>`).join('')}</ul>
      ${v.nivel === 'nao' ? (() => {
        const melhor = primeiroMesViavel(g, meses);
        return melhor
          ? `<p id="simMelhorMes" style="margin-top:10px"><strong>Primeiro mês em que esta compra deixa de ser "Não recomendado": ${mNome(melhor)}.</strong></p>`
          : `<p id="simMelhorMes" style="margin-top:10px"><strong>Com este valor e estas parcelas, nenhum mês do período deixa de ser "Não recomendado".</strong></p>`;
      })() : ''}
      ${v.avisos.map(t => `<p class="muted" style="margin-top:10px">⚠️ ${esc(t)}</p>`).join('')}
    </section>`;
  // Efeito da compra mês a mês, a partir dela: o futuro aparece mesmo que os meses seguintes estejam no vermelho.
  const noFuturo = `
    <section class="card"><h2>Como fica mês a mês, a partir da compra</h2>
      <div class="scroll"><table id="simFuturo">
        <thead><tr><th>Mês</th><th class="num">Saldo do mês (antes)</th><th class="num">Saldo do mês (depois)</th><th class="num">Acumulado (antes)</th><th class="num">Acumulado (depois)</th></tr></thead>
        <tbody>${depois.janela.map((r, i) => { const x = antes.janela[i]; const c = v => (v < -0.005 ? 'neg' : '');
          return `<tr><td>${mNome(r.m)}${depois.mesesCompra.some(p => p.m === r.m) ? ' <span class="muted">(compra)</span>' : ''}</td>
            <td class="num ${c(x.saldo)}">${brl(x.saldo)}</td><td class="num ${c(r.saldo)}">${brl(r.saldo)}</td>
            <td class="num ${c(x.acum)}">${brl(x.acum)}</td><td class="num ${c(r.acum)}">${brl(r.acum)}</td></tr>`; }).join('')}</tbody>
      </table></div>
    </section>`;
  return formulario + blocoVeredito + noFuturo + `
    <section class="card"><h2>Infográfico</h2>${infografico(antes, depois, g)}</section>
    <section class="card"><h2>Resultado</h2>

      ${orcamentoBloco}
    </section>
    <section class="card"><h2>Saldo e pontuações</h2>
      <div class="scroll"><table>
        <thead><tr><th>Indicador</th><th class="num">Antes</th><th class="num">Depois</th></tr></thead>
        <tbody>
          ${linhaComparacao('Saldo do mês (se for gasto extra, fora do orçamento)', antes.saldoMes, depois.saldoMes)}
          <tr><th>Menor saldo acumulado nos 12 meses a partir da compra</th><td class="num ${antes.minAcum < 0 ? 'neg' : ''}">${brl(antes.minAcum)} <span class="muted">(${mNome(antes.minAcumMes)})</span></td><td class="num ${depois.minAcum < 0 ? 'neg' : ''}">${brl(depois.minAcum)} <span class="muted">(${mNome(depois.minAcumMes)})</span></td></tr>
          <tr><th>Meses no vermelho nos 12 meses a partir da compra</th><td class="num">${antes.vermelho12}</td><td class="num">${depois.vermelho12}</td></tr>
          <tr><th>Primeiro mês com saldo acumulado negativo, a partir da compra</th><td class="num">${txtNeg(antes.primeiroNeg)}</td><td class="num">${txtNeg(depois.primeiroNeg)}</td></tr>
          <tr><th>Pontuação de orçamento do mês</th><td class="num">${txtScore(antes.scoreOrc)}</td><td class="num">${txtScore(depois.scoreOrc)}</td></tr>
          <tr><th>Pontuação de saúde financeira</th><td class="num">${txtScore(antes.scoreSau)}</td><td class="num">${txtScore(depois.scoreSau)}</td></tr>
        </tbody>
      </table></div>
      <p class="muted">O saldo do mês só muda se a compra for um gasto extra, fora do orçamento da categoria. Se ela já estiver no orçamento, o efeito aparece no restante da categoria.</p>
    </section>`;
};

// Maior valor que ainda dá "Compra possível" (busca por bisseção, em centavos).
function maxPossivel(mes, cat, parcelas) {
  const a = foto(mes, cat, parcelas);
  const ok = v => v <= 0 || comGasto({ valor: v, categoria: cat, mes, parcelas }, () => veredito(a, foto(mes, cat, parcelas), { categoria: cat, mes })).nivel === 'ok';
  if (!ok(0.01)) return 0;
  let lo = 0, hi = 1e6;
  if (ok(hi)) return hi;
  for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (ok(mid)) lo = mid; else hi = mid; }
  return Math.floor(lo * 100 + 1e-6) / 100;
}

// O mesmo valor total, em opções diferentes de parcelamento.
function cenarios(valor, cat, mes, opcoes) {
  return opcoes.map(n => {
    const g = { valor, categoria: cat, mes, parcelas: n };
    const a = foto(mes, cat, n);
    const d = comGasto(g, () => foto(mes, cat, n));
    return { n, parcela: geraSimulacao(g).parcela, nivel: veredito(a, d, g).nivel, restante: d.orc - d.exec };
  });
}

// Meta: quanto guardar por mês para juntar o valor até a data. Conservadora: a meta só é viável se a
// sobra de TODOS os meses do período cobrir o valor mensal (o mês mais apertado decide, não a média).
function metaCompra(valor, alvo) {
  const meses = Math.max(1, mIdx(alvo) - mIdx(mkOf(hoje())));
  const porMes = valor / meses;
  const linhas = projecao(36).filter(r => mIdx(r.m) >= mIdx(S.config.primeiroMes) && mIdx(r.m) <= mIdx(alvo));
  const saldoMedio = linhas.length ? linhas.reduce((t, r) => t + r.saldo, 0) / linhas.length : 0;
  const pior = linhas.length ? linhas.reduce((a, r) => (r.saldo < a.saldo ? r : a), linhas[0]) : null;
  const saldoMin = pior ? pior.saldo : 0;
  return { meses, porMes, saldoMedio, saldoMin, mesMin: pior ? pior.m : null, viavel: saldoMin >= porMes,
    mesesNecessarios: saldoMin > 0 ? Math.ceil(valor / saldoMin) : null };
}

// Lançar a compra simulada, logo abaixo do botão Simular, com os mesmos campos da aba Lançamentos.
// Valor, categoria e parcelas vêm da simulação; as opções fixas da aba Lançamentos são usadas como padrão.
function formSimLancar(g) {
  const fx = lancFixo || {};
  const n = Math.max(1, Math.round(g.parcelas));
  const forma = n > 1 ? 'Cartão' : (fx.forma || 'Cartão');
  const comCartao = forma === 'Cartão';
  // Data padrão: hoje, se a simulação for no mês atual; senão, o 1º dia do mês simulado.
  const data = g.mes === mkOf(hoje()) ? hoje() : g.mes + '-01';
  return `<form class="fields" id="formSimLanc" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)" onsubmit="simLancar(event)">
      <label>Data<input type="date" name="data" value="${data}" required></label>
      <label>Descrição<input type="text" name="descricao" required placeholder="Ex.: Notebook"></label>
      <label>Forma<select name="forma" onchange="simTogCampos(this.form)">${opts(n > 1 ? ['Cartão'] : FORMAS, forma)}</select></label>
      <label id="lbl-sim-cartao" ${comCartao ? '' : 'hidden'}>Cartão<select name="cartao"><option value=""></option>${opts(S.config.cartoes, fx.cartao)}</select></label>
      <label id="lbl-sim-fatura" ${comCartao ? '' : 'hidden'}>Fatura<select name="fatura">${optsFatura(fx.fatura === 'prox')}</select></label>
      <div class="row"><button>Lançar esta compra</button></div>
    </form>
    <p class="muted" style="margin-top:8px">Lança ${brl(g.valor)} em ${esc(g.categoria)}${n > 1 ? `, em ${n}x de ${brl(geraSimulacao(g).parcela)} no cartão (a 1ª parcela segue a data e a fatura escolhidas)` : ''}, do mesmo jeito que a aba Lançamentos.</p>`;
}
function simTogCampos(form) {
  const cartao = form.elements.forma.value === 'Cartão';
  form.querySelector('#lbl-sim-cartao').hidden = !cartao;
  form.querySelector('#lbl-sim-fatura').hidden = !cartao;
}
function simLancar(e) {
  e.preventDefault();
  const f = e.target.elements, g = { ...simEntrada };
  if (!(g.valor > 0)) return alert('Informe um valor maior que zero na simulação.');
  const descricao = f.descricao.value.trim();
  if (!descricao) return alert('Informe a descrição.');
  const cartao = f.forma.value === 'Cartão';
  if (cartao && !f.cartao.value) return alert('Escolha o cartão.');
  const prox = cartao && f.fatura.value === 'prox';
  const { parcela, n } = geraSimulacao(g);
  if (n > 1) {
    S.parcelados.push({ id: uid(), dataCompra: f.data.value, cartao: f.cartao.value, descricao, categoria: g.categoria,
      valorTotal: Math.round(parcela * n * 100) / 100, valorParcela: parcela, parcelas: n,
      inicio: addM(mkOf(f.data.value), prox ? 1 : 0) });
  } else {
    S.lancamentos.push({ id: uid(), data: f.data.value, descricao, categoria: g.categoria, forma: f.forma.value,
      cartao: cartao ? f.cartao.value : '', valor: g.valor, ...(prox ? { prox: true } : {}) });
  }
  commit();
  alert(`Compra lançada: ${descricao}, ${brl(g.valor)}${n > 1 ? ` em ${n}x` : ''}. Ela aparece em Lançamentos${cartao ? ' e na fatura do cartão' : ''}.`);
}

const metaEntrada = { valor: 1200, alvo: '' };
function metaRodar(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  metaEntrada.valor = Number(f.get('valor')) || 0;
  metaEntrada.alvo = f.get('alvo');
  render();
}

const VCORES = { ok: '#1f9d62', cuidado: '#d68a1a', nao: '#d64545' };
const VROT = { ok: 'Compra possível', cuidado: 'Compra possível com cuidado', nao: 'Não recomendado' };

function blocosSimulador() {
  const meses = Array.from({ length: 36 }, (_, i) => addM(S.config.primeiroMes, i));
  const g = { ...simEntrada };
  let out = '';
  if (g.valor > 0) {
    const maior = maxPossivel(g.mes, g.categoria, g.parcelas);
    out += `<section class="card"><h2>Quanto posso gastar?</h2>
      <p>Em <strong>${esc(g.categoria)}</strong>, ${mNome(g.mes)}, com ${g.parcelas} parcela(s), o maior valor que ainda dá <strong style="color:${VCORES.ok}">Compra possível</strong> é <strong>${brl(maior)}</strong>.</p>
      <p class="muted">Usa as mesmas regras do veredito: cabe no orçamento da categoria com pelo menos 20% de folga, nenhum mês da compra fica no vermelho e o saldo dos 12 meses a partir dela continua com pelo menos um mês de despesas.</p>
    </section>`;
    const cen = cenarios(g.valor, g.categoria, g.mes, [1, 3, 6, 10, 12]);
    out += `<section class="card"><h2>Comparar parcelamentos</h2>
      <p class="muted">${brl(g.valor)} em ${esc(g.categoria)}, ${mNome(g.mes)}, em cada opção:</p>
      <div class="scroll"><table><thead><tr><th>Parcelas</th><th class="num">Parcela</th><th>Veredito</th><th class="num">Restante da categoria</th></tr></thead><tbody>
        ${cen.map(c => `<tr><td>${c.n}x</td><td class="num">${brl(c.parcela)}</td><td style="color:${VCORES[c.nivel]}">${VROT[c.nivel]}</td><td class="num">${brl(c.restante)}</td></tr>`).join('')}
      </tbody></table></div>
    </section>`;
  }
  const meta = metaEntrada.alvo ? metaCompra(metaEntrada.valor, metaEntrada.alvo) : null;
  out += `<section class="card"><h2>Meta de compra</h2>
    <p class="muted">Quanto guardar por mês para juntar um valor até uma data, comparado com a sobra do mês mais apertado do período.</p>
    <form class="fields" onsubmit="metaRodar(event)">
      <label>Quanto quero juntar (R$) <input name="valor" type="number" min="1" step="0.01" value="${metaEntrada.valor}" required></label>
      <label>Até quando <select name="alvo">${meses.map(m => `<option value="${m}" ${m === (metaEntrada.alvo || meses[11]) ? 'selected' : ''}>${mNome(m)}</option>`).join('')}</select></label>
      <div class="row"><button>Calcular meta</button></div>
    </form>
    ${meta ? `<p style="margin-top:12px">Para juntar ${brl(metaEntrada.valor)} até ${mNome(metaEntrada.alvo)}, guarde <strong>${brl(meta.porMes)}</strong> por mês (${meta.meses} mês(es)).</p>
      <p>Sobra no mês mais apertado do período${meta.mesMin ? ` (${mNome(meta.mesMin)})` : ''}: <strong class="${meta.saldoMin < 0 ? 'neg' : ''}">${brl(meta.saldoMin)}</strong> · sobra média: ${brl(meta.saldoMedio)}.</p>
      <p style="color:${meta.viavel ? VCORES.ok : VCORES.nao}"><strong>${meta.viavel ? 'Meta viável: mesmo o mês mais apertado sobra o suficiente.'
        : (meta.mesesNecessarios ? `No mês mais apertado sobra menos do que o necessário. Guardando essa sobra, levaria cerca de ${meta.mesesNecessarios} meses.` : 'Há mês sem sobra no período: a meta não fecha sem cortar gastos.')}</strong></p>`
      : '<p class="muted" style="margin-top:12px">Escolha o valor e a data e clique em Calcular meta.</p>'}
  </section>`;
  return out;
}

V.simulador = () => simuladorBase() + blocosSimulador();

// Gasto do dia a dia: a Projeção só conta o que está lançado e o orçamento. Compara a média real dos últimos
// 3 meses (despesas lançadas, sem o orçamento restante) com a despesa prevista para os próximos 3 meses.
// É só um aviso: não muda nenhum cálculo.
function gastoRealVsPrevisto(m0 = mkOf(hoje())) {
  const c2 = v => Math.round(v * 100) / 100;
  const reais = [1, 2, 3].map(i => mesBase(addM(m0, -i))).map(b => b.I - b.ov).filter(v => v > 0.005);
  if (!reais.length) return null;
  const real = reais.reduce((a, v) => a + v, 0) / reais.length;
  const previsto = [0, 1, 2].map(i => mesBase(addM(m0, i)).I).reduce((a, v) => a + v, 0) / 3;
  return { meses: reais.length, real: c2(real), previsto: c2(previsto), falta: c2(real - previsto) };
}
function cardGastoReal() {
  const g = gastoRealVsPrevisto();
  if (!g) return '';
  const otimista = g.falta > Math.max(1, g.real * 0.05);
  return `<section class="card" id="projGastoReal"><h2>Gasto do dia a dia</h2>
      <div class="grid">
        ${card(`Média real (${g.meses} ${g.meses === 1 ? 'mês' : 'meses'})`, brl(g.real), 'Despesas lançadas por mês, sem o orçamento restante', 'neg')}
        ${card('Previsto (próximos 3 meses)', brl(g.previsto), 'Despesas por mês na Projeção', 'neg')}
        ${otimista ? card('Projeção pode estar otimista', `${brl(g.falta)} por mês`, 'A média real é maior que o previsto', 'neg')
          : card('Projeção cobre a média', '✓', 'O previsto é igual ou maior que a média real', 'pos')}
      </div>
      <p class="muted" style="margin-top:10px">${otimista
        ? `Nos últimos meses você gastou em média ${brl(g.real)} por mês, mas a Projeção prevê ${brl(g.previsto)} para os próximos. A diferença costuma ser o gasto do dia a dia que ainda não foi lançado. Para a Projeção ficar realista, ajuste o orçamento variável na aba Orçamento.`
        : 'A despesa prevista para os próximos meses cobre a média real recente.'} Este quadro é só um aviso: não muda os cálculos.</p>
    </section>`;
}

V.projecao = () => {
  const rows = projecao(36).slice(0, horizProj);
  const grupos = agruparPeriodos(rows, periodoProj);
  const botoes = Object.entries(PERIODOS).map(([n, t]) =>
    `<button class="tab ${Number(n) === periodoProj ? 'on' : ''}" onclick="setPeriodo(${n})">${t}</button>`).join('');
  const botoesH = HORIZ_PROJ.map(n =>
    `<button class="tab ${n === horizProj ? 'on' : ''}" onclick="setHorizProj(${n})">${n} meses</button>`).join('');
  const botoesG = Object.entries(GRAFICOS).map(([k, t]) =>
    `<button class="tab ${k === tipoGrafico ? 'on' : ''}" onclick="setGrafico('${k}')">${t}</button>`).join('');
  const legenda = { colunas: 1, linhas: 1 }[tipoGrafico]
    ? `<div class="legenda">
        <span><i class="sw" style="background:var(--g-rec)"></i>Receitas</span>

        <span><i class="sw" style="background:var(--g-saldo)"></i>Saldo acumulado</span>

    : `<p class="muted" style="margin:0 0 6px">${tipoGrafico === 'area' ? 'Saldo acumulado ao fim de cada período.' : 'Receitas menos despesas em cada período. Abaixo de zero, gastou mais do que recebeu.'}</p>`;
  const linhas = grupos.map(g => `<tr>
      <td>${g.rotulo}</td>
      <td class="num pos">${brl(g.rt)}</td><td class="num neg">${brl(g.L)}</td>
      <td class="num ${g.saldo < 0 ? 'neg' : 'pos'}">${brl(g.saldo)}</td>
      <td class="num ${g.acum < 0 ? 'neg' : 'pos'}">${brl(g.acum)}</td>
      <td class="num">${g.futuro ? '—' : brl(g.exec)}</td><td class="num ${g.dif < 0 ? 'neg' : ''}">${g.futuro ? '—' : brl(g.dif)}</td>
    </tr>`).join('');
  return `
    <section class="card">
      <h2>Projeção de ${horizProj} meses · ${PERIODOS[periodoProj]}</h2>
      <div style="display:grid;gap:8px;margin-bottom:12px" id="projOpcoes">
        <div class="row"><span class="muted" style="min-width:64px">Período</span>${botoesH}</div>
        <div class="row"><span class="muted" style="min-width:64px">Agrupar</span>${botoes}</div>
        <div class="row"><span class="muted" style="min-width:64px">Gráfico</span>${botoesG}</div>
      </div>
      ${legenda}
      ${graficoProj(grupos, tipoGrafico)}
    </section>
    ${cardGastoReal()}
    <section class="card"><h2>Comparativo por período</h2><div class="scroll"><table>
      <thead><tr><th>Período</th><th class="num">Receitas</th><th class="num">Despesas</th><th class="num">Saldo</th>
        <th class="num">Saldo acumulado</th><th class="num">Gasto lançado</th><th class="num">Previsto − lançado</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table></div></section>
    <details class="card" ontoggle="detalheAberto = this.open" ${detalheAberto ? 'open' : ''}>
      <summary style="cursor:pointer;font-weight:600">Análise detalhada mês a mês (${rows.length} meses) ▾</summary>
      <div style="margin-top:12px">${tabelaDetalhada(rows)}</div>
    </details>`;
};

// Faixa para escolher o mês visto: setas, seletor de mês e atalho para voltar ao mês atual.
// fnPasso recebe +1 ou −1; fnIr recebe 'aaaa-mm'.
function faixaMes(id, m, fnPasso, fnIr, volta = { alvo: mkOf(hoje()), texto: 'Ir para o mês atual' }) {
  return `<div class="mes-fatura" id="${id}">

      <button type="button" onclick="${fnPasso}(1)" aria-label="Próximo mês">›</button>
    </div>`;
}

/* ---------- mês corrente ---------- */
let mesVisto = null; // mês escolhido na aba "Mês atual"; null = o mês de hoje
function mesVer(m) { mesVisto = m === mkOf(hoje()) ? null : m; render(); }
function mesPasso(n) { mesVer(addM(mesVisto || mkOf(hoje()), n)); }
function resumoVer(m) { setCfg('mesRef', m); }
function resumoPasso(n) { resumoVer(addM(S.config.mesRef, n)); }

V.mesatual = () => {
  const m = mesVisto || mkOf(hoje());
  const ehAtual = m === mkOf(hoje());
  const dia = Number(hoje().slice(8, 10));
  const diasMes = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0).getDate();
  const b = mesBase(m);
  const exec = execMes(m);
  const orc = orcEfetivo(m);
  const sc = scoreOrcamento(m);
  const itens = [
    ...S.lancamentos.filter(l => mkOf(l.data) === m).map(l => ({
      d: l.data, desc: l.descricao, cat: l.categoria, v: l.valor, obs: l.forma || '—'
    })),
    ...S.parcelados.filter(p => parcelaAtiva(p, m)).map(p => ({
      d: p.dataCompra, desc: p.descricao, cat: p.categoria || 'Outros', v: valorParcela(p),
      obs: `Parcela ${mIdx(m) - mIdx(p.inicio) + 1}/${p.parcelas} · ${p.cartao}`
    }))
  ].sort((a, b) => (b.d || '').localeCompare(a.d || ''));
  const barras = S.config.categorias
    .filter(c => (Number(orc[c]) || 0) > 0 || execCat(c, m) > 0)
    .map(c => {
      const bud = Number(orc[c]) || 0, e = execCat(c, m);
      const p = bud > 0 ? Math.min(e / bud * 100, 100) : 100;
      return `<div style="margin:10px 0">
        <div class="row" style="justify-content:space-between"><span>${esc(c)}</span><span class="muted">${brl(e)} de ${brl(bud)}</span></div>
        <div class="bar" style="height:12px"><div class="${bud > 0 && e > bud ? 'over' : ''}" style="width:${p.toFixed(1)}%"></div></div>
      </div>`;
    }).join('') || '<p class="muted">Sem orçamento nem gastos neste mês.</p>';
  const linhas = itens.map(i => `<tr>
      <td>${fmtData(i.d)}</td><td>${esc(i.desc)}</td><td>${esc(i.cat)}</td><td>${esc(i.obs)}</td>
      <td class="num neg">${brl(i.v)}</td></tr>`).join('')
    || `<tr><td colspan="5" class="muted">Nenhum lançamento neste mês.</td></tr>`;
  const emAndamento = ehAtual && dia < diasMes ? ' · mês em andamento (pontuação parcial)' : '';
  const sub = sc.score == null ? 'Defina o orçamento do mês para pontuar' : `Gasto sem orçamento: ${brl(sc.semOrc)}${emAndamento}`;
  return `
    ${faixaMes('mesVisto', m, 'mesPasso', 'mesVer')}
    ${avisoSemReceita(m)}
    <section class="grid">
      ${ehAtual ? card('Dia do mês', `${dia} de ${diasMes}`, `${Math.round(dia / diasMes * 100)}% do mês decorrido`)
        : card('Mês', mNome(m), `${mesRelativo(m)} · ${diasMes} dias`)}
      ${card('Receitas previstas', brl(b.rt), `Fixas ${brl(b.rf)} · eventuais ${brl(b.re)}${b.ferR ? ` · ajuste das férias ${brl(b.ferR)}` : ''}`, 'pos')}
      ${card('Despesas previstas', brl(b.I), despesasTxt(b), 'neg')}
      ${cardDiferenca(b)}
      ${card('Gasto lançado no mês', brl(exec), `No cartão (a pagar) ${brl(exec - aVistaMes(m))} · à vista ${brl(aVistaMes(m))} · ${Math.round(exec / Math.max(b.I, 1) * 100)}% das despesas previstas`)}
      ${card('Saldo em conta hoje', brl(saldoContaEm(hoje())), `Pago no Débito, Pix e Dinheiro no mês: ${brl(pagoMes(m))} · veja a aba Conta`, saldoContaEm(hoje()) < 0 ? 'neg' : 'pos')}
    </section>
    <section class="grid">
      ${gauge(sc.score, `Aderência ao orçado · ${mNome(m)}`, sub)}
      <section class="card"><h2>Orçado x gasto por categoria</h2>${barras}</section>
    </section>
    <section class="card"><h2>Lançamentos do mês</h2><div class="scroll"><table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma / parcela</th><th class="num">Valor</th></tr></thead>
      <tbody>${linhas}</tbody>

// Receitas previstas menos despesas previstas do mês.
const cardDiferenca = b => {
  const d = Math.round((b.rt - b.I) * 100) / 100;
  return card('Receita − despesa', brl(d), d < 0 ? 'Faltam: as despesas passam das receitas' : d > 0 ? 'Sobra: as receitas cobrem as despesas' : 'Receitas e despesas empatadas', d < 0 ? 'neg' : 'pos');
};
// Mês com despesas e sem nenhuma receita prevista: comum quando o salário está só em Eventuais, em outro mês.
function avisoSemReceita(m) {
  const b = mesBase(m);
  if (b.rt > 0.005 || b.I <= 0.005) return '';
  const fora = S.eventuais.filter(e => e.tipo === 'Receita' && e.mes !== m);
  return `<div class="aviso sem-receita" style="margin:0"><span>Nenhuma receita prevista em ${mNome(m)}.${fora.length
    ? ` Há receita em Eventuais em outro mês (${mNome(fora[fora.length - 1].mes)}). Se ela se repete, como o salário, use "Repetir todo mês" na aba Eventuais.`
    : ' Se você recebe todo mês, cadastre o valor em Recorrentes.'}</span>
    <button class="small" onclick="ir('${fora.length ? 'eventuais' : 'recorrentes'}')">Abrir ${fora.length ? 'Eventuais' : 'Recorrentes'}</button></div>`;
}
const despesasTxt = b =>`Fixas ${brl(b.ef)} · faturas ${brl(b.fat)} · à vista ${brl(b.av)} · eventuais ${brl(b.ed)} · orçamento restante ${brl(b.ov)}${b.ferD ? ` · extras das férias ${brl(b.ferD)}` : ''}`;

V.resumo = () => {
  const m = S.config.mesRef;
  const b = mesBase(m);
  const exec = execMes(m);
  const proj = projecao(36);
  const cards = S.config.cartoes.map(c => `<tr><td>${esc(c)}</td><td class="num">${brl(fatCartao(c, m))}</td></tr>`).join('')
    || `<tr><td colspan="2" class="muted">Nenhum cartão cadastrado.</td></tr>`;
  const orc = orcEfetivo(m);
  const estouros = S.config.categorias.filter(c => (Number(orc[c]) || 0) > 0 && execCat(c, m) > orc[c]);
  return `
    ${faixaMes('resumoMes', m, 'resumoPasso', 'resumoVer')}
    ${avisoSemReceita(m)}
    ${blocoScores(m)}
    <section class="grid">
      ${card('Mês de referência', mNome(m), 'Altere na faixa acima')}
      ${card('Receitas previstas', brl(b.rt), `Fixas ${brl(b.rf)} · eventuais ${brl(b.re)}${b.ferR ? ` · ajuste das férias ${brl(b.ferR)}` : ''}`, 'pos')}
      ${card('Despesas previstas', brl(b.I), despesasTxt(b), 'neg')}
      ${cardDiferenca(b)}
      ${card('Gasto lançado no mês', brl(exec), `No cartão (a pagar) ${brl(exec - aVistaMes(m))} · à vista ${brl(aVistaMes(m))}`)}
